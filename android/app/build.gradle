apply plugin: 'com.android.application'

// Prisma (Ticket 10 von .scratch/umbau/). Version aus package.json (android.versionCode, android.versionName): vor jedem
// Upload in den Play Store versionCode um 1 erhöhen (der Store nimmt jede Nummer nur einmal).
def paket = new groovy.json.JsonSlurper().parse(file('../../package.json'))

// Upload-Schlüssel (Play App Signing: Google signiert die App für die Geräte, wir nur den Upload). Schlüssel und
// Passwort liegen nie im Repo, sondern in keystore.properties ausserhalb (storeFile, storePassword, keyAlias,
// keyPassword): Pfad in der Umgebungsvariablen PRISMA_SCHLUESSEL, sonst <Benutzerordner>/prisma-schluessel/. Fehlt die
// Datei, baut Gradle die Release-Fassung unsigniert (mit Warnung).
def schluesselDatei = file(System.getenv('PRISMA_SCHLUESSEL') ?: "${System.getProperty('user.home')}/prisma-schluessel/keystore.properties")
def schluessel = new Properties()
if (schluesselDatei.exists()) {
    schluesselDatei.withInputStream { schluessel.load(it) }
} else {
    logger.warn("Prisma: ${schluesselDatei} fehlt, die Release-Fassung bleibt unsigniert")
}

android {
    namespace = "ch.bonomo.prisma"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ch.bonomo.prisma"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode paket.android.versionCode as int
        versionName paket.android.versionName as String
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // nur die Sprachen des Spiels: Die Bibliotheken bringen Texte in rund 80 Sprachen mit, der Store zählte sie sonst
    // als Sprachen der App
    androidResources {
        localeFilters += ['en', 'de']
    }
    signingConfigs {
        if (schluessel['storeFile']) {
            upload {
                storeFile file(schluessel['storeFile'])
                storePassword schluessel['storePassword']
                keyAlias schluessel['keyAlias']
                keyPassword schluessel['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (schluessel['storeFile']) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

   HINTERGRUND — Sternenhimmel mit Milchstrasse
   Die Kamera blickt schräg von oben (im Hochformat steiler): Zu sehen sind vor allem Richtungen nach unten, rund um
   das schwebende Feld. In der Ausgangsansicht läuft die Milchstrasse deshalb als Band diagonal hinter dem Feld durch,
   ihr heller Kern liegt über dem Feld. Die Kamera kreist frei ums Feld – Sterne und Band gehen daher ganz herum.
   Im Band liegen Sternwolken, Staub und einzelne farbige Gasnebel; abseits davon die beiden Magellanschen Wolken,
   die man erst beim Drehen entdeckt. Alles bleibt dunkel und unter der Bloom-Schwelle, nur die hellsten Sterne glimmen beim Funkeln knapp darüber –
   Strahlen und Ziele bleiben vorne.
   ===================================================================== */

const SKY = {
  glow: 0.05,       // Helligkeit der Milchstrasse (linear)
  stars: 15000,     // Sterne rund um die Bandmitte (Kappe bis capDeg); der übrige Himmel kommt gleich dicht dazu
  capDeg: 80,
  bandArc: 1.4,     // Bogen des Bands in der Kappe (rad, je Seite der Mitte)
  bandStars: 0.5,   // Anteil der Sterne dicht am Band
  // Lage der Milchstrasse je Bildformat: Blickwinkel phi (von der Senkrechten, wie cameraRig.basePhi), Bandmitte so
  // viele Grad über der Blickrichtung, Neigung des Bands gegen die Waagrechte des Bildes, Kern entlang des Bands.
  // Hochformat: diagonal hinter dem Feld durch. Breitformat: Das Feld deckt die Mitte ab – das Band läuft flach
  // durch den Streifen über dem Feld, der Kern steht rechts oben. Dazwischen wird übergeblendet (updateSky).
  tall: { phi: 0.46, up: 11.5, tilt: 62, core: 9 },
  wide: { phi: 0.86, up: 13, tilt: 8, core: 20 },
  // Magellansche Wolken: Dreht man die Kamera um turn (°), stehen sie, wo in der Ausgangsansicht die Bandmitte steht,
  // nur up ° höher (Hochformat, Breitformat) – dort in jedem Bildformat 40–56° neben dem Band. Im Hochformat unter
  // der Platte (dort ist viel Himmel frei), im Breitformat im Streifen darüber. Halbachsen in rad, lange Achse in °.
  lmc: { turn: 205, up: [-24, -1], axes: [0.075, 0.05], angle: 25 },
  smc: { turn: 222, up: [-29, -5], axes: [0.04, 0.025], angle: -10 },
};
/**
 * Lage des Himmels für ein Bildformat als Drehung vom Himmels- ins Weltsystem. Himmelsachsen: x entlang des Bands,
 * y Normale der Band-Ebene (galaktische Breite), z Bandmitte.
 */
function skyFrame({ phi, up, tilt }) {
  const rad = THREE.MathUtils.degToRad;
  const view = new THREE.Vector3(0, -Math.cos(phi), -Math.sin(phi));
  const screenUp = new THREE.Vector3(0, Math.sin(phi), -Math.cos(phi)); // im Bild oben, senkrecht zur Blickrichtung
  const center = view.clone().multiplyScalar(Math.cos(rad(up))).addScaledVector(screenUp, Math.sin(rad(up)));
  const centerUp = screenUp.clone().multiplyScalar(Math.cos(rad(up))).addScaledVector(view, -Math.sin(rad(up)));
  const along = new THREE.Vector3(Math.cos(rad(tilt)), 0, 0).addScaledVector(centerUp, Math.sin(rad(tilt)));
  const normal = new THREE.Vector3().crossVectors(center, along);
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(along, normal, center));
}
const skyTall = skyFrame(SKY.tall), skyWide = skyFrame(SKY.wide);

// Wertrauschen und fBm für die Shader von Himmel, Sonne und Planeten
const GLSL_NOISE = `
  float hash(vec3 p) {
    p = fract(p * 0.3183099 + 0.1);
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float noise(vec3 x) {
    vec3 i = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
               mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
  }
  float fbm(vec3 p) {
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 1.7; a *= 0.5; }
    return v;
  }
  float fbm3(vec3 p) { // grob und günstiger, für grossflächige Muster
    return 0.5 * noise(p) + 0.25 * noise(p * 2.03 + 1.7) + 0.125 * noise(p * 4.12 + 5.1);
  }`;

/* Schattenkarte für Hintergründe, deren Schattenwerfer stillstehen (Strand): einmal beim Bauen aus der Richtung
   des Lichts gerendert, die Tiefe in RGBA verpackt (geht auch ohne Tiefentexturen). Die Shader fragen sie mit
   objectShadow ab (shadowGLSL; Uniforms uShadow, uShadowMat). */
const SHADOW_DEPTH_FRAGMENT = `#include <packing>
  void main() { gl_FragColor = packDepthToRGBA(gl_FragCoord.z); }`;
const shadowGLSL = (size) => `
  uniform sampler2D uShadow;
  uniform mat4 uShadowMat;
  #include <packing>
  // Licht an p (1) oder im Schatten (0), 5 Proben im Umkreis von soft Pixeln für weiche Ränder; ausserhalb der Karte
  // im Licht
  float objectShadowSoft(vec3 p, float bias, float soft) {
    vec3 c = (uShadowMat * vec4(p, 1.0)).xyz * 0.5 + 0.5;
    if (c.x < 0.0 || c.x > 1.0 || c.y < 0.0 || c.y > 1.0) return 1.0;
    float O = soft / ${size.toFixed(1)}; // Proben gedreht verteilt: weniger Treppen am Rand
    float lit = step(c.z - bias, unpackRGBAToDepth(texture2D(uShadow, c.xy)));
    lit += step(c.z - bias, unpackRGBAToDepth(texture2D(uShadow, c.xy + vec2(-0.6, -1.5) * O)));
    lit += step(c.z - bias, unpackRGBAToDepth(texture2D(uShadow, c.xy + vec2(1.5, -0.6) * O)));
    lit += step(c.z - bias, unpackRGBAToDepth(texture2D(uShadow, c.xy + vec2(-1.5, 0.6) * O)));
    lit += step(c.z - bias, unpackRGBAToDepth(texture2D(uShadow, c.xy + vec2(0.6, 1.5) * O)));
    return lit * 0.2;
  }
  float objectShadow(vec3 p, float bias) { return objectShadowSoft(p, bias, 1.0); }`;
/**
 * Rendert die Schattenwerfer in casters (Materialien mit SHADOW_DEPTH_FRAGMENT) aus Richtung dir, orthografisch um den
 * Quader box. Setzt uniforms.uShadow und uShadowMat; nach einem verlorenen Grafikkontext wird neu gezeichnet (sonst
 * wäre die Karte leer und alles läge im Schatten).
 */
function bakeShadowMap(casters, box, dir, size, uniforms) {
  const cam = new THREE.OrthographicCamera();
  const center = box.getCenter(new THREE.Vector3());
  cam.position.copy(center).addScaledVector(dir, 300);
  cam.lookAt(center);
  cam.updateMatrixWorld();
  const lo = new THREE.Vector3(Infinity, Infinity, Infinity), hi = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
  for (let k = 0; k < 8; k++) {
    const v = new THREE.Vector3(k & 1 ? box.max.x : box.min.x, k & 2 ? box.max.y : box.min.y, k & 4 ? box.max.z : box.min.z);
    v.applyMatrix4(cam.matrixWorldInverse);
    lo.min(v); hi.max(v);
  }
  Object.assign(cam, { left: lo.x - 1, right: hi.x + 1, bottom: lo.y - 1, top: hi.y + 1, near: -hi.z - 1, far: -lo.z + 1 });
  cam.updateProjectionMatrix();
  const target = new THREE.WebGLRenderTarget(size, size, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false,
  });
  const render = () => {
    const clearColor = renderer.getClearColor(new THREE.Color()), clearAlpha = renderer.getClearAlpha();
    renderer.setRenderTarget(target);
    renderer.setClearColor(0xffffff, 1); // ganz hinten: nichts wirft Schatten
    renderer.clear();
    renderer.render(casters, cam);
    renderer.setRenderTarget(null);
    renderer.setClearColor(clearColor, clearAlpha);
  };
  render();
  renderer.domElement.addEventListener('webglcontextrestored', render);
  uniforms.uShadow.value = target.texture;
  uniforms.uShadowMat.value.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
}

// Nächtlicher Wald: Mond, Dunst und Himmel der Himmelskugel. Davor liegt das Panorama aus Blender (WALD); die Kugel
// sieht man in der Spiegelung der Platte und solange das Panorama lädt. Der Mond steht wie in der Blender-Szene
// (tools/blender). Der Dunst ist zum Mond hin gut doppelt so hell (Vorwärtsstreuung), oben tiefblau, um den Mond ein Hof.
const FOREST_MOON = new THREE.Vector3(-0.8, 0.5, 0.25).normalize(); // seitlich, gut 30° hoch: lange Schatten
const FOREST_GLSL = `
  const vec3 FOREST_MOON = vec3(${FOREST_MOON.toArray().map((v) => v.toFixed(4)).join(', ')});
  // Dunst in Blickrichtung (nur waagrecht gewertet, sonst wäre er beim Blick nach unten überall gleich): zum Mond hin
  // hell und neutral, sonst schiefergrau-blau
  vec3 forestMist(vec3 viewDir) {
    vec2 h = normalize(viewDir.xz + vec2(1e-4)), m = normalize(FOREST_MOON.xz);
    float toMoon = max(dot(h, m), 0.0);
    return vec3(0.07, 0.083, 0.112) + vec3(0.16, 0.16, 0.155) * pow(toMoon, 4.0) + vec3(0.025, 0.027, 0.03) * toMoon;
  }
  // Himmel: am Horizont der Dunst, oben tiefblau; der Mond als kleine Scheibe mit Hof (vom Rand der Scheibe an alle
  // 1,5 Radien halb so hell, ein schwacher Schein reicht weit)
  vec3 forestSky(vec3 d) {
    float y = max(d.y, 0.0);
    vec3 col = mix(forestMist(d), vec3(0.005, 0.009, 0.022), smoothstep(0.0, 0.55, y));
    const float R = 0.012; // Radius der Mondscheibe (rad)
    float r = acos(clamp(dot(d, FOREST_MOON), -1.0, 1.0));
    col += vec3(0.16, 0.17, 0.19) * exp2(-max(r - R, 0.0) / (1.5 * R)) + vec3(0.035, 0.04, 0.05) * exp(-r / 0.22);
    col = mix(col, vec3(2.6, 2.5, 2.3), smoothstep(R * 1.08, R * 0.92, r));
    return col;
  }`;

const background = new THREE.Mesh(
  new THREE.SphereGeometry(80, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uSkyRot: { value: new THREE.Matrix3() }, // Welt → Himmel (updateSky)
      // Himmel → Welt im Hochformat: Die Wolken liegen fest am Band und sehen im Hochformat aus wie entworfen
      uCloudRot: { value: new THREE.Matrix3().setFromMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(skyTall)) },
      uCore: { value: new THREE.Vector3(0, 0, 1) }, // Richtung des Kerns im Himmelssystem (updateSky)
      uGlow: { value: SKY.glow },
      uForest: { value: 0 }, // 0 … 1: Nebel des nächtlichen Waldes statt Weltraum (skyTheme)
      // Magellansche Wolken: Welt → Tangentialebene um die Mitte, in Halbachsen (updateSky)
      uLmc: { value: new THREE.Matrix3() },
      uSmc: { value: new THREE.Matrix3() },
    },
    // Richtung von der Kamera aus, damit der Himmel aus jeder Position gleich aussieht (unendlich weit weg).
    vertexShader: `varying vec3 vDir; void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vDir = normalize(wp.xyz - cameraPosition);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
    fragmentShader: `
      uniform float uGlow, uForest;
      uniform mat3 uSkyRot, uCloudRot, uLmc, uSmc;
      uniform vec3 uCore;
      varying vec3 vDir;
      ${GLSL_NOISE}
      ${FOREST_GLSL}
      // Magellansche Wolke: fleckig ausfransender Nebel aus Sternenlicht um die Mitte von m (siehe uLmc)
      vec3 satellite(mat3 m, vec3 d, vec3 seed, float pink) {
        vec3 l = m * d;
        if (l.z <= 0.0) return vec3(0.0);
        vec2 p = l.xy / l.z; // in Halbachsen
        float r2 = dot(p, p);
        if (r2 > 6.0) return vec3(0.0);
        float n = fbm(d * 38.0 + seed);
        float body = exp(-r2 * (1.9 - 1.6 * n)) * (0.3 + 1.4 * n * n);
        float bar = exp(-p.x * p.x * 1.6 - p.y * p.y * 14.0) * 0.5; // heller Balken längs der langen Achse
        vec2 k = p - vec2(0.45, 0.35);
        float knot = pink * exp(-dot(k, k) * 30.0) * (0.5 + n); // rosa Gasnebel am Rand (Tarantelnebel)
        return vec3(0.72, 0.78, 1.0) * (body + bar) + vec3(1.0, 0.36, 0.52) * knot;
      }
      void main(){
        vec3 d = normalize(vDir);
        // tiefer Raum: fast schwarz, ein Hauch Blau-Violett
        vec3 col = vec3(0.0012, 0.0011, 0.0028) + vec3(0.0016, 0.0012, 0.0038) * (0.5 + 0.5 * d.y);
        // Milchstrasse: Band um die Ebene y = 0 des Himmelssystems, wolkig, mit dunklen Staubstreifen und warmem Kern
        vec3 s = uSkyRot * d;
        float lat = s.y;
        float core = pow(max(dot(s, uCore), 0.0), 18.0);
        float width = 0.11 + 0.09 * core;
        float band = exp(-lat * lat / (width * width));
        if (band > 0.003 && uGlow > 0.0) { // uGlow 0: Sonnensystem, nur Sterne (skyTheme)
          vec3 q = (uCloudRot * s) * 4.5; // Wolken fest am Band (im Hochformat genau die Weltrichtung)
          float clouds = fbm(q);
          float dust = fbm(q * 2.4 + vec3(5.2, 1.3, 8.4));
          // Sternwolken: helle Klumpen heben sich ab
          float glow = band * (0.22 + 1.1 * clouds * clouds + 0.9 * smoothstep(0.5, 0.72, clouds)) + band * core * 1.1;
          float l = (lat - 0.25 * width * (clouds - 0.5)) / (0.45 * width); // kein pow(): Basis kann negativ sein
          float lane = exp(-l * l);
          // Staub: der lange Streifen in der Mitte, daneben einzelne dunkle Wolken
          float shade = 1.0 - 0.85 * lane * smoothstep(0.42, 0.68, dust) - 0.5 * (1.0 - lane) * smoothstep(0.56, 0.7, dust);
          glow *= shade;
          vec3 tint = mix(vec3(0.58, 0.64, 1.0), vec3(0.95, 0.88, 0.80), clamp(core * 1.2, 0.0, 1.0));
          col += tint * glow * uGlow;
          // Gasnebel nahe der Bandebene, selten und fädig: rosa leuchtender Wasserstoff, bläulich angestrahlter Staub
          float place = fbm3(q * 0.45 + vec3(11.3, 4.1, 7.9));
          float plane = exp(-lat * lat / (0.6 * width * width));
          float wisps = 0.3 + 2.2 * clouds * dust;
          vec3 neb = vec3(1.0, 0.32, 0.46) * smoothstep(0.56, 0.68, place) + vec3(0.36, 0.56, 1.0) * 0.6 * smoothstep(0.34, 0.26, place);
          col += neb * plane * wisps * shade * 2.4 * uGlow;
        }
        if (uGlow > 0.0) col += (satellite(uLmc, d, vec3(3.0, 9.0, 1.0), 1.0) + 0.8 * satellite(uSmc, d, vec3(7.0, 2.0, 5.0), 0.0)) * 1.8 * uGlow;
        // Wald: Dunst und Mond (davor das Panorama aus Blender, siehe WALD)
        if (uForest > 0.0) col = mix(col, forestSky(d), uForest);
        // Alpha 0 = Himmel: Der letzte Bildschritt lässt hier die Farbverschiebung am Bildrand weg (Sterne!)
        gl_FragColor = vec4(col, 0.0);
      }`,
  })
);
// Nach den undurchsichtigen Objekten zeichnen (bleibt vor allen transparenten): Wo Platte oder Elemente schon stehen,
// verwirft der Tiefentest die Pixel, bevor der teure Milchstrassen-Shader läuft.
background.renderOrder = 1000;
scene.add(background);

/**
 * Sterne: feste Punkte im Himmelssystem (immer gleich angeordnet), rund und kantengeglättet, am Band dichter; helle
 * funkeln leicht. Die Drehung ins Weltsystem setzt updateSky.
 */
function createStars() {
  const rand = mulberry32(31);
  const gauss = () => Math.sqrt(-2 * Math.log(rand() + 1e-9)) * Math.cos(2 * Math.PI * rand());
  // Zuerst die Kappe um die Bandmitte, wie für die Ausgangsansicht entworfen; danach der übrige Himmel (Band und
  // Rest) gleich dicht – die Kamera kreist frei ums Feld. Die Kappe zieht dieselben Zufallszahlen wie zuvor allein.
  const capCos = Math.cos(THREE.MathUtils.degToRad(SKY.capDeg));
  const cap = SKY.stars;
  const band = Math.round(cap * SKY.bandStars * (Math.PI / SKY.bandArc - 1));
  const n = cap + band + Math.round(cap * (1 - SKY.bandStars) * (1 + capCos) / (1 - capCos));
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), info = new Float32Array(n * 4);
  // Sternfarben von bläulich über weiss bis warm, mit Häufigkeit
  const TINTS = [[0.70, 0.80, 1.0, 0.2], [0.86, 0.91, 1.0, 0.3], [1.0, 1.0, 1.0, 0.25], [1.0, 0.91, 0.78, 0.17], [1.0, 0.76, 0.6, 0.08]];
  const d = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const inCap = i < cap;
    if (inCap ? rand() < SKY.bandStars : i < cap + band) {
      // entlang des Bands (in der Kappe bis ±bandArc, sonst der Rest des Kreises), Breite normalverteilt
      const u = rand() * 2 - 1;
      const s = inCap ? u * SKY.bandArc : Math.sign(u) * (SKY.bandArc + Math.abs(u) * (Math.PI - SKY.bandArc));
      const lat = gauss() * 0.055;
      d.set(Math.sin(s) * Math.cos(lat), Math.sin(lat), Math.cos(s) * Math.cos(lat));
    } else {
      do d.set(gauss(), gauss(), gauss()).normalize(); while (inCap ? d.z < capCos : d.z >= capCos);
    }
    d.toArray(pos, i * 3);
    const b = 0.05 + 0.85 * Math.pow(rand(), 8);          // die meisten schwach, wenige hell
    let r = rand(), t = 0;
    while (t < TINTS.length - 1 && r > TINTS[t][3]) r -= TINTS[t++][3];
    col.set(TINTS[t].slice(0, 3), i * 3);
    info.set([b, 1.1 + b * 2.6, rand(), b > 0.25 ? 1 : 0.25], i * 4); // Helligkeit, Grösse (px), Phase, Funkeln
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aStar', new THREE.BufferAttribute(info, 4));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uFade: { value: 1 }, uForest: { value: 0 } },
    vertexShader: `
      attribute vec3 aColor;
      attribute vec4 aStar;
      uniform float uTime, uPixelRatio, uFade, uForest;
      varying vec3 vColor;
      void main() {
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position * 70.0, 1.0);
        float twinkle = 1.0 + aStar.w * 0.22 * sin(uTime * (0.6 + aStar.z * 1.4) + aStar.z * 40.0);
        // im Wald schwächer (der Mond überstrahlt sie) und nur über dem Horizont – darunter liegen Dunst und Nebel
        float above = mix(1.0, smoothstep(0.0, 0.12, normalize(mat3(modelMatrix) * position).y), uForest);
        vColor = aColor * aStar.x * twinkle * uFade * above;
        gl_PointSize = aStar.y * uPixelRatio;
      }`,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        float a = smoothstep(0.5, 0.1, length(gl_PointCoord - 0.5));
        gl_FragColor = vec4(vColor * a, 0.0);
      }`,
    transparent: true,
    depthWrite: false,
    // additiv, aber Alpha unverändert lassen: Alpha 0 markiert den Himmel (siehe Hintergrund)
    blending: THREE.CustomBlending,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
    fog: false,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  points.renderOrder = -99;
  points.layers.set(LAYER_NO_REFLECT);
  points.raycast = () => {};
  return points;
}
const stars = createStars();
scene.add(stars);

/** Himmel aufs Bildformat ausrichten (0 = Hochformat, 1 = Breitformat; aus fitCameraDistance). */
function updateSky(wide) {
  stars.quaternion.slerpQuaternions(skyTall, skyWide, wide);
  const u = background.material.uniforms;
  u.uSkyRot.value.setFromMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(stars.quaternion)).transpose();
  const core = THREE.MathUtils.degToRad(THREE.MathUtils.lerp(SKY.tall.core, SKY.wide.core, wide));
  u.uCore.value.set(Math.sin(core), 0, Math.cos(core));
  const center = new THREE.Vector3(0, 0, 1).applyQuaternion(stars.quaternion); // Bandmitte in der Welt
  satelliteFrame(u.uLmc.value, center, SKY.lmc, wide);
  satelliteFrame(u.uSmc.value, center, SKY.smc, wide);
}

/** Matrix für satellite() im Shader: Welt → (lange Achse, kurze Achse) in Halbachsen und Abstand zur Mitte. */
function satelliteFrame(m, center, { turn, up, axes, angle }, wide) {
  const rad = THREE.MathUtils.degToRad, Y = new THREE.Vector3(0, 1, 0);
  const c = center.clone().applyAxisAngle(Y, rad(turn));
  let east = new THREE.Vector3().crossVectors(Y, c).normalize();
  const lift = rad(THREE.MathUtils.lerp(up[0], up[1], wide));
  c.multiplyScalar(Math.cos(lift)).addScaledVector(new THREE.Vector3().crossVectors(c, east), Math.sin(lift));
  east = new THREE.Vector3().crossVectors(Y, c).normalize();
  const north = new THREE.Vector3().crossVectors(c, east);
  const a = east.clone().multiplyScalar(Math.cos(rad(angle))).addScaledVector(north, Math.sin(rad(angle)));
  const b = new THREE.Vector3().crossVectors(c, a);
  m.set(a.x / axes[0], a.y / axes[0], a.z / axes[0], b.x / axes[1], b.y / axes[1], b.z / axes[1], c.x, c.y, c.z);
}

/* =====================================================================
   SONNENSYSTEM — zweiter Hintergrund (umschaltbar, siehe skyTheme)
   Das Brett schwebt über der Sonne, die Planeten kreisen um beide. Grössen und Abstände sind gestaucht (sonst wären
   die inneren Planeten winzige Punkte und Neptun weit ausserhalb des Bildes), die Umlaufzeiten gestaffelt wie in
   echt, aber zusammengestaucht (Wurzel der echten Verhältnisse). Die äusseren Bahnen liegen tiefer: So ziehen alle
   Planeten auf der fernen Seite durch den Streifen über der Platte – im Hoch- wie im Breitformat. Alles berechnet,
   ohne Bilddateien; nicht in der Bodenspiegelung.
   ===================================================================== */

const SOLAR = {
  sunY: -6, sunRadius: 2.8,
  slope: 0.5,         // Bahnen sinken nach aussen: Höhe = -1.5 - slope * (Abstand - 7.6)
  mercuryPeriod: 60,  // s je Umlauf; die anderen nach der Wurzel der echten Umlaufzeiten
  // Bahnradius, Grösse, echte Umlaufzeit (Jahre), Anfangswinkel (°, 90 = hinter dem Feld), Bahnneigung (°),
  // Achsneigung (°), Eigendrehung (s, negativ = rückwärts)
  planets: [
    { name: 'Merkur', kind: 0, orbit: 7.6, size: 0.24, years: 0.24, phase: 160, incl: 7, tilt: 0, spin: 90 },
    { name: 'Venus', kind: 1, orbit: 9.0, size: 0.35, years: 0.62, phase: 20, incl: 3.4, tilt: 177, spin: -160 },
    { name: 'Erde', kind: 2, orbit: 10.6, size: 0.37, years: 1, phase: 70, incl: 0, tilt: 23, spin: 40 },
    { name: 'Mars', kind: 3, orbit: 12.2, size: 0.28, years: 1.88, phase: 235, incl: 1.9, tilt: 25, spin: 42 },
    { name: 'Jupiter', kind: 4, orbit: 15.5, size: 1.05, years: 11.86, phase: 118, incl: 1.3, tilt: 3, spin: 24 },
    { name: 'Saturn', kind: 5, orbit: 19.5, size: 0.95, years: 29.46, phase: 52, incl: 2.5, tilt: 27, spin: 26, ring: true },
    { name: 'Uranus', kind: 6, orbit: 23.5, size: 0.68, years: 84, phase: 300, incl: 0.8, tilt: 98, spin: -36 },
    { name: 'Neptun', kind: 7, orbit: 27, size: 0.66, years: 165, phase: 95, incl: 1.8, tilt: 28, spin: 34 },
  ],
  moon: { size: 0.1, distance: 0.75, period: 9 },
};

const solarUniforms = {
  uSun: { value: new THREE.Vector3(0, SOLAR.sunY, 0) },
  uFade: { value: 0 },  // 0 … 1 beim Umschalten (skyTheme)
  uTime: { value: 0 },
};

// Oberflächen nach Art: 0 Merkur/Mond, 1 Venus, 2 Erde, 3 Mars, 4 Jupiter, 5 Saturn, 6 Uranus, 7 Neptun.
// Gezeichnet im Objektsystem (dreht mit), beleuchtet von der Sonne; Atmosphären leuchten am Rand.
const PLANET_SHADER = {
  vertexShader: `varying vec3 vObj, vN, vPos;
    void main() {
      vObj = position;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vPos = wp.xyz;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 uSun;
    uniform float uFade, uTime;
    uniform int uKind;
    varying vec3 vObj, vN, vPos;
    ${GLSL_NOISE}
    // Wolkenbänder der Gasriesen: Streifen nach Breite, verwirbelt
    vec3 bands(vec3 p, float n, float turb, vec3 dark, vec3 light) {
      float b = p.y * n + (fbm(p * vec3(2.5, 9.0, 2.5) + 4.0) - 0.5) * turb;
      return mix(dark, light, 0.5 + 0.5 * sin(b * 3.1416));
    }
    void main() {
      vec3 p = normalize(vObj);
      vec3 col, atm = vec3(0.0);
      if (uKind == 0) {
        col = vec3(0.42, 0.40, 0.38) * (0.55 + 0.7 * fbm(p * 7.0));
      } else if (uKind == 1) {
        col = mix(vec3(0.80, 0.66, 0.42), vec3(0.95, 0.88, 0.68), fbm(vec3(p.x * 2.0, p.y * 7.0, p.z * 2.0) + 2.0));
        atm = vec3(0.9, 0.8, 0.5) * 0.35;
      } else if (uKind == 2) {
        float h = fbm(p * 2.2 + vec3(1.7, 9.2, 4.4));
        vec3 ocean = mix(vec3(0.015, 0.05, 0.20), vec3(0.03, 0.14, 0.36), smoothstep(0.3, 0.5, h));
        vec3 land = mix(vec3(0.09, 0.24, 0.07), vec3(0.50, 0.40, 0.22), smoothstep(0.35, 0.65, fbm(p * 6.0)));
        col = mix(ocean, land, smoothstep(0.50, 0.53, h));
        col = mix(col, vec3(0.9), smoothstep(0.80, 0.86, abs(p.y) + 0.08 * (h - 0.5))); // Polkappen
        float a = uTime * 0.02; // Wolken ziehen langsam über die Oberfläche
        vec3 q = vec3(p.x * cos(a) - p.z * sin(a), p.y, p.x * sin(a) + p.z * cos(a));
        col = mix(col, vec3(0.92), 0.85 * smoothstep(0.52, 0.68, fbm(q * vec3(3.5, 6.0, 3.5) + 7.0)));
        atm = vec3(0.25, 0.45, 1.0) * 0.6;
      } else if (uKind == 3) {
        col = mix(vec3(0.66, 0.30, 0.14), vec3(0.38, 0.17, 0.10), smoothstep(0.45, 0.62, fbm(p * 3.0 + 5.0)));
        col = mix(col, vec3(0.9, 0.86, 0.82), smoothstep(0.90, 0.94, abs(p.y)));
        atm = vec3(0.8, 0.5, 0.4) * 0.15;
      } else if (uKind == 4) {
        col = bands(p, 9.0, 1.6, vec3(0.60, 0.42, 0.30), vec3(0.93, 0.87, 0.76));
        vec3 d = p - normalize(vec3(0.94, -0.36, 0.0)); // Grosser Roter Fleck
        col = mix(col, vec3(0.72, 0.30, 0.18), 0.9 * exp(-dot(d.xz, d.xz) / 0.012 - d.y * d.y / 0.004));
        atm = vec3(0.9, 0.8, 0.7) * 0.15;
      } else if (uKind == 5) {
        col = bands(p, 7.0, 0.8, vec3(0.74, 0.62, 0.42), vec3(0.93, 0.85, 0.64));
        atm = vec3(0.9, 0.8, 0.6) * 0.12;
      } else if (uKind == 6) {
        col = mix(vec3(0.52, 0.76, 0.80), vec3(0.62, 0.84, 0.86), 0.5 + 0.5 * sin(p.y * 10.0));
        atm = vec3(0.5, 0.85, 0.9) * 0.3;
      } else {
        col = bands(p, 8.0, 1.0, vec3(0.13, 0.24, 0.64), vec3(0.24, 0.42, 0.88));
        vec3 d = p - normalize(vec3(-0.6, -0.35, 0.7)); // dunkler Fleck
        col = mix(col, vec3(0.06, 0.10, 0.35), 0.8 * exp(-dot(d, d) / 0.01));
        atm = vec3(0.35, 0.55, 1.0) * 0.35;
      }
      vec3 N = normalize(vN), L = normalize(uSun - vPos), V = normalize(cameraPosition - vPos);
      float ndl = dot(N, L);
      float lit = clamp(ndl * 0.92 + 0.08, 0.0, 1.0); // etwas weicher Übergang zur Nachtseite
      float rim = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.5) * smoothstep(-0.25, 0.4, ndl);
      gl_FragColor = vec4((col * (0.02 + 1.15 * lit) + atm * rim) * uFade, 1.0);
    }`,
};

const solar = (() => {
  const group = new THREE.Group();
  group.visible = false;
  const noPick = (o) => { o.layers.set(LAYER_NO_REFLECT); o.raycast = () => {}; o.frustumCulled = o.isMesh; return o; };

  // Sonne: brodelnde Oberfläche, zum Rand dunkler; hell genug für Bloom, liegt aber fast ganz hinter der Platte
  const sun = noPick(new THREE.Mesh(new THREE.SphereGeometry(SOLAR.sunRadius, 48, 32), new THREE.ShaderMaterial({
    uniforms: solarUniforms, fog: false,
    vertexShader: PLANET_SHADER.vertexShader,
    fragmentShader: `uniform float uFade, uTime;
      varying vec3 vObj, vN, vPos;
      ${GLSL_NOISE}
      void main() {
        vec3 p = normalize(vObj);
        float g = fbm(p * 6.0 + vec3(0.0, uTime * 0.04, 0.0));
        float mu = clamp(dot(normalize(vN), normalize(cameraPosition - vPos)), 0.0, 1.0);
        vec3 col = mix(vec3(1.0, 0.42, 0.10), vec3(1.0, 0.82, 0.50), g) * (1.3 + 1.3 * g) * (0.45 + 0.55 * sqrt(mu));
        gl_FragColor = vec4(col * uFade, 1.0);
      }`,
  })));
  sun.position.copy(solarUniforms.uSun.value);
  group.add(sun);

  // Korona: Leuchten um die Sonne, das rund um die Platte hervorscheint (Billboard, additiv, Alpha bleibt 0 = Himmel)
  const CORONA = 17; // halbe Breite des Billboards
  const corona = noPick(new THREE.Mesh(new THREE.PlaneGeometry(2 * CORONA, 2 * CORONA), new THREE.ShaderMaterial({
    uniforms: { ...solarUniforms, uRadius: { value: SOLAR.sunRadius / CORONA } },
    transparent: true, depthWrite: false, fog: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float uFade, uTime, uRadius;
      varying vec2 vUv;
      ${GLSL_NOISE}
      void main() {
        vec2 c = vUv * 2.0 - 1.0;
        float r = length(c), x = max(r - uRadius, 0.0);
        float rays = 0.8 + 0.4 * noise(vec3(atan(c.y, c.x) * 3.0, r * 2.0 - uTime * 0.05, uTime * 0.03));
        float glow = (exp(-x * 10.0) * 0.9 + exp(-x * 4.5) * 0.12 * rays) * smoothstep(1.0, 0.6, r);
        gl_FragColor = vec4(vec3(1.0, 0.52, 0.2) * glow * uFade, 0.0);
      }`,
  })));
  corona.renderOrder = -98; // nach den Sternen
  group.add(corona);
  const coronaRay = new THREE.Vector3();

  const sphere = new THREE.SphereGeometry(1, 48, 32);
  const planetMaterial = (kind) => new THREE.ShaderMaterial({
    uniforms: { ...solarUniforms, uKind: { value: kind } }, fog: false, ...PLANET_SHADER,
  });
  const orbitY = (r) => -1.5 - SOLAR.slope * (r - 7.6);
  const deg = THREE.MathUtils.degToRad;
  const orbitPos = (pl, a, target) => target.set(pl.orbit * Math.cos(a),
    orbitY(pl.orbit) + pl.orbit * Math.sin(deg(pl.incl)) * Math.sin(a - pl.node), -pl.orbit * Math.sin(a));

  const lineMat = new THREE.LineBasicMaterial({
    color: 0x8890b0, transparent: true, opacity: 0, depthWrite: false, fog: false,
    blending: THREE.CustomBlending, blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  });
  const planets = SOLAR.planets.map((cfg, i) => {
    const pl = { ...cfg, node: i * 1.3, rate: 2 * Math.PI / (SOLAR.mercuryPeriod * Math.sqrt(cfg.years / 0.24)) };
    pl.holder = new THREE.Group(); // läuft auf der Bahn
    const tilt = new THREE.Group();
    tilt.rotation.z = deg(cfg.tilt);
    pl.body = noPick(new THREE.Mesh(sphere, planetMaterial(cfg.kind)));
    pl.body.scale.setScalar(cfg.size);
    tilt.add(pl.body);
    if (cfg.ring) tilt.add(pl.ring = makeRing(cfg.size));
    pl.holder.add(tilt);
    group.add(pl.holder);
    // feine Bahnlinie
    const pts = [];
    for (let k = 0; k < 160; k++) pts.push(orbitPos(pl, k / 160 * 2 * Math.PI, new THREE.Vector3()));
    group.add(noPick(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), lineMat)));
    return pl;
  });
  const earth = planets.find((p) => p.kind === 2);
  const moon = noPick(new THREE.Mesh(sphere, planetMaterial(0)));
  moon.scale.setScalar(SOLAR.moon.size);
  earth.holder.add(moon);

  /** Saturnring: Ringe mit Lücken (Cassini-Teilung), von der Sonne beleuchtet, mit dem Schatten des Planeten. */
  function makeRing(size) {
    const inner = size * 1.25, outer = size * 2.25;
    const mesh = noPick(new THREE.Mesh(new THREE.RingGeometry(inner, outer, 128, 1), new THREE.ShaderMaterial({
      uniforms: { ...solarUniforms, uCenter: { value: new THREE.Vector3() }, uPlanet: { value: size },
        uInner: { value: inner }, uOuter: { value: outer } },
      transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
      vertexShader: `varying vec3 vLocal, vPos, vN;
        void main() {
          vLocal = position;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vPos = wp.xyz;
          vN = normalize(mat3(modelMatrix) * vec3(0.0, 0.0, 1.0));
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `uniform vec3 uSun, uCenter;
        uniform float uFade, uPlanet, uInner, uOuter;
        varying vec3 vLocal, vPos, vN;
        void main() {
          float u = (length(vLocal.xy) - uInner) / (uOuter - uInner);
          float dens = (0.55 + 0.25 * sin(u * 47.0) + 0.2 * sin(u * 113.0 + 1.0)) * smoothstep(0.0, 0.06, u) * smoothstep(1.0, 0.9, u);
          dens *= 1.0 - 0.9 * smoothstep(0.62, 0.64, u) * smoothstep(0.70, 0.68, u); // Cassini-Teilung
          vec3 L = normalize(uSun - vPos);
          vec3 cp = uCenter - vPos;
          float t = dot(cp, L);
          float shade = (t > 0.0 && dot(cp, cp) - t * t < uPlanet * uPlanet) ? 0.12 : 1.0; // Schatten des Planeten
          vec3 col = mix(vec3(0.62, 0.54, 0.40), vec3(0.92, 0.85, 0.68), u) * (0.25 + 0.85 * abs(dot(normalize(vN), L))) * shade;
          gl_FragColor = vec4(col * uFade, dens * 0.9 * uFade);
        }`,
    })));
    mesh.rotation.x = -Math.PI / 2; // in die Äquatorebene
    return mesh;
  }

  return {
    group, corona, planets, lineMat,
    update(t) {
      solarUniforms.uTime.value = t;
      // Korona hinter die Platte schieben und im selben Mass vergrössern (gleich gross im Bild): Durch die
      // Sonnenmitte schnitte sie die Platte, ihr Leuchten läge dann auf deren hinterem Teil.
      coronaRay.subVectors(sun.position, camera.position);
      const dist = coronaRay.length(), push = 12;
      corona.position.copy(sun.position).addScaledVector(coronaRay, push / dist);
      corona.scale.setScalar((dist + push) / dist);
      corona.quaternion.copy(camera.quaternion);
      for (const pl of planets) {
        orbitPos(pl, deg(pl.phase) + pl.rate * t, pl.holder.position);
        pl.body.rotation.y = 2 * Math.PI * t / pl.spin;
        if (pl.ring) pl.body.getWorldPosition(pl.ring.material.uniforms.uCenter.value);
      }
      const m = 2 * Math.PI * t / SOLAR.moon.period;
      moon.position.set(Math.cos(m) * SOLAR.moon.distance, 0.12 * Math.sin(m), -Math.sin(m) * SOLAR.moon.distance);
    },
  };
})();
scene.add(solar.group);

// Gelände des Strands: Wertrauschen liegt auf einem Gitter und bildet achsparallele, eckige Formen; darum jede Stufe
// gedreht.
function valueNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), u = x - xi, v = z - zi;
  const h = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  const su = u * u * u * (u * (u * 6 - 15) + 10), sv = v * v * v * (v * (v * 6 - 15) + 10);
  return (h(xi, zi) * (1 - su) + h(xi + 1, zi) * su) * (1 - sv) + (h(xi, zi + 1) * (1 - su) + h(xi + 1, zi + 1) * su) * sv;
}
function smoothNoise(x, z, octaves = 4) { // 0 … 1, ohne Vorzugsrichtung
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    const c = Math.cos(0.7 + i * 1.1), sn = Math.sin(0.7 + i * 1.1);
    s += a * valueNoise((x * c - z * sn) * f + i * 17.3, (x * sn + z * c) * f - i * 9.1);
    norm += a; a *= 0.5; f *= 2.03;
  }
  return s / norm;
}

/* =====================================================================
   WALD — dritter Hintergrund: Mondnacht über einem Nebelmeer, in Blender gerendert (umschaltbar, siehe skyTheme)
   Das Brett schwebt über einem bewaldeten Grat; Fichtenhänge fallen in ein mondhelles Nebelmeer, aus dem weitere Kämme
   ragen, dahinter Dunst und ferne Berge, der Mond seitlich (FOREST_MOON) mit Hof. Die Szene entsteht in Blender
   (Cycles, tools/blender/) und liegt als Panorama in backgrounds/: forest.js (ganzes Equirect und Tiefe, jedes Gerät)
   und forest-hd.js (hoch aufgelöste Streifen für den Blick nach unten, nur Desktop). Als Skripte mit Data-URLs, weil
   Chrome Bilder aus file:// nicht in WebGL-Texturen lässt; erst bei der ersten Wahl geladen.
   Parallaxe: Das Panorama ist von einem Punkt über dem Brett aus gerendert (center). Es liegt nicht auf einer Kugel um
   die Kamera, sondern auf einem Netz um diesen Punkt, jede Ecke so weit draussen wie die Szene in Blender (Tiefe im
   Log-Raum geglättet, sonst rissen Baumkanten auf). Der Shader rechnet die Richtung vom Mittelpunkt zum Punkt auf dem
   Netz und tastet damit einen Streifen oder das ganze Bild ab. Grenze des Verfahrens: Bäume nahe am Brett sähe die
   Kamera aus einem anderen Winkel als der Mittelpunkt, sie stünden schräg. Darum fehlen sie im Panorama (nur ihre
   Schatten sind drin), und das Spiel zeichnet sie selbst als 3D-Fichten (buildTrees, Daten in forest.js). Bewegung
   bringen ein ziehender Nebelschleier über dem Nebelmeer (buildMist) und Glühwürmchen zwischen den Fichten.
   Farben: lineare Szenenwerte, sRGB-kodiert; ACES, Vignette und Korn macht der letzte Bildschritt wie bei allem.
   ===================================================================== */

const forestUniforms = {
  uFade: { value: 0 }, // Anteil des Walds 0 … 1 (skyTheme)
};

const forest = (() => {
  const P = {
    dMin: 6, dMax: 88, // Abstand der Netzecken vom Mittelpunkt: auch im Hochformat (Kamera ~25 entfernt) vor camera.far
    blurDeg: 1,        // Glättung der Tiefe (Sigma in Grad)
    segU: 512, segV: 256,
    appear: 0.6,       // s: Einblenden, wenn die Daten erst nach der Wahl ankommen
    // Streifen nur auf dem Desktop: zusammen mit dem ganzen Bild rund 270 MB Grafikspeicher (ohne: rund 45 MB)
    hd: !IS_MOBILE && renderer.capabilities.maxTextureSize >= 4096,
  };
  const group = new THREE.Group();
  group.visible = false;
  const uniforms = { uFade: forestUniforms.uFade, uReady: { value: 0 }, uTime: { value: 0 } };
  const flyUniforms = { ...uniforms, uPixelRatio: { value: renderer.getPixelRatio() } };
  let loading = null, mesh = null, readyAt = null;

  const loadScript = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`${src} nicht geladen`));
    document.head.appendChild(s);
  });
  const loadImage = (url) => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Bild nicht lesbar'));
    img.src = url;
  });

  function texture(img, wrapU) {
    const t = new THREE.Texture(img);
    t.encoding = THREE.sRGBEncoding;
    t.wrapS = wrapU ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
    t.wrapT = THREE.ClampToEdgeWrapping;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.needsUpdate = true;
    return t;
  }

  /** Tiefenkarte (16 Bit log in Rot und Grün, 65535 = Himmel) -> geglätteter Log-Abstand, Ferne auf dMax begrenzt */
  function logDepth(img, depthLog) {
    const w = img.width, h = img.height;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    const px = ctx.getImageData(0, 0, w, h).data;
    const la = Math.log(depthLog[0]), lb = Math.log(depthLog[1]), lmin = Math.log(P.dMin), lmax = Math.log(P.dMax);
    let src = new Float32Array(w * h);
    for (let x = 0; x < w; x++) {
      let last = lmax;
      for (let y = 0; y < h; y++) {
        const i = y * w + x, code = px[i * 4] * 256 + px[i * 4 + 1];
        // ohne Treffer: über dem Horizont Himmel, darunter das Loch im Gelände unter dem Brett – dort den letzten Wert
        // darüber nehmen, sonst zöge die Glättung den Boden an den Brettkanten in die Ferne
        if (code === 65535) src[i] = y < h / 2 ? lmax : last;
        else src[i] = last = Math.min(lmax, Math.max(lmin, la + code / 65535 * (lb - la)));
      }
    }
    // Gauss, getrennt: waagrecht über die Naht hinweg, senkrecht am Rand festgehalten
    const sigma = P.blurDeg * w / 360, r = Math.ceil(sigma * 3), k = [];
    for (let i = -r; i <= r; i++) k.push(Math.exp(-i * i / (2 * sigma * sigma)));
    const ks = k.reduce((s, v) => s + v, 0);
    const pass = (from, horizontal) => {
      const to = new Float32Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        let s = 0;
        for (let i = -r; i <= r; i++) {
          const xx = horizontal ? (x + i + w) % w : x, yy = horizontal ? y : Math.min(h - 1, Math.max(0, y + i));
          s += from[yy * w + xx] * k[i + r];
        }
        to[y * w + x] = s / ks;
      }
      return to;
    };
    return { w, h, data: pass(pass(src, true), false) };
  }

  /** Kugelnetz um den Mittelpunkt, Ecken im Abstand der Szene (bilinear aus der Tiefe) */
  function proxyGeometry(depth, center) {
    const pos = new Float32Array((P.segU + 1) * (P.segV + 1) * 3);
    const sample = (u, v) => {
      const { w, h, data } = depth;
      const x = u * w - 0.5, y = Math.min(h - 1, Math.max(0, v * h - 0.5));
      const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
      const X0 = (x0 % w + w) % w, X1 = (X0 + 1) % w, Y1 = Math.min(h - 1, y0 + 1);
      return (data[y0 * w + X0] * (1 - fx) + data[y0 * w + X1] * fx) * (1 - fy) + (data[Y1 * w + X0] * (1 - fx) + data[Y1 * w + X1] * fx) * fy;
    };
    let p = 0;
    for (let i = 0; i <= P.segV; i++) {
      const v = i / P.segV, th = v * Math.PI;
      for (let j = 0; j <= P.segU; j++) {
        const u = j / P.segU, ph = (u - 0.5) * 2 * Math.PI;
        // Richtung in Blender (bx, by, bz) -> Spiel (bx, bz, −by)
        const bx = Math.sin(th) * Math.sin(ph), by = Math.sin(th) * Math.cos(ph), bz = Math.cos(th);
        const d = Math.exp(sample(u, v));
        pos[p++] = center.x + bx * d; pos[p++] = center.y + bz * d; pos[p++] = center.z - by * d;
      }
    }
    const index = [];
    for (let i = 0; i < P.segV; i++) for (let j = 0; j < P.segU; j++) {
      const a = i * (P.segU + 1) + j, b = a + 1, c = a + P.segU + 1, d = c + 1;
      index.push(a, c, b, b, c, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setIndex(index);
    return geo;
  }

  function material(center, full, bands) {
    const u = { ...uniforms, uFull: { value: full }, uCenter: { value: center } };
    bands.forEach((b, i) => {
      u[`uBand${i}`] = { value: b.tex };
      u[`uRect${i}`] = { value: new THREE.Vector4(b.u[0], b.u[1], b.v[0], b.v[1]) };
    });
    const decl = bands.map((_, i) => `uniform sampler2D uBand${i}; uniform vec4 uRect${i};`).join('\n');
    // Streifen: Rechteck (u0, u1, v0, v1) im ganzen Equirect; Bildzeile 0 oben (Textur mit flipY: t = 1 − v)
    const pick = bands.map((_, i) => `
        if (!hit && u >= uRect${i}.x && u <= uRect${i}.y && v >= uRect${i}.z && v <= uRect${i}.w) {
          vec2 s = 1.0 / vec2(uRect${i}.y - uRect${i}.x, uRect${i}.w - uRect${i}.z);
          col = SAMPLE(uBand${i}, vec2((u - uRect${i}.x) * s.x, 1.0 - (v - uRect${i}.z) * s.y), gx * s, gy * s);
          hit = true;
        }`).join('');
    return new THREE.ShaderMaterial({
      uniforms: u,
      side: THREE.DoubleSide,
      extensions: { derivatives: true, shaderTextureLOD: true },
      vertexShader: `
        varying vec3 vWorld;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorld = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        #if __VERSION__ >= 300
          #define SAMPLE(t, p, gx, gy) textureGrad(t, p, gx, gy).rgb
        #elif defined(GL_EXT_shader_texture_lod)
          #define SAMPLE(t, p, gx, gy) texture2DGradEXT(t, p, gx, gy).rgb
        #else
          #define SAMPLE(t, p, gx, gy) texture2D(t, p).rgb
        #endif
        uniform sampler2D uFull;
        uniform vec3 uCenter;
        uniform float uFade, uReady;
        ${decl}
        varying vec3 vWorld;
        const float PI = 3.141592653589793;
        void main() {
          vec3 g = normalize(vWorld - uCenter);
          vec3 b = vec3(g.x, -g.z, g.y); // Spiel -> Blender
          float u = 0.5 + atan(b.x, b.y) / (2.0 * PI);
          float v = acos(clamp(b.z, -1.0, 1.0)) / PI;
          // Ableitungen vor jeder Verzweigung; an der Naht (u springt 1 -> 0) den Sprung herausnehmen, sonst wählte die
          // Grafikkarte dort die kleinste Mipmap-Stufe (eine Linie aus Mittelwerten)
          vec2 dx = dFdx(vec2(u, v)), dy = dFdy(vec2(u, v));
          dx.x -= floor(dx.x + 0.5); dy.x -= floor(dy.x + 0.5);
          vec2 gx = vec2(dx.x, -dx.y), gy = vec2(dy.x, -dy.y);
          vec3 col = vec3(0.0);
          bool hit = false;
          ${pick}
          if (!hit) col = SAMPLE(uFull, vec2(u, 1.0 - v), gx, gy);
          gl_FragColor = vec4(col, uFade * uReady);
        }`,
    });
  }

  /**
   * Fichten nahe am Brett (waagrecht bis trees.rNear): Das Panorama zeigt sie nicht, aus seinem Mittelpunkt gesehen
   * lägen sie schräg. Modelle und Standorte kommen aus Blender (tools/blender/wald_spielbaum.py), die Farben von den
   * gemalten Bäumen im Panorama: zwei harte Stufen im Mondlicht (Toon), heller Rand an den Kanten zum Mond, unten in der
   * Krone dunkler, etwas Dunst mit dem Abstand. Wie viel Mondlicht eine Krone unten und oben trifft (Schatten von Kämmen
   * und Nachbarbäumen), hat Blender je Baum ausgerechnet; ihre Schatten auf dem Boden stecken im Panorama.
   * Nebel wie in der Szene (trees.fog): Die Dichte hängt nur von der Höhe über der Oberkante am Baum ab (weicher Saum,
   * darunter der Kern, je eine Rampe). Entlang des Blicks bis zur Kamera (über dem Nebel) zählt also nur ihr Integral
   * von der Höhe des Punkts aufwärts, mal Weg je Höhe – so versinken Bäume am Rand des Nebelmeers darin wie im Panorama.
   * Eintrag je Baum: x, y, z des Fusses, Höhe, Breite, Drehung, Modell, Mondlicht unten, oben, Helligkeit, Nebel-Oberkante.
   */
  function buildTrees(trees) {
    const fogRamp = ([a, b, d]) => `${d.toFixed(4)} * ramp(dz, ${a.toFixed(2)}, ${b.toFixed(2)})`;
    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `
        attribute vec4 aInfo; // Mondlicht unten, oben; Helligkeit; Oberkante des Nebels
        varying vec4 vInfo;
        varying vec3 vN, vPos;
        varying float vH;
        void main() {
          mat4 m = modelMatrix * instanceMatrix;
          vec4 wp = m * vec4(position, 1.0);
          vec3 sc = vec3(length(m[0].xyz), length(m[1].xyz), length(m[2].xyz));
          vN = normalize(mat3(m) * (normal / (sc * sc)));
          vPos = wp.xyz;
          vInfo = aInfo;
          vH = position.y;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        uniform float uFade, uReady;
        varying vec4 vInfo;
        varying vec3 vN, vPos;
        varying float vH;
        ${FOREST_GLSL}
        // Farben der gemalten Bäume und des Nebels (Anzeige), zurückgerechnet auf Szenenwerte vor ACES
        const vec3 SHADOW = vec3(0.0114, 0.0225, 0.0266), MID = vec3(0.0198, 0.044, 0.0542);
        const vec3 LIT = vec3(0.037, 0.0913, 0.1124), RIM = vec3(0.07, 0.165, 0.22), HAZE = vec3(0.087, 0.195, 0.40);
        const vec3 FOG_LIT = vec3(0.214, 0.365, 0.72);
        // Integral einer Rampe (0 bei Höhe a, 1 ab Höhe b < a) von dz aufwärts
        float ramp(float dz, float a, float b) {
          float w = a - b;
          if (dz >= a) return 0.0;
          if (dz > b) return (a - dz) * (a - dz) / (2.0 * w);
          return 0.5 * w + (b - dz);
        }
        void main() {
          vec3 N = normalize(vN);
          if (!gl_FrontFacing) N = -N;
          vec3 toCam = cameraPosition - vPos;
          float dist = length(toCam);
          float l = dot(N, FOREST_MOON);
          float moon = mix(vInfo.x, vInfo.y, smoothstep(0.2, 0.8, vH));
          vec3 col = mix(SHADOW, MID, smoothstep(-0.5, -0.3, l));
          col = mix(col, LIT, smoothstep(0.0, 0.12, l) * moon);
          col *= mix(0.6, 1.0, smoothstep(0.0, 0.45, vH));
          float rim = pow(1.0 - max(dot(N, toCam / dist), 0.0), 3.0) * smoothstep(-0.1, 0.4, l) * moon;
          col = mix(col, RIM, rim * 0.6) * vInfo.z;
          col = mix(col, HAZE, 1.0 - exp(-dist * 0.0015));
          // Nebel: Integral der Dichte über dem Punkt mal Weg je Höhe; zum Mond hin heller (Vorwärtsstreuung)
          float dz = vPos.y - vInfo.w;
          float tau = (${fogRamp(trees.fog.soft)} + ${fogRamp(trees.fog.core)}) * min(dist / max(cameraPosition.y - vPos.y, 0.1), 8.0);
          vec2 h = normalize(-toCam.xz + vec2(1e-4)), m = normalize(FOREST_MOON.xz);
          col = mix(mix(HAZE, FOG_LIT, pow(max(dot(h, m), 0.0), 2.0)), col, exp(-tau));
          gl_FragColor = vec4(col * uFade * uReady, 1.0);
        }`,
    });
    const out = new THREE.Group(), mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
    trees.models.forEach((model, k) => {
      const list = trees.trees.filter((t) => t[6] === k);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(model.pos, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(model.nrm, 3));
      geo.setIndex(model.idx);
      const info = new Float32Array(list.length * 4);
      const mesh = new THREE.InstancedMesh(geo, material, list.length);
      list.forEach(([x, y, z, h, w, turn, , lo, hi, shade, fog], i) => {
        mtx.compose(new THREE.Vector3(x, y, z), q.setFromAxisAngle(up, turn), new THREE.Vector3(w, h, w));
        mesh.setMatrixAt(i, mtx);
        info.set([lo, hi, shade, fog], i * 4);
      });
      geo.setAttribute('aInfo', new THREE.InstancedBufferAttribute(info, 4));
      mesh.frustumCulled = false;          // die Hülle gilt nur für ein Modell, nicht für alle Standorte
      mesh.layers.set(LAYER_NO_REFLECT);
      mesh.raycast = () => {};
      out.add(mesh);
    });
    return out;
  }

  /**
   * Glühwürmchen zwischen den nahen Fichten (über dem Nebel, unter der Brettebene, ausserhalb der Platte): klein und
   * gelbgrün mit weichem Schein, sie leuchten unregelmässig auf (etwa eine halbe Sekunde, dann eine Weile dunkel) –
   * die einzigen warmen Lichter in der Mondnacht.
   */
  function buildFireflies(trees, n = 50) {
    const rand = mulberry32(17);
    const spots = trees.trees.filter(([x, y, z, , , , , , , , fog]) => Math.hypot(x, z) > 7 && Math.hypot(x, z) < 28 && y > fog + 1);
    const pos = new Float32Array(n * 3), seed = new Float32Array(n);
    for (let i = 0; i < n && spots.length; i++) {
      const [x, y, z] = spots[Math.floor(rand() * spots.length)];
      pos.set([x + (rand() - 0.5) * 3, Math.min(y + 0.6 + rand() * 2.5, -1.2), z + (rand() - 0.5) * 3], i * 3);
      seed[i] = rand();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    const flies = new THREE.Points(geo, new THREE.ShaderMaterial({
      uniforms: flyUniforms,
      transparent: true, depthWrite: false,
      blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
      blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
      vertexShader: `attribute float aSeed;
        uniform float uTime, uFade, uReady, uPixelRatio;
        varying float vGlow;
        void main() {
          float t = uTime * (0.2 + 0.15 * aSeed) + aSeed * 60.0;
          vec3 p = position + vec3(sin(t) * 1.2 + sin(t * 0.37) * 0.7, sin(t * 0.7 + 1.0) * 0.4, cos(t * 0.83) * 1.2);
          p.y = min(p.y, -1.0); // nie über die Brettebene
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          float ph = fract(uTime * (0.25 + 0.2 * aSeed) + aSeed * 7.0);
          float blink = smoothstep(0.0, 0.08, ph) * smoothstep(0.3, 0.12, ph); // kurz an, lange aus
          vGlow = blink * uFade * uReady;
          gl_PointSize = 9.0 * uPixelRatio * 40.0 / -mv.z;
        }`,
      fragmentShader: `varying float vGlow;
        void main() {
          float r = length(gl_PointCoord - 0.5) * 2.0;
          float core = smoothstep(0.3, 0.0, r), halo = exp(-r * r * 6.0) * 0.35;
          gl_FragColor = vec4((vec3(0.85, 1.0, 0.35) * core * 2.2 + vec3(0.35, 0.6, 0.15) * halo) * vGlow, 0.0);
        }`,
    }));
    flies.frustumCulled = false;
    flies.layers.set(LAYER_NO_REFLECT);
    flies.raycast = () => {};
    flies.renderOrder = 6;
    return flies;
  }

  /**
   * Ziehender Nebelschleier: zwei durchscheinende Lagen knapp über der Oberkante des Nebelmeers (fog.top), deren Schwaden
   * langsam mit dem Wind treiben (Richtung wie die Schlieren in Blender) und sich dabei verändern. Wo Kämme höher liegen,
   * verdeckt sie das Panorama (Tiefentest): Der Schleier bleibt in den Tälern. Farbe wie der gemalte Nebel, zum Mond
   * hin heller; zum Rand der Sicht blendet er aus.
   */
  function buildMist(fog) {
    const out = new THREE.Group();
    [[1.2, 0.22, 0.0], [3.5, 0.14, 0.5]].forEach(([dy, alpha, off]) => {
      const disc = new THREE.Mesh(new THREE.CircleGeometry(130, 64).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
        uniforms: { ...uniforms, uAlpha: { value: alpha }, uOff: { value: off } },
        transparent: true, depthWrite: false,
        vertexShader: `varying vec3 vPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }`,
        fragmentShader: `uniform float uTime, uFade, uReady, uAlpha, uOff;
          varying vec3 vPos;
          ${GLSL_NOISE}
          ${FOREST_GLSL}
          const vec3 HAZE = vec3(0.087, 0.195, 0.40), FOG_LIT = vec3(0.214, 0.365, 0.72);
          void main() {
            vec2 wind = vec2(0.94, -0.34); // Blender (0.94, 0.34) -> Spiel (x, −y)
            vec2 p = vPos.xz - wind * uTime * 0.7;
            // in Windrichtung gestreckte Schwaden, die sich langsam verändern
            vec2 q = vec2(dot(p, wind), dot(p, vec2(-wind.y, wind.x)) * 2.2) / 26.0;
            float n = fbm3(vec3(q, uTime * 0.02 + uOff * 7.0));
            float a = smoothstep(0.42, 0.72, n) * uAlpha;
            vec3 toCam = cameraPosition - vPos;
            float dist = length(toCam);
            a *= smoothstep(112.0, 80.0, dist);
            vec2 h = normalize(-toCam.xz + vec2(1e-4)), m = normalize(FOREST_MOON.xz);
            vec3 col = mix(HAZE, FOG_LIT, pow(max(dot(h, m), 0.0), 2.0));
            float k = uFade * uReady;
            gl_FragColor = vec4(col * k, a * k);
          }`,
      }));
      disc.position.y = fog.top + dy;
      disc.frustumCulled = false;
      disc.layers.set(LAYER_NO_REFLECT);
      disc.raycast = () => {};
      disc.renderOrder = 5;
      out.add(disc);
    });
    return out;
  }

  async function build() {
    await loadScript('backgrounds/forest.js');
    if (P.hd) await loadScript('backgrounds/forest-hd.js').catch((e) => console.warn(`Wald: ${e.message}, ohne Streifen`));
    const data = window.PRISMA_FOREST;
    const bands = P.hd ? data.bands ?? [] : [];
    const [fullImg, depthImg, ...bandImgs] = await Promise.all([data.full, data.depth, ...bands.map((b) => b.url)].map(loadImage));
    const center = new THREE.Vector3().fromArray(data.center);
    mesh = new THREE.Mesh(proxyGeometry(logDepth(depthImg, data.depthLog), center),
      material(center, texture(fullImg, true), bands.map((b, i) => ({ ...b, tex: texture(bandImgs[i], false) }))));
    mesh.renderOrder = -1000;          // zuerst: alles Übrige liegt davor, der Tiefentest verwirft es früh
    mesh.frustumCulled = false;
    mesh.layers.set(LAYER_NO_REFLECT); // nicht in der Bodenspiegelung (dort spiegelt sich die Himmelskugel)
    mesh.raycast = () => {};
    group.add(mesh);
    if (data.trees) group.add(buildTrees(data.trees), buildFireflies(data.trees), buildMist(data.trees.fog));
    renderer.compile(scene, camera);   // schon jetzt übersetzen, nicht im ersten Bild des Einblendens (falls sichtbar)
    delete window.PRISMA_FOREST;       // die Bilder stecken jetzt in den Texturen
  }

  /** Während des Überblendens und Einblendens durchsichtig über der Himmelskugel, sonst undurchsichtig und zuerst. */
  function applyFade() {
    if (!mesh) return;
    const transparent = uniforms.uFade.value * uniforms.uReady.value < 0.999;
    if (mesh.material.transparent !== transparent) {
      mesh.material.transparent = transparent;
      mesh.material.needsUpdate = true;
    }
  }

  return {
    group,
    /** Erst laden, wenn der Wald gewählt wird (rund 1,5 MB, auf dem Desktop dazu 6 MB Streifen). */
    prepare() {
      loading ??= build().catch((e) => console.error(`Wald: ${e.message}`));
    },
    show(visible) {
      if (visible) this.prepare();
      group.visible = visible;
      // Die Himmelskugel (Radius 80 um die Kamera, ohne Tiefe) zeichnet nach dem Netz und deckte weiter draussen
      // liegende Teile zu. Mit 116 (vor camera.far = 120) liegt sie überall dahinter; sie rechnet nur mit der Richtung,
      // sieht also gleich aus. Nur solange der Wald zu sehen ist (die anderen Hintergründe sind dann ausgeblendet).
      background.scale.setScalar(visible ? 116 / 80 : 1);
      applyFade();
    },
    update(t) {
      if (!mesh) return;
      readyAt ??= t;
      uniforms.uReady.value = Math.min(1, (t - readyAt) / P.appear);
      uniforms.uTime.value = t;
      flyUniforms.uPixelRatio.value = renderer.getPixelRatio();
      applyFade();
    },
  };
})();
scene.add(forest.group);

/* =====================================================================
   STRAND — vierter Hintergrund: Meer und Küste bei Sonnenuntergang (umschaltbar, siehe skyTheme)
   Das Brett schwebt über einer flachen Lagune vor einem Sandstrand. In der Ausgangsansicht liegt die Küste hinter dem
   Brett, links ragt eine felsige Landzunge ins Meer; nach vorn fällt der Grund über eine Kante ins Tiefe ab (türkis →
   tiefblau). Die Sonne steht tief über dem Meer rechts: Sie streift den Strand von der Seite (lange Schatten der Dünen
   und Felsen), und dreht man die Kamera zu ihr hin, glitzert das Wasser.
   Die Kamera blickt immer von oben – den Himmel sieht man nur gespiegelt (Wasser, polierte Platte). Darum ist das Meer
   kein Netz mit Wellen, sondern wird pro Pixel gerechnet: Dünung analytisch, feine Wellen aus einer kachelbaren
   Normal-Map, deren Mipmaps zugleich das Glitzern in der Ferne glätten. Unter Wasser zeichnet das Gelände selbst das
   Wasser darüber (es kennt die Tiefe), weiter draussen die Himmelskugel (Strahl bis zur Wasserfläche) – beide mit
   derselben Funktion, damit kein Rand sichtbar wird. Alles berechnet, ohne Bilddateien; erst bei der ersten Wahl gebaut.
   ===================================================================== */

const BEACH = {
  waterY: -3,
  sun: new THREE.Vector3(0.92, 0.21, 0.33).normalize(), // gut 12° über dem Horizont
  reach: 104, // Gelände so weit um die Mitte: Die Kamera kreist bis ~25 hinaus, die Himmelskugel deckt ab 79 ab
  swell: [0.16, -0.987], // Laufrichtung der Dünung (aufs Ufer zu)
  shadowSize: 2048, // Schattenkarte der Bäume, Palmen und Felsen (Pixel je Seite)
  veg: [7, 11],  // Bewuchs setzt hinter dem Strand ein: Abstand zur Wasserlinie, ab dem er beginnt und ganz ist
};

/**
 * Kachelbare Wellen für das Meer: RGB = Normale feiner Wellen (Summe von Sinuswellen mit ganzzahligen Wellenzahlen,
 * vorwiegend in einer Richtung), A = kachelbares Rauschen für Schaum, Sandkörnung und Wolken.
 */
function createWaveTexture(size) {
  const rand = mulberry32(91);
  const waves = [];
  while (waves.length < 56) {
    const mag = 2 + 26 * rand() ** 2, ang = (rand() - 0.5) * 2.4;
    const kx = Math.round(Math.sin(ang) * mag), ky = Math.round(Math.cos(ang) * mag);
    if (kx || ky) waves.push([kx, ky, Math.hypot(kx, ky) ** -1.8, rand() * 2 * Math.PI]);
  }
  const n = size * size, sx = new Float32Array(n), sy = new Float32Array(n);
  let sum = 0;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let ax = 0, ay = 0;
      for (const [kx, ky, amp, ph] of waves) {
        const c = amp * Math.cos(2 * Math.PI * (kx * x + ky * y) / size + ph);
        ax += c * kx; ay += c * ky;
      }
      sx[y * size + x] = ax; sy[y * size + x] = ay;
      sum += ax * ax + ay * ay;
    }
  }
  const norm = 0.3 / Math.sqrt(sum / n); // mittlere Steigung
  // Rauschen auf kachelbaren Gittern (Perioden 4 … 32)
  const lattices = [4, 8, 16, 32].map((p) => ({ p, g: Float32Array.from({ length: p * p }, rand) }));
  const lat = ({ p, g }, u, v) => {
    const x = u * p, y = v * p, xi = Math.floor(x), yi = Math.floor(y);
    const fx = x - xi, fy = y - yi, sxx = fx * fx * (3 - 2 * fx), syy = fy * fy * (3 - 2 * fy);
    const at = (i, j) => g[((j % p) + p) % p * p + ((i % p) + p) % p];
    return (at(xi, yi) * (1 - sxx) + at(xi + 1, yi) * sxx) * (1 - syy) + (at(xi, yi + 1) * (1 - sxx) + at(xi + 1, yi + 1) * sxx) * syy;
  };
  const data = new Uint8ClampedArray(n * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = y * size + x;
      const gx = sx[i] * norm, gy = sy[i] * norm, len = Math.hypot(gx, gy, 1);
      data[i * 4] = (-gx / len * 0.5 + 0.5) * 255;
      data[i * 4 + 1] = (-gy / len * 0.5 + 0.5) * 255;
      data[i * 4 + 2] = (1 / len * 0.5 + 0.5) * 255;
      let f = 0;
      lattices.forEach((l, k) => { f += lat(l, x / size, y / size) * 0.5 ** (k + 1); });
      data[i * 4 + 3] = THREE.MathUtils.clamp((f / 0.9375 - 0.5) * 1.6 + 0.5, 0, 1) * 255;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return tex;
}

/**
 * Schaum, kachelbar: R = Schwelle, wie lange ein Punkt Schaum bleibt – je weiter von den Mitten runder Löcher in drei
 * Grössen, desto länger. Wie viel Schaum zu sehen ist, entscheidet
 * im Shader die Dichte: frisch ist alles weiss, dann reisst er zu Zellen, dann zu Fäden auf und verschwindet
 * (foamDissolve). So sehen Schaumfelder in der Brandung von oben aus.
 */
function createFoamTexture(size) {
  const rand = mulberry32(17);
  const cells = (n) => {
    const pts = Float32Array.from({ length: n * n * 2 }, rand);
    return (u, v) => { // Abstand zum nächsten Zellpunkt (Worley), kachelbar
      const x = u * n, y = v * n, xi = Math.floor(x), yi = Math.floor(y);
      let f1 = 9;
      for (let dj = -1; dj <= 1; dj++) {
        for (let di = -1; di <= 1; di++) {
          const cx = xi + di, cy = yi + dj, k = (((cy % n) + n) % n * n + ((cx % n) + n) % n) * 2;
          const d = (x - cx - pts[k]) ** 2 + (y - cy - pts[k + 1]) ** 2;
          if (d < f1) f1 = d;
        }
      }
      return Math.sqrt(f1);
    };
  };
  const big = cells(9), small = cells(22), tiny = cells(55);
  const lattice = (p) => { const g = Float32Array.from({ length: p * p }, rand); return (u, v) => {
    const x = u * p, y = v * p, xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const at = (i, j) => g[((j % p) + p) % p * p + ((i % p) + p) % p], sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return (at(xi, yi) * (1 - sx) + at(xi + 1, yi) * sx) * (1 - sy) + (at(xi, yi + 1) * (1 - sx) + at(xi + 1, yi + 1) * sx) * sy;
  }; };
  const thick = lattice(6), patch = lattice(14);
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      // Löcher: Je weiter ein Punkt von den (verwirbelten) Lochmitten in drei Grössen entfernt ist, desto länger bleibt
      // er Schaum – die Löcher gehen rund auf und wachsen, bis nur Fäden zwischen ihnen übrig sind
      const wu = u + 0.035 * (thick(u, v) - 0.5), wv = v + 0.035 * (thick(v + 0.37, u + 0.71) - 0.5);
      const holes = Math.min(big(wu, wv) / 0.62, 0.85 * small(wu, wv) / 0.62 + 0.25, 0.7 * tiny(u, v) / 0.62 + 0.45);
      const i = (y * size + x) * 4;
      data[i] = Math.max(0, Math.min(1, holes * (0.8 + 0.2 * patch(u, v)))) * 255;
      data[i + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

/**
 * Palme (Höhe 1, Fuss im Ursprung, lehnt in +x): gebogener Stamm, oben dünner, und ein Schopf Wedel – jeder ein
 * gebogener Stiel mit gefiederten Blättchen, die beidseits nach unten hängen (von oben die typische Sternform). Die
 * oberen Wedel stehen schräg nach oben, die unteren hängen und sind dürr. aPalm: Teil (0 Stamm, 1 Wedel), Lage entlang
 * (0 … 1), Zufall je Wedel (dürr, Farbe, Wind).
 */
function createPalmGeometry(seed) {
  const r = mulberry32(seed);
  const pos = [], nor = [], info = [];
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const BEND = 0.22, center = (t) => V(BEND * t * t, t, 0);
  const radius = (t) => 0.028 * (1 - 0.4 * t) + 0.02 * Math.max(0, 1 - t * 12); // unten ausgestellt
  const RINGS = 10, SIDES = 6;
  for (let i = 0; i < RINGS; i++) {
    for (let k = 0; k < SIDES; k++) {
      const corner = (ii, kk) => {
        const t = ii / RINGS, a = kk / SIDES * 2 * Math.PI;
        const n = V(Math.cos(a), 0, Math.sin(a));
        return [center(t).addScaledVector(n, radius(t)), n, t];
      };
      const c = [corner(i, k), corner(i, k + 1), corner(i + 1, k + 1), corner(i + 1, k)];
      for (const j of [0, 1, 2, 0, 2, 3]) { pos.push(...c[j][0].toArray()); nor.push(...c[j][1].toArray()); info.push(0, c[j][2], 0); }
    }
  }
  const top = center(1), up = V(0, 1, 0), FRONDS = 13, STEPS = 20;
  for (let f = 0; f < FRONDS; f++) {
    const az = (f / FRONDS) * 2 * Math.PI + (r() - 0.5) * 0.4, low = r(), seedF = r();
    const elev = 0.75 - 0.95 * low + (r() - 0.5) * 0.2, L = 0.34 + 0.1 * r(), droop = 0.45 + 0.55 * low;
    const d0 = V(Math.cos(elev) * Math.cos(az), Math.sin(elev), Math.cos(elev) * Math.sin(az));
    const at = (u) => top.clone().addScaledVector(d0, L * u).add(V(0, -droop * L * u * u, 0));
    for (let i = 0; i < STEPS; i++) {
      const u0 = i / STEPS, u1 = (i + 1) / STEPS, p0 = at(u0), p1 = at(u1);
      const tan = p1.clone().sub(p0).normalize(), side = new THREE.Vector3().crossVectors(tan, up).normalize();
      // Blättchen: lang und schmal, zur Spitze des Wedels gestrichen, mit Lücken dazwischen
      const l = L * 0.32 * Math.pow(Math.sin(Math.PI * Math.min(1, u0 * 0.9 + 0.08)), 0.7);
      const base = p0.clone().lerp(p1, 0.45);
      for (const s of [-1, 1]) {
        const tip = p0.clone().addScaledVector(side, s * l * 0.8).add(V(0, -l * (0.35 + 0.3 * low), 0)).addScaledVector(tan, l * 0.45);
        const n = new THREE.Vector3().crossVectors(base.clone().sub(p0), tip.clone().sub(p0)).normalize();
        if (n.y < 0) n.negate();
        for (const [p, u] of [[p0, u0], [base, u0], [tip, u0]]) { pos.push(...p.toArray()); nor.push(...n.toArray()); info.push(1, u, seedF + low * 0.001); }
      }
      // Stiel
      const w = side.clone().multiplyScalar(0.004);
      for (const p of [p0.clone().sub(w), p1.clone().sub(w), p1.clone().add(w), p0.clone().sub(w), p1.clone().add(w), p0.clone().add(w)]) {
        pos.push(...p.toArray()); nor.push(0, 1, 0); info.push(1, u0, seedF + low * 0.001);
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('aPalm', new THREE.Float32BufferAttribute(info, 3));
  return geo;
}

/**
 * Felsblock (etwa Radius 1): Kugel, mit Grat-Rauschen kantig verbeult, flacher als hoch, unten abgeschnitten (er sitzt
 * im Sand). Normalen über gleiche Ecken gemittelt: Kanten bleiben, aber keine einzelnen Dreiecke.
 */
function createRockGeometry(seed) {
  const h = (x, y, z) => { const v = Math.sin(x * 127.1 + y * 311.7 + z * 74.7 + seed * 17.3) * 43758.5453; return v - Math.floor(v); };
  const noise3 = (x, y, z) => {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const fx = x - xi, fy = y - yi, fz = z - zi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
    const L = (a, b, t) => a + (b - a) * t;
    const plane = (zz) => L(L(h(xi, yi, zz), h(xi + 1, yi, zz), u), L(h(xi, yi + 1, zz), h(xi + 1, yi + 1, zz), u), v);
    return L(plane(zi), plane(zi + 1), w);
  };
  const geo = new THREE.IcosahedronGeometry(1, 2);
  const p = geo.attributes.position, d = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    d.fromBufferAttribute(p, i).normalize();
    const ridge = 1 - Math.abs(2 * noise3(d.x * 2.6 + 3, d.y * 2.6, d.z * 2.6) - 1);
    const ridge2 = 1 - Math.abs(2 * noise3(d.x * 5.5 - 4, d.y * 5.5 + 2, d.z * 5.5) - 1);
    const r = 0.72 + 0.34 * noise3(d.x * 1.2, d.y * 1.2 + 7, d.z * 1.2) + 0.3 * ridge * ridge + 0.08 * ridge2 * ridge2;
    d.multiplyScalar(r);
    d.y = Math.max(d.y * 0.72, -0.25);
    p.setXYZ(i, d.x, d.y, d.z);
  }
  geo.computeVertexNormals();
  // Normalen gleicher Ecken mitteln (die Geometrie hat je Dreieck eigene Ecken)
  const n = geo.attributes.normal, sums = new Map(), key = (i) => `${p.getX(i).toFixed(4)},${p.getY(i).toFixed(4)},${p.getZ(i).toFixed(4)}`;
  for (let i = 0; i < p.count; i++) {
    const k = key(i), s = sums.get(k) || [0, 0, 0];
    s[0] += n.getX(i); s[1] += n.getY(i); s[2] += n.getZ(i);
    sums.set(k, s);
  }
  for (let i = 0; i < p.count; i++) {
    const s = sums.get(key(i)), l = Math.hypot(...s) || 1;
    n.setXYZ(i, s[0] / l, s[1] / l, s[2] / l);
  }
  return geo;
}

// Lage der Baumkronen und Palmen in der Welt – gleich für das Bild und die Schattenkarte (beide Shader)
const BEACH_CASTER_GLSL = `
  uniform float uTime;
  float instanceSeed() { return fract(sin(dot(instanceMatrix[3].xz, vec2(12.9898, 78.233))) * 43758.5453); }
  // Krone: Laub in Ballen, grosse und kleine Beulen (wie Blumenkohl)
  vec3 crownShape(vec3 p, float seed) {
    vec3 d = normalize(p);
    return d * (0.78 + 0.3 * noise(d * 1.7 + seed * 23.0) + 0.14 * noise(d * 4.3 + seed * 7.0));
  }
  // Palme: Wedel wiegen sich im Wind, zur Spitze hin mehr; der Stamm oben kaum
  vec3 palmShape(vec3 p, vec3 info, float seed) {
    float w = info.x * info.y * info.y * 0.035 + (1.0 - info.x) * p.y * p.y * 0.006;
    return p + vec3(sin(uTime * 1.3 + seed * 20.0 + info.z * 6.0), 0.4 * sin(uTime * 1.7 + info.z * 9.0), cos(uTime * 1.1 + info.z * 4.0)) * w;
  }`;

// Gemeinsam für Himmel, Meer und Gelände: Licht, Himmel, Wellen und das Wasser an einem Punkt der Oberfläche.
const BEACH_GLSL = `
  uniform float uTime;
  uniform sampler2D uWaves;
  uniform sampler2D uFoam;
  ${shadowGLSL(BEACH.shadowSize)}
  // Schaum mit Dichte dens an p: dicht ganz weiss, dann reisst er zu Zellen, dann zu Fäden auf und verschwindet
  // (createFoamTexture). In Strömungsrichtung dir gestreckt und mit dem Wasser um drift verschoben.
  float foamDissolve(vec2 p, float dens, vec2 dir, float drift) {
    vec2 q = vec2(dot(p, vec2(-dir.y, dir.x)), dot(p, dir) * 0.65 - drift);
    float t = texture2D(uFoam, q * 0.2).r * 0.7 + texture2D(uFoam, q * 0.53 + 0.37).r * 0.3;
    return smoothstep(1.0 - dens, 1.15 - dens, t);
  }
  const float WATER_Y = ${BEACH.waterY.toFixed(2)};
  const vec3 SUN = vec3(${BEACH.sun.toArray().map((v) => v.toFixed(4)).join(', ')});
  const vec3 SUN_COL = vec3(2.1, 1.25, 0.62);     // tiefe Sonne: warm, schon schwächer
  const vec3 SKY_AMB = vec3(0.055, 0.06, 0.115);  // Himmelslicht im Schatten: kühl
  const vec3 DEEP = vec3(0.0035, 0.018, 0.026);   // tiefes Wasser (Streulicht)
  const vec3 ABSORB = vec3(1.1, 0.27, 0.19);      // Schwächung je Einheit Weg im Wasser: Rot zuerst → türkis
  const vec2 SWELL = vec2(${BEACH.swell.join(", ")}); // Laufrichtung der Dünung, aufs Ufer zu

  vec3 horizonSky(vec2 xz) {
    float toSun = 0.5 + 0.5 * dot(normalize(xz + vec2(1e-5)), normalize(SUN.xz));
    return mix(vec3(0.075, 0.068, 0.1), vec3(0.5, 0.29, 0.16), pow(toSun, 6.0));
  }
  // Himmel: am Horizont glühend zur Sonne hin, gegenüber violett, oben tiefblau; Wolkenschleier von unten angestrahlt
  vec3 beachSky(vec3 d, float clouds) {
    float y = max(d.y, 0.0);
    vec3 upper = mix(vec3(0.034, 0.036, 0.07), vec3(0.008, 0.014, 0.042), smoothstep(0.12, 0.65, y)); // schiefergrau, oben tiefblau
    vec3 col = mix(horizonSky(d.xz), upper, pow(smoothstep(0.0, 0.3, y), 0.6));
    float sd = max(dot(d, SUN), 0.0);
    col += vec3(1.0, 0.42, 0.13) * (0.32 * pow(sd, 6.0) + 0.6 * pow(sd, 48.0)) + vec3(40.0, 22.0, 9.0) * smoothstep(1.5e-4, 0.8e-4, 1.0 - sd);
    if (clouds > 0.0) {
      vec2 cp = d.xz / (y + 0.1) * 0.05;
      float c = texture2D(uWaves, cp * vec2(0.5, 2.2) + vec2(uTime * 0.0004, 0.0)).a;
      c = smoothstep(0.52, 0.78, c) * smoothstep(0.0, 0.05, y) * smoothstep(0.6, 0.12, y);
      float toSun = 0.5 + 0.5 * dot(normalize(d.xz + vec2(1e-5)), normalize(SUN.xz));
      col = mix(col, mix(vec3(0.05, 0.03, 0.06), vec3(1.1, 0.42, 0.17), toSun * toSun * toSun), c * 0.8 * clouds);
    }
    return col;
  }
  // Dunst über dem Meer: in der Ferne geht alles in den Horizont über, vor der Himmelskugel (79) ganz
  vec3 beachHaze(vec3 col, vec3 d, float dist) {
    float a = max(1.0 - exp(-dist * 0.009), smoothstep(52.0, 77.0, dist));
    return mix(col, beachSky(normalize(vec3(d.x, 0.0, d.z) + vec3(1e-4, 0.0, 0.0)), 0.0) * 0.8, a);
  }

  // Dünung: Phase (Kamm bei 0), Wellenzahl und Kreisfrequenz. Im Flachen drehen die Wellenfronten parallel zum Ufer
  // (Refraktion): Dort zählt der Abstand zur Wasserlinie (shore, < 0 im Wasser; Gefälle shoreDir) statt der Richtung
  // der Dünung. off gleicht beide Masse in der Mitte des Übergangs an (je Ecke, siehe build): Sonst wichen sie entlang
  // der Küste verschieden weit ab, und die Wellen liefen dort gestaucht, gedehnt oder gar seewärts.
  const float SWELL_K = 0.8, SWELL_W = 1.1;
  float refraction(float shore) { return smoothstep(-24.0, -6.0, shore); }
  float swellPhase(vec2 p) { return dot(p, SWELL) * SWELL_K - uTime * SWELL_W; }
  float shorePhase(vec2 p, float shore, float off) { return mix(dot(p, SWELL), shore + off, refraction(shore)) * SWELL_K - uTime * SWELL_W; }
  vec2 swellDir(vec2 shoreDir, float shore) { return normalize(mix(SWELL, shoreDir, refraction(shore))); }
  float wrapPhase(float ph) { return mod(ph + 3.14159, 6.28319) - 3.14159; }
  // Wellengruppen: mal höhere, mal niedrigere Wellen, entlang der Küste versetzt
  float swellSetAt(vec2 p, float t) { return 0.75 + 0.25 * sin(t * 0.19 + p.x * 0.05) * sin(t * 0.083 + p.x * 0.031 + 1.7); }
  float swellSet(vec2 p) { return swellSetAt(p, uTime); }
  // ... für Welle Nummer m, als sie die Wasserlinie erreichte (off: Ausgleich der Phase, siehe shorePhase)
  float waveEnv(vec2 p, float m, float off) { return swellSetAt(p, (m * 6.28319 + off * SWELL_K) / SWELL_W); }
  // Profil einer gebrochenen Welle (Walze): Kamm bei 0, vorn (landwärts, x > 0) steil abfallend, hinten flach
  float bore(float x, float sharp) { return x > 0.0 ? exp(-x * sharp) : (x + 3.14159) * (x + 3.14159) * 0.10132; }
  // Höhe der Dünung über dem Meeresspiegel an Phase x; d: Wassertiefe (an Land negativ), env: Wellengruppe. Im
  // Flachen wird die Welle höher und steiler (Shoaling), bricht und läuft als Walze ans Ufer – nie höher, als das
  // Wasser tief ist. brk: ob diese Welle hier bricht (breakGaps) – wo nicht, bleibt sie rund; um das Wellental herum
  // gilt das nicht, sonst sprünge die Höhe dort, wo die nächste Welle beginnt.
  float swellHeight(float x, float d, float env, float sharp, float brk) {
    float b = smoothstep(1.8, 0.9, d) * mix(1.0, brk, smoothstep(3.0, 2.2, abs(x)));
    float shape = mix(cos(x), bore(x, sharp) - 0.19, b); // 0.19: Mittel der Walze
    return min(0.15 * env * (1.0 + 0.9 * smoothstep(5.0, 1.2, d)), 0.4 * max(d, 0.0) + 0.03) * shape;
  }
  // Auflaufen (Swash): Hat die Walze die Wasserlinie erreicht, schiesst sie als dünner Film den Strand hinauf, wird
  // langsamer und bleibt stehen, dann fliesst sie beschleunigt zurück – wie ein geworfener Ball, bis unter das Mittel.
  // Das Zurückfliessen dauert länger als das Hinauflaufen (gemessen: Umkehr nach etwa 40 % des Zyklus).
  // u: Zeit seit dem Eintreffen der Walze (Anteil der Wellenperiode); reach: Höhe, die diese Welle erreicht.
  const float SWASH_UP = 0.24, SWASH_DOWN = 0.4, SWASH_LOW = -0.1;
  float swashLevel(float u, float reach) {
    float r = reach - SWASH_LOW;
    if (u < SWASH_UP) { float t = 1.0 - u / SWASH_UP; return SWASH_LOW + r * (1.0 - t * t); }
    float t = min((u - SWASH_UP) / SWASH_DOWN, 1.0);
    return reach - r * t * t;
  }
  // Wann (u) das zurückfliessende Wasser die Höhe a freigibt
  float swashLeaves(float a, float reach) { return SWASH_UP + SWASH_DOWN * sqrt(clamp((reach - a) / (reach - SWASH_LOW), 0.0, 1.0)); }
  // Höhe, die Welle Nummer n erreicht: von Welle zu Welle und entlang des Strands verschieden
  float swashHash(float n, float i) { return fract(sin(mod(n, 256.0) * 12.9898 + i * 78.233) * 43758.5453); } // mod: sin bleibt genau
  float swashReach(float n, float along) {
    float a = along / 7.0, i = floor(a), f = smoothstep(0.0, 1.0, fract(a));
    float b = along / 2.3, j = floor(b), g = smoothstep(0.0, 1.0, fract(b)); // Zungen der Front
    return 0.15 + 0.2 * mix(swashHash(n, i), swashHash(n, i + 1.0), f) + 0.05 * (mix(swashHash(n + 0.5, j), swashHash(n + 0.5, j + 1.0), g) - 0.5);
  }
  // Nicht jede Welle bricht überall: Lücken entlang der Front, von Welle zu Welle anders (ph: ungefaltete Phase,
  // along: Lage entlang des Strands); nahe am Ufer bricht jede
  float breakGaps(float ph, float d, float along) {
    float waveNo = floor((ph - wrapPhase(ph)) / 6.28319 + 0.5);
    return mix(smoothstep(0.32, 0.5, texture2D(uWaves, vec2(along * 0.012, waveNo * 0.137)).a), 1.0, smoothstep(1.0, 0.6, d));
  }
  // Anteil des Auflaufens am Wasserstand: draussen nur die Dünung, am Ufer nur das Auflaufen
  float swashShare(float d) { return smoothstep(0.7, 0.05, d); }

  // Normale der Wasserfläche: die Dünung (Gefälle aus swellHeight, Richtung dir) und kurze Wellen – zwei Züge
  // analytisch, drei Lagen aus der Normal-Map; im dünnen Wasser am Strand glatt. var: Streuung der Steigungen, die das
  // Bild nicht mehr auflöst (aus der Länge der gemittelten Normalen in den Mipmaps) – in der Ferne wird das Glitzern so
  // zu einem breiten Schimmer, statt zu flimmern.
  vec3 waterNormal(vec2 p, float dist, float x, vec2 dir, float d, float env, float sharp, float brk, out float var) {
    vec2 d2 = vec2(-0.34, -0.94), d3 = vec2(0.53, -0.848);
    float calm = smoothstep(0.0, 0.8, d);
    vec2 s = dir * SWELL_K * (swellHeight(x + 0.03, d, env, sharp, brk) - swellHeight(x - 0.03, d, env, sharp, brk)) / 0.06 * (1.0 - swashShare(d));
    s += d2 * 0.05 * calm * sin(dot(p, d2) * 0.95 - uTime * 1.05 + 1.3);
    s += d3 * 0.035 * calm * sin(dot(p, d3) * 1.4 - uTime * 1.25 + 4.1);
    const mat2 ROT = mat2(0.8, 0.6, -0.6, 0.8);
    vec3 a = texture2D(uWaves, p * 0.09 + vec2(0.004, -0.013) * uTime).rgb * 2.0 - 1.0;
    vec3 b = texture2D(uWaves, (ROT * p) * 0.27 + vec2(-0.011, -0.02) * uTime).rgb * 2.0 - 1.0;
    float ripple = 0.25 + 0.75 * calm;
    vec3 c = texture2D(uWaves, p * 0.83 + vec2(0.031, -0.027) * uTime).rgb * 2.0 - 1.0;
    s -= a.xy / max(a.z, 0.3) * 0.3 * ripple;
    s -= (b.xy / max(b.z, 0.3)) * ROT * 0.32 * ripple; // zurückgedreht (Gradient: transponiert)
    s -= c.xy / max(c.z, 0.3) * 0.22 * ripple;
    var = 0.004 + (0.1 * max(1.0 - length(a), 0.0) + 0.1 * max(1.0 - length(b), 0.0) + 0.06 * max(1.0 - length(c), 0.0)) * ripple + dist * 0.00004; // gerundete Texel: Länge über 1
    return normalize(vec3(-s.x, 1.0, -s.y));
  }

  // Spiegelung der Sonne auf einer rauen Fläche (Beckmann-Verteilung mit Streuung var der Steigungen)
  float sunGlint(vec3 N, vec3 V, float var) {
    vec3 H = normalize(SUN + V);
    float nh = max(dot(N, H), 0.05), nh2 = nh * nh;
    float D = exp(-(1.0 - nh2) / (nh2 * 2.0 * var)) / (6.2832 * var * nh2 * nh2);
    float F = 0.02 + 0.98 * pow(1.0 - max(dot(V, H), 0.0), 5.0);
    return min(D * F / (4.0 * max(dot(N, V), 0.15)) * 0.05, 12.0);
  }

  // Wasser mit Normale N, von der Kamera aus Richtung V gesehen; below: Licht von unten (Grund, Tiefe)
  vec3 waterColor(vec3 N, float var, vec3 V, vec3 below) {
    float F = 0.02 + 0.98 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
    vec3 R = reflect(-V, N);
    vec3 col = mix(below, beachSky(vec3(R.x, abs(R.y), R.z), 0.0), F);
    return col + SUN_COL * sunGlint(N, V, var);
  }`;

const beachUniforms = {
  uFade: { value: 0 },
  uTime: { value: 0 },

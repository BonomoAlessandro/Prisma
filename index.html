<script>
  // Manifest (Icon für den Android-Startbildschirm) und Service Worker (offline spielbar, siehe sw.js) nur über
  // http(s): über file:// blockiert der Browser das Manifest mit Fehler und kennt keine Service Worker. updateViaCache:
  // sw.js bei jedem Besuch beim Server prüfen. Im Dev-Server (npm run dev) setzt vite.config.mjs PRISMA_DEV: dort kein
  // Service Worker, sonst lieferte er alte Stände. Registriert erst, wenn load da ist und src/main.ts das Spiel geladen
  // und die Enthüllung hinter sich hat (Ereignis prisma-ruhig, Ticket 09 des Umbaus): Mit await auf oberster Ebene in
  // den Modulen kommt load schon vor dem Seitenstart, und das Vorab-Speichern liefe sonst während seiner mit. In der
  // Android-App (PRISMA_APP, npm run build:app; Ticket 10) weder Manifest noch Service Worker: das Spiel liegt in der App
  if (/^https?:/.test(location.protocol) && !window.PRISMA_APP) {
    document.head.insertAdjacentHTML('beforeend', '<link rel="manifest" href="manifest.webmanifest">');
    if ('serviceWorker' in navigator && !window.PRISMA_DEV) {
      Promise.all(['load', 'prisma-ruhig'].map((e) => new Promise((r) => addEventListener(e, r, { once: true }))))
        .then(() => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })).catch(() => {});
    }
  }
</script>

<script>
/**
 * Massstab der Seite (Ticket 18 von .scratch/leistung/): Auf Handys mit mehr als 2 Gerätepixeln je CSS-Pixel rastert
 * die Seite mit 2 (Meta-Viewport mit initial-scale 2 / devicePixelRatio, wie das Spiel mit Pixelverhältnis höchstens 2).
 * Die Bühne der Geschichte rastert so ihre grossen Ebenen kleiner: Auf dem Poco F4 GT (2,75) fehlten in den Fahrten
 * sonst Kacheln, und der Compositor brach Bilder ab. Alles übrige (Schrift, Knöpfe, Spiel) ist um SEITE vergrössert
 * (CSS zoom am body, die Bühne nimmt es zurück) und sieht genau aus wie vorher, auch gleich scharf.
 * SEITE: Pixel des Layouts je Pixel der Oberfläche (1 ohne Massstab). Pixel der Oberfläche sind die der Stile; in
 * Pixeln des Layouts rechnen innerWidth, innerHeight, clientX/clientY und getBoundingClientRect, die Bühne und
 * Medienabfragen. Medienabfragen mit px im Stil rechnet dieser Block um; in JavaScript seiteMedia().
 * Nur wo der Browser den Meta-Viewport übernimmt (Android; nicht Desktop, dort prüft visualViewport.scale) und CSS
 * zoom nach dem Standard rechnet (currentCSSZoom: Chrome ab 128, Firefox ab 126); nicht auf iOS (Safari lässt dort
 * trotz maximum-scale zoomen, und das Abbrechen von Bildern ist ein Befund von Chrome). Nur Chromium (Firefox Android
 * ungeprüft, Review Ticket 18). ?diag=seite275: ohne, wie bis Ticket 18 (zum Messen).
 */
const SEITE = (() => {
  const dpr = window.devicePixelRatio || 1;
  const diag = (new URLSearchParams(location.search).get('diag') ?? '').split(',');
  if (dpr <= 2 || diag.includes('seite275') || !('currentCSSZoom' in Element.prototype) || !/Chrome\//.test(navigator.userAgent)
    || CSS.supports('-webkit-touch-callout', 'none') || !window.visualViewport) return 1;
  const meta = document.querySelector('meta[name="viewport"]'), vorher = meta.content, s = 2 / dpr;
  meta.content = `width=device-width, initial-scale=${s}, minimum-scale=${s}, maximum-scale=${s}, user-scalable=no, viewport-fit=cover`;
  // der Browser übernimmt den Massstab sofort (Chrome: mit dem Layout, das innerWidth anstösst), oder gar nicht
  // (Desktop): dann wie vorher
  void window.innerWidth;
  if (Math.abs(visualViewport.scale - s) > 0.01) { meta.content = vorher; return 1; }
  return dpr / 2;
})();
/**
 * Breite und Höhe des Bildschirms in Pixeln der Oberfläche; ohne Massstab genau innerWidth, innerHeight. Mit Massstab
 * aus visualViewport (das Layout ist nicht ganzzahlig gross, Chrome rundet den Massstab, innerWidth ist gerundet; die
 * Seite scrollt nie, der Massstab steht), aufgerundet, damit das Bild des Spiels auch den letzten Gerätepixel deckt
 * (Emulation 393 × 873: 786 × 1746 wie ohne Massstab, je nach Rundung ein Pixel der Oberfläche mehr).
 */
const seiteBreite = () => SEITE === 1 ? window.innerWidth : Math.ceil(visualViewport.width / SEITE - 0.01);
const seiteHoehe = () => SEITE === 1 ? window.innerHeight : Math.ceil(visualViewport.height / SEITE - 0.01);
/** Medienabfrage mit Längen in Pixeln der Oberfläche, für matchMedia (Pixel mal SEITE). */
const seiteMedia = (text) => SEITE === 1 ? text
  : text.replace(/(\d*\.?\d+)px/g, (_, v) => `${+(v * SEITE).toFixed(3)}px`);
if (SEITE !== 1) {
  document.documentElement.classList.add('seite');
  document.documentElement.style.setProperty('--seite', SEITE);
  const umrechnen = (regeln) => {
    for (const r of regeln) {
      if (r instanceof CSSMediaRule) r.media.mediaText = seiteMedia(r.media.mediaText);
      if (r.cssRules) umrechnen(r.cssRules);
    }
  };
  for (const blatt of document.styleSheets) umrechnen(blatt.cssRules);
}
</script>

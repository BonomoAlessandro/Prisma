 * Szene unter der Oberfläche (ctx.under, von waterSurface): Das Wasser legt sie als Grund unter seine Oberfläche, mit
 * Brechung, Spiegelung, Schaum und Glitzern darüber – über allem gezeichnet sahen die Fische aus, als flögen sie.
 */
function fishSchools(ctx, opt) {
  const w = ctx.data[opt.data], under = ctx.under;
  if (!under) throw new Error('braucht waterSurface davor');
  const sim = createFishSim({ ...opt, keepOut: PLATE / 2 + 0.3 });
  loadSkyImage(w.map).then((img) => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    const g = canvas.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const px = g.getImageData(0, 0, img.width, img.height).data, m = img.width * img.height;
    const depth = new Float32Array(m), rock = new Float32Array(m), [d0, d1] = w.depthRange;
    for (let i = 0; i < m; i++) {
      depth[i] = d0 + ((d1 - d0) * (px[4 * i] * 256 + px[4 * i + 1])) / 65535;
      rock[i] = px[4 * i + 2] / 255;
    }
    sim.setField(fishField(depth, rock, img.width, w.extent, opt.minDepth));
  }).catch((e) => console.warn(`Fische: Wasserkarte nicht lesbar (${e.message})`));

  const PAT = { tang: 0, bands: 1, plain: 2 };
  const n = sim.count;
  const attr = (size, get) => new THREE.InstancedBufferAttribute(Float32Array.from(sim.fish.flatMap(get)), size);
  const school = (f) => opt.schools[f.school];
  // je Bild aus der Simulation: Ort (x, Tiefe, z, Neigung) und Bewegung (Richtung, Biegung, Phase, Stärke)
  const aPos = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4).setUsage(THREE.DynamicDrawUsage);
  const aMove = new THREE.InstancedBufferAttribute(new Float32Array(n * 4), 4).setUsage(THREE.DynamicDrawUsage);
  const aShape = attr(4, (f) => [f.len, school(f).shape[0], school(f).shape[1], PAT[school(f).pattern]]);
  const decl = `
        attribute vec4 aPos, aMove, aShape;
        const float LEVEL = ${glf(w.level)};
        // Mitte des Fischs und die Achsen seiner Form: x nach hinten (Kopf vorn), z zur Seite
        vec3 fishAt() { return vec3(aPos.x, LEVEL - aPos.y, aPos.z); }
        vec2 fishBack() { return -vec2(cos(aMove.x), sin(aMove.x)); }`;
  const common = { ...ctx.uniforms, uPano: { value: ctx.pano.full }, uCenter: { value: ctx.pano.center } };

  // Fische
  const body = new THREE.InstancedBufferGeometry().copy(createFishGeometry());
  body.instanceCount = n;
  body.setAttribute('aPos', aPos);
  body.setAttribute('aMove', aMove);
  body.setAttribute('aShape', aShape);
  body.setAttribute('aC1', attr(3, (f) => school(f).colors[0]));
  body.setAttribute('aC2', attr(3, (f) => school(f).colors[1]));
  body.setAttribute('aC3', attr(3, (f) => school(f).colors[2]));
  const fishMat = new THREE.ShaderMaterial({
    uniforms: common,
    extensions: { shaderTextureLOD: true },
    side: THREE.DoubleSide,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    vertexShader: `${decl}
        attribute vec3 aUV, aC1, aC2, aC3;
        varying vec3 vPos, vN, vUV, vC1, vC2, vC3;
        varying float vPat;
        void main() {
          // Körper: Länge, Höhe, Breite. Schwanzschlag als Welle zum Schwanz hin, hinten stärker (Phase und Stärke aus der
          // Simulation); in der Kurve gebogen, Kopf und Schwanz zur Innenseite (aMove.y: Krümmung × Länge); beim Steigen
          // und Sinken geneigt
          float u = position.x;
          float side = sin(aMove.z - u * 4.0) * 0.16 * aMove.w * u * u - 0.5 * aMove.y * (u - 0.4) * (u - 0.4);
          // Umriss ±0,5 hoch, ±0,22 breit: auf Höhe aShape.y und Breite aShape.z je Länge
          vec3 q = vec3(u - 0.5, position.y * aShape.y, position.z / 0.44 * aShape.z + side) * aShape.x;
          q.y -= q.x * aPos.w;
          vec3 n = vec3(normal.x, normal.y / aShape.y, normal.z * 0.44 / aShape.z);
          vec2 xd = fishBack(), zd = vec2(-xd.y, xd.x);
          vec3 wp = fishAt() + vec3(xd.x * q.x + zd.x * q.z, q.y, xd.y * q.x + zd.y * q.z);
          vN = normalize(vec3(xd.x * n.x + zd.x * n.z, n.y, xd.y * n.x + zd.y * n.z));
          vPos = wp; vUV = aUV; vC1 = aC1; vC2 = aC2; vC3 = aC3; vPat = aShape.w;
          gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        }`,
    fragmentShader: `
        #if __VERSION__ >= 300
          #define LOD0(t, p) textureLod(t, p, 0.0)
        #elif defined(GL_EXT_shader_texture_lod)
          #define LOD0(t, p) texture2DLodEXT(t, p, 0.0)
        #else
          #define LOD0(t, p) texture2D(t, p)
        #endif
        uniform sampler2D uPano;
        uniform vec3 uCenter;
        uniform float uTime;
        varying vec3 vPos, vN, vUV, vC1, vC2, vC3;
        varying float vPat;
        const float LEVEL = ${glf(w.level)};
        const vec3 ABSORB = vec3(0.4, 0.1, 0.07); // Schwächung je m Weg im Wasser (Rot zuerst; klar in der Lagune)
        vec3 pano(vec3 d) {
          vec3 b = normalize(vec3(d.x, -d.z, d.y));
          return LOD0(uPano, vec2(0.5 + atan(b.x, b.y) / 6.2831853, 1.0 - acos(clamp(b.z, -1.0, 1.0)) / 3.1415927)).rgb;
        }
        void main() {
          float u = vUV.x, v = vUV.y;
          // Muster
          vec3 col = vC1;
          if (vPat < 0.5) {        // Doktorfisch: dunkle Zeichnung auf dem Rücken, Schwanz farbig
            col = mix(col, vC2, smoothstep(0.15, 0.3, v) * smoothstep(0.12, 0.25, u) * smoothstep(0.85, 0.7, u)
              * smoothstep(0.3, 0.6, abs(vUV.z)));   // nur seitlich: von oben sieht man den blauen Rücken
            col = mix(col, vC3, step(0.98, u));
          } else if (vPat < 1.5) { // Clownfisch: drei helle Bänder mit dunklem Rand
            float b = min(min(abs(u - 0.22), abs(u - 0.55)), abs(u - 0.9));
            col = mix(vC2, col, smoothstep(0.05, 0.07, b));
            col = mix(col, vC3, smoothstep(0.065, 0.075, b) * smoothstep(0.095, 0.085, b));
            col = mix(col, vC3, step(1.12, u) * 0.8);
          } else {                 // schlicht: Bauch heller, Flossen eigene Farbe
            col = mix(col, vC2, smoothstep(-0.1, -0.6, v));
            col = mix(col, vC3, step(0.98, u) + step(1.05, v));
          }
          // Auge
          col *= 1.0 - 0.85 * smoothstep(0.045, 0.03, length(vec2(u - 0.1, (v - 0.25) * 0.5)) ) * step(0.3, abs(vUV.z));
          // Licht von oben (Sonne und Himmel durchs Wasser), unten dunkler, flimmernde Lichtnetze
          vec3 N = normalize(vN);
          float shimmer = 0.85 + 0.3 * sin(vPos.x * 3.1 + uTime * 2.3) * sin(vPos.z * 2.7 - uTime * 1.9);
          col *= (0.5 + 0.5 * clamp(N.y * 0.5 + 0.5, 0.0, 1.0)) * shimmer * 1.5;
          // Weg durchs Wasser bis zur Oberfläche: Rot zuerst geschluckt, das Licht des Wassers darüber (Spiegelung und
          // Brechung an der Oberfläche macht das Wasser). Unter Wasser läuft der Strahl gebrochen steiler (Brechzahl
          // 1,33): höchstens 1,5-mal die Tiefe – gerade gerechnet wurde er bei flachem Blick doppelt so lang, und die
          // Fische verschwanden im Wasserlicht
          vec3 V = normalize(cameraPosition - vPos);
          float depth = max(LEVEL - vPos.y, 0.0), path = depth / sqrt(1.0 - (1.0 - V.y * V.y) / 1.769);
          vec3 water = pano(vec3(vPos.x, LEVEL - depth - 0.6, vPos.z) - uCenter);
          col = col * exp(-ABSORB * path) + water * (1.0 - exp(-0.45 * path));
          float a = smoothstep(48.0, 30.0, length(vPos.xz));
          gl_FragColor = vec4(col * a, a);
        }`,
  });
  const fishMesh = new THREE.Mesh(body, fishMat);
  fishMesh.frustumCulled = false;

  // Schatten auf dem Grund: weiche dunkle Flecken, von der (gebrochenen) Sonne versetzt
  const quad = new THREE.InstancedBufferGeometry();
  quad.setAttribute('position', new THREE.Float32BufferAttribute([-1, 0, -1, 1, 0, -1, 1, 0, 1, -1, 0, 1], 3));
  quad.setIndex([0, 2, 1, 0, 3, 2]);
  quad.instanceCount = n;
  for (const name of ['aPos', 'aMove', 'aShape']) quad.setAttribute(name, body.getAttribute(name));
  const shadowMat = new THREE.ShaderMaterial({
    uniforms: { uMap: { value: mapTexture(w.map, 'Karte') } },
    transparent: true, depthWrite: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    vertexShader: `${decl}
        ${ctx.lightGLSL}
        uniform sampler2D uMap;
        const float EXT = ${glf(w.extent)};
        const vec2 DEPTH = ${glv(w.depthRange)};
        varying vec2 vQ;
        varying float vA;
        void main() {
          vec3 p = fishAt();
          vec2 hl = texture2D(uMap, vec2((p.x + EXT) / (2.0 * EXT), 1.0 - (p.z + EXT) / (2.0 * EXT))).rg;
          float bed = LEVEL - max(mix(DEPTH.x, DEPTH.y, (hl.x * 65280.0 + hl.y * 255.0) / 65535.0), 0.0);
          // im Wasser steiler gebrochen (Brechzahl 1,33)
          vec3 L = normalize(vec3(SKY_LIGHT.x / 1.33, sqrt(max(1.0 - dot(SKY_LIGHT.xz, SKY_LIGHT.xz) / 1.769, 0.05)), SKY_LIGHT.z / 1.33));
          vec3 s = p - L * (p.y - bed) / L.y;
          // je höher über dem Grund, desto weicher und blasser (die Wellen streuen das Licht)
          float h = p.y - bed, blur = 1.0 + 0.3 * h;
          vec2 xd = fishBack(), zd = vec2(-xd.y, xd.x);
          vec2 q = position.xz * vec2(0.75, 0.35) * aShape.x * blur;
          vec3 wp = vec3(s.x + xd.x * q.x + zd.x * q.y, bed + 0.02, s.z + xd.y * q.x + zd.y * q.y);
          vQ = position.xz;
          vA = smoothstep(4.5, 0.3, h) / blur;
          gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        }`,
    fragmentShader: `
        varying vec2 vQ;
        varying float vA;
        void main() {
          float a = ${glf(opt.shadow)} * vA * smoothstep(1.0, 0.2, length(vQ));
          gl_FragColor = vec4(0.0, 0.0, 0.0, a);
        }`,
  });
  const shadowMesh = new THREE.Mesh(quad, shadowMat);
  shadowMesh.frustumCulled = false;
  fishMesh.visible = shadowMesh.visible = false; // bis die Wasserkarte gelesen ist
  under.scene.add(shadowMesh, fishMesh);

  const holder = new THREE.Group();
  const s = new Float64Array(10);
  holder.userData.update = (t) => {
    const alpha = sim.advance(t);
    if (alpha === null) return; // Wasserkarte noch nicht gelesen
    for (let k = 0; k < n; k++) {
      sim.sample(k, alpha, s);
      aPos.setXYZW(k, s[0], s[4], s[1], s[8]);
      aMove.setXYZW(k, s[2], s[5], s[6], s[7]);
    }
    aPos.needsUpdate = aMove.needsUpdate = true;
    fishMesh.visible = shadowMesh.visible = true;
  };
  return holder;
}

const SKY_LAYERS = { toonInstances, glowParticles, mistSheets, waterSurface, fishSchools };

/**
 * Eine Skybox aus ihrem Manifest (Eintrag im Register). Schnittstelle wie die übrigen Hintergründe (skyTheme):
 * prepare() lädt, setFade(k) blendet ein (0 … 1), update(t, dt) jedes Bild solange sichtbar, ready = ganz eingeblendet,
 * release() gibt den Grafikspeicher frei (ausgeblendet und nicht gewählt; prepare() lädt danach neu).
 */
function createPanoramaSky(m) {
  const group = new THREE.Group();
  group.visible = false;
  const uniforms = { uFade: { value: 0 }, uReady: { value: 0 }, uTime: { value: 0 } };
  const pointUniforms = { ...uniforms, uPixelRatio: { value: renderer.getPixelRatio() } };
  const light = new THREE.Vector3().fromArray(m.light.dir).normalize();
  const lightGLSL = `const vec3 SKY_LIGHT = vec3(${light.toArray().map((v) => v.toFixed(4)).join(', ')});`;
  let loading = null, mesh = null, age = null, token = 0, offscreen = [];

  /** Teil laden (Skript mit Data-URLs); es muss zum Stand des Registers passen */
  async function loadPart(role) {
    const part = m.parts.find((p) => p.role === role);
    await loadSkyScript(`backgrounds/${part.file}`);
    const key = `${m.id}/${role}`, got = window.PRISMA_SKY_PARTS?.[key];
    delete window.PRISMA_SKY_PARTS?.[key]; // die Bilder stecken gleich in den Texturen
    if (!got || got.rev !== m.rev) throw new Error(`${part.file}: anderer Stand als im Register`);
    return got;
  }

  async function build(my) {
    const base = await loadPart('base');
    const hd = PANO.hd && m.parts.some((p) => p.role === 'bands')
      ? await loadPart('bands').catch((e) => { console.warn(`${m.name}: ${e.message}, ohne Streifen`); return null; }) : null;
    const rects = hd ? m.panorama.bands : [];
    const [fullImg, depthImg, ...bandImgs] = await Promise.all([base.full, base.depth, ...(hd?.bands ?? [])].map(loadSkyImage));
    if (my !== token) return; // inzwischen wieder freigegeben
    const center = new THREE.Vector3().fromArray(m.panorama.center);
    const full = skyTexture(fullImg, true);
    mesh = new THREE.Mesh(skyProxyGeometry(skyLogDepth(depthImg, m.panorama.depth.log), center),
      skyPanoramaMaterial(uniforms, center, full, rects.map((b, i) => ({ ...b, tex: skyTexture(bandImgs[i], false) }))));
    mesh.renderOrder = -1000;          // zuerst: alles Übrige liegt davor, der Tiefentest verwirft es früh
    mesh.frustumCulled = false;
    const parts = [mesh];
    // Tiefe ungeglättet (16 Bit in Rot und Grün: nächste Nachbarn, das Wasser mischt selbst im Log)
    const depth = new THREE.Texture(depthImg);
    depth.minFilter = depth.magFilter = THREE.NearestFilter;
    depth.generateMipmaps = false;
    depth.wrapS = THREE.RepeatWrapping;
    depth.needsUpdate = true;
    const pano = { full, center, depth: { tex: depth, size: [depthImg.width, depthImg.height], log: m.panorama.depth.log } };
    const ctx = { uniforms, pointUniforms, data: base.data ?? {}, light, lightGLSL, fog: m.fog, air: m.air, pano, offscreen: [] };
    for (const layer of m.layers ?? []) {
      try {
        if (!SKY_LAYERS[layer.type]) throw new Error('unbekannt');
        parts.push(SKY_LAYERS[layer.type](ctx, layer));
      } catch (e) { console.warn(`${m.name}: Ebene ${layer.type} ausgelassen (${e.message})`); }
    }
    // Nicht in der Bodenspiegelung (dort wird auch die Himmelskugel ausgeblendet), nicht anklickbar
    for (const p of parts) {
      p.traverse((o) => { o.layers.set(LAYER_NO_REFLECT); o.raycast = () => {}; });
      group.add(p);
    }
    offscreen = ctx.offscreen;
    // schon jetzt übersetzen, nicht im ersten Bild des Einblendens (falls sichtbar)
    for (const s of [scene, ...offscreen]) renderer.compile(s, camera);
  }

  /** Während des Überblendens und Einblendens durchsichtig über der Himmelskugel, sonst undurchsichtig und zuerst. */
  function applyFade() {
    if (!mesh) return;
    const transparent = uniforms.uFade.value * uniforms.uReady.value < 0.999;
    if (mesh.material.transparent !== transparent) {
      mesh.material.transparent = transparent;
      mesh.material.needsUpdate = true;
    }
  }

  return {
    group,
    panorama: true,
    get ready() { return uniforms.uReady.value >= 1; },
    /** Erst laden, wenn die Skybox gewählt wird (Wald: 1,5 MB, auf dem Desktop dazu 4,5 MB Streifen). */
    prepare() {
      loading ??= build(token).catch((e) => console.error(`${m.name}: ${e.message}`));
    },
    setFade(k) {
      uniforms.uFade.value = k;
      if (k > 0) this.prepare();
      group.visible = k > 0;
      applyFade();
    },
    update(t, dt) {
      if (!mesh) return;
      age = age === null ? 0 : age + dt; // in dt, nicht in t: läuft auch bei angehaltener Zeit (?t=)
      uniforms.uReady.value = Math.min(1, age / PANO.appear);
      uniforms.uTime.value = t;
      pointUniforms.uPixelRatio.value = renderer.getPixelRatio();
      for (const p of group.children) p.userData.update?.(t, dt);
      applyFade();
    },
    release() {
      if (!loading) return;
      token++;
      loading = null; mesh = null; age = null;
      uniforms.uReady.value = 0;
      for (const root of [group, ...offscreen]) root.traverse((o) => {
        o.userData.dispose?.();
        if (o.isInstancedMesh) o.dispose(); // Puffer der Instanzen (Geometrie und Material bleiben, siehe unten)
        o.geometry?.dispose();
        for (const mat of [o.material ?? []].flat()) {
          for (const u of Object.values(mat.uniforms ?? {})) if (u.value?.isTexture) u.value.dispose();
          mat.dispose();
        }
      });
      group.clear();
      offscreen = [];
    },
  };
}

/**
 * Hintergrund umschalten (Knopf unten rechts, Taste H; der Reihe nach, order): Milchstrasse und Sonnensystem aus dem
 * Code, dazu jede Skybox aus Blender im Register (backgrounds/skies.js, SKYBOX: Wald, Strand). Die Wahl bleibt
 * gespeichert. Beim Wechsel blendet erst der bisherige Hintergrund ganz aus, dann der neue ein: Undurchsichtige Teile
 * (Planeten, nahe 3D-Objekte einer Skybox) blenden aus Schwarz ein und lägen sonst als dunkle Flächen über dem alten. Darum ist immer
 * höchstens einer eingeblendet, und Himmelskugel und Sterne mischen nur zwischen ihm und dem Neutralzustand (dunkler
 * Raum mit Sternen). sky: milkyWay (Anteil der Milchstrasse), stars (Helligkeit der Sterne), starsAboveHorizon (Sterne
 * nur über dem Horizont), rings (Platzhalter der Kugel, solange ein Panorama lädt oder überblendet). Module: prepare, setFade, update, ready,
 * release (siehe createPanoramaSky).
 */
const SKY_NEUTRAL = { milkyWay: 0, stars: 1, starsAboveHorizon: false, rings: null };
const SKY_ENTRIES = (() => {
  const code = [
    { id: 'milky', name: 'Milchstrasse', order: 10, sky: { milkyWay: 1 } },
    { id: 'solar', name: 'Sonnensystem', order: 20, module: solar },
  ];
  // Ein unbrauchbarer Eintrag (unbekannte Fassung, id doppelt, Fehler beim Anlegen) fällt mit einer Warnung weg; das Spiel
  // läuft mit den übrigen Hintergründen weiter
  const ids = new Set(code.map((e) => e.id));
  const blender = [];
  for (const m of window.PRISMA_SKIES ?? []) {
    try {
      if (m.format !== SKY_FORMAT) throw new Error(`Fassung ${m.format} unbekannt`);
      if (ids.has(m.id)) throw new Error('id doppelt');
      const rings = m.sky?.rings;
      if (!Array.isArray(rings) || rings.length !== 9 || !rings.every((c) => Array.isArray(c) && c.length === 3 && c.every(Number.isFinite))) {
        throw new Error('sky.rings: 9 Farben');
      }
      blender.push({ id: m.id, name: m.name, order: m.order, sky: m.sky, module: createPanoramaSky(m) });
      ids.add(m.id);
    } catch (e) { console.warn(`Skybox ${m?.id}: übersprungen (${e.message})`); }
  }
  delete window.PRISMA_SKIES;
  return [...code, ...blender].map((e) => ({ ...e, sky: { ...SKY_NEUTRAL, ...e.sky } })).sort((a, b) => a.order - b.order);
})();
for (const e of SKY_ENTRIES) if (e.module?.panorama) scene.add(e.module.group);

const skyTheme = {
  storageKey: 'prisma.sky',
  entries: SKY_ENTRIES,
  byId: new Map(SKY_ENTRIES.map((e) => [e.id, e])),
  order: SKY_ENTRIES.map((e) => e.id),
  names: Object.fromEntries(SKY_ENTRIES.map((e) => [e.id, e.name])),
  current: 'milky',
  weight: Object.fromEntries(SKY_ENTRIES.map((e) => [e.id, e.id === 'milky' ? 1 : 0])), // Anteil, 0 … 1
  fadeTime: 0.9,   // s für Aus- und Einblenden zusammen
  // Eine ausgeblendete Skybox aus Blender gibt ihren Grafikspeicher frei: auf dem Handy sofort, sonst nach keep s
  // (wer mit H durchschaltet, kommt bald wieder vorbei, und Neuladen kostet einen Ruckler) – und immer, sobald eine
  // andere gewählt ist: nie zwei Panoramen zugleich im Grafikspeicher.
  keep: IS_MOBILE ? 0 : 30,
  hidden: {},      // s ausgeblendet, je Hintergrund
  goal(id) { return id === this.current ? 1 : 0; },
  get fading() { return this.order.some((id) => this.weight[id] !== this.goal(id)); },
  /** Gewählter Hintergrund ganz eingeblendet (Tests) */
  get ready() { return !this.fading && (this.byId.get(this.current).module?.ready ?? true); },
  /** remember: als Wahl speichern (nicht bei ?sky=, ein geteilter Link soll die Wahl des Spielers nicht ändern) */
  set(id, animate = true, remember = true) {
    this.current = id;
    this.hidden[id] = 0;                   // gewählt: die Frist fürs Freigeben beginnt erst beim Wegschalten
    this.byId.get(id).module?.prepare?.(); // vor dem Ausblenden: sonst stockte die Überblendung
    if (!animate) for (const n of this.order) this.weight[n] = this.goal(n);
    if (remember) try { localStorage.setItem(this.storageKey, id); } catch { /* egal */ }
    this.apply();
  },
  next() { this.set(this.order[(this.order.indexOf(this.current) + 1) % this.order.length]); },
  update(dt, t) {
    if (this.fading) {
      const step = 2 * dt / this.fadeTime;
      const others = this.order.filter((n) => n !== this.current);
      for (const n of others) this.weight[n] = Math.max(0, this.weight[n] - step);
      if (others.every((n) => this.weight[n] === 0)) this.weight[this.current] = Math.min(1, this.weight[this.current] + step);
      this.apply();
    }
    const otherPanorama = this.byId.get(this.current).module?.panorama;
    for (const e of this.entries) {
      if (this.weight[e.id] > 0) { e.module?.update(t, dt); this.hidden[e.id] = 0; continue; }
      if (e.id === this.current || !e.module?.release) continue;
      this.hidden[e.id] = (this.hidden[e.id] ?? 0) + dt;
      if (otherPanorama || this.hidden[e.id] >= this.keep) e.module.release();
    }
  },
  apply() {
    const a = this.entries.find((e) => this.weight[e.id] > 0); // höchstens einer (siehe oben)
    const w = a ? this.weight[a.id] : 0, k = w * w * (3 - 2 * w), s = a?.sky ?? SKY_NEUTRAL;
    const mix = (key) => SKY_NEUTRAL[key] + k * (s[key] - SKY_NEUTRAL[key]);
    const bg = background.material.uniforms;
    bg.uGlow.value = SKY.glow * mix('milkyWay');
    bg.uPano.value = s.rings ? k : 0;
    if (s.rings) s.rings.forEach((c, i) => bg.uRings.value[i].fromArray(c));
    stars.material.uniforms.uFade.value = mix('stars');
    stars.material.uniforms.uHorizon.value = s.starsAboveHorizon ? k : 0;
    // Die Himmelskugel (Radius 80 um die Kamera, ohne Tiefe) zeichnet nach dem Netz eines Panoramas und deckte weiter
    // draussen liegende Teile zu. Mit 116 (vor camera.far = 120) liegt sie überall dahinter; sie rechnet nur mit der
    // Richtung, sieht also gleich aus.
    background.scale.setScalar(a?.module?.panorama ? 116 / 80 : 1);
    for (const e of this.entries) e.module?.setFade(e === a ? k : 0);
  },
};
try {
  const stored = localStorage.getItem(skyTheme.storageKey);
  if (skyTheme.order.includes(stored)) skyTheme.current = stored;
} catch { /* Standard */ }
// ?sky=forest: diesen Hintergrund zeigen, ohne ihn als Wahl zu speichern (Tests, Links)
const urlSky = new URLSearchParams(location.search).get('sky');
if (skyTheme.order.includes(urlSky)) skyTheme.current = urlSky;
skyTheme.set(skyTheme.current, false, false); // nichts speichern: fehlt die gespeicherte Skybox gerade, bleibt die Wahl

/* =====================================================================
   STEINPLATTE mit planarer Spiegelung
   ===================================================================== */

const stoneTex = createStoneTextures(QUALITY.textureSize);

// Spiegelungs-Kamera: rendert die Szene gespiegelt in eine Textur,
// die vom Bodenmaterial (je nach Rauheit leicht weichgezeichnet) gelesen wird.
const reflector = new THREE.Reflector(new THREE.PlaneGeometry(PLATE, PLATE), {
  textureWidth: 256,
  textureHeight: 256,
  clipBias: 0.002,
  multisample: 0, // MSAA wird unten über samples gesetzt (WebGL2)
});
// Hängt bewusst nicht im Szenengraph; seine Matrix wird in renderReflection() vom Boden übernommen.
reflector.getRenderTarget().stencilBuffer = true; // 24 statt 16 Bit Tiefe (vor dem ersten Rendern setzen)
// Kantenglättung in der Spiegelung: sonst bekommen Strahlen und Kristalle in der kleinen Textur
// Treppenkanten. three.js löst MSAA vor dem Erzeugen der Mipmaps auf – beides lässt sich kombinieren.
if (renderer.capabilities.isWebGL2) reflector.getRenderTarget().samples = QUALITY.reflectionMsaa;
// Mipmaps: Unschärfe je nach Rauheit mit einer einzigen Abtastung (versetzte Abtastungen erzeugten Geisterbilder)
if (renderer.capabilities.isWebGL2) { // WebGL1 kann keine Mipmaps für NPOT-Texturen
  reflector.getRenderTarget().texture.generateMipmaps = true;
  reflector.getRenderTarget().texture.minFilter = THREE.LinearMipmapLinearFilter;
}

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: stoneTex.map,
  roughness: 1.0,
  roughnessMap: stoneTex.roughnessMap,
  metalness: 0.0,
  normalMap: stoneTex.normalMap,
  normalScale: new THREE.Vector2(0.12, 0.12), // nur ein Hauch Relief – sonst wirken Spiegelungen ölig-wellig
  envMapIntensity: 0.22,
});

// Analytische Details des Bodens (Plattenkoordinaten in Welteinheiten), kantengeglättet über fwidth.
const FLOOR_DETAIL_GLSL = `
  float floorGroove = 0.0, floorInlay = 0.0, floorBevel = 0.0;
  {
    vec2 pp = (vUv - 0.5) * ${PLATE.toFixed(4)};
    float halfBoard = ${(BOARD / 2).toFixed(4)};

    // Gravierte Rasterlinien; Kontrast sinkt, wenn die Linie schmaler als ein Pixel wird
    vec2 q = (pp + halfBoard) / ${CELL.toFixed(4)};
    vec2 fw = max(fwidth(q), vec2(1e-5));
    vec2 gq = abs(fract(q + 0.5) - 0.5);
    float lw = ${(0.0055 / CELL).toFixed(5)};
    vec2 line = (1.0 - smoothstep(vec2(lw) - fw * 0.5, vec2(lw) + fw * 0.5, gq)) * clamp(lw * 2.0 / fw, 0.25, 1.0);
    vec2 apw = fwidth(pp);
    vec2 inside = 1.0 - smoothstep(vec2(halfBoard), vec2(halfBoard) + apw, abs(pp));
    floorGroove = max(line.x, line.y) * inside.x * inside.y;

    // Helle, matte Einlegelinie knapp ausserhalb des Spielfelds. Bewusst nicht metallisch:
    // eine dünne Glanzlinie auf leicht unebenem Grund glitzert pixelweise (wirkt gestrichelt).
    float box = max(abs(pp.x), abs(pp.y));
    float bw = max(fwidth(box), 1e-5);
    float r1 = abs(box - (halfBoard + 0.16));
    float iw = 0.011;
    floorInlay = (1.0 - smoothstep(iw - bw, iw + bw, r1)) * clamp(iw * 2.0 / bw, 0.2, 1.0);

    // Polierte Fase an der Plattenkante: fängt das Licht und zeichnet die Silhouette
    float edgeDist = ${(PLATE / 2).toFixed(4)} - box;
    floorBevel = (1.0 - smoothstep(0.0, 0.06, edgeDist)) * 0.7;
  }
`;

// Lichtwelle beim Lösen (siehe celebration): x = Radius, y = Stärke, z = Breite (Welt)
const shockUniforms = {
  uShock: { value: new THREE.Vector3(0, 0, 0.4) },
  uShockColor: { value: new THREE.Color(1, 1, 1) },
};

// Verschiebung der Mipmap-Stufe (Bias): Die automatische Stufe berücksichtigt die Texturgrösse schon; damit die
// Unschärfe in CSS-Pixeln gleich bleibt, muss der Bias nur die Pixeldichte ausgleichen.
const reflLodShift = { value: 0 };
floorMaterial.onBeforeCompile = (shader) => {
  Object.assign(shader.uniforms, shockUniforms);
  shader.uniforms.tReflect = { value: reflector.getRenderTarget().texture };
  shader.uniforms.uReflMatrix = reflector.material.uniforms.textureMatrix;
  shader.uniforms.uReflStrength = { value: QUALITY.reflections ? 1.0 : 0.0 };
  shader.uniforms.uReflLodShift = reflLodShift;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nuniform mat4 uReflMatrix;\nvarying vec4 vReflUv;')
    .replace('#include <project_vertex>', '#include <project_vertex>\nvReflUv = uReflMatrix * vec4(position, 1.0);');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform sampler2D tReflect;\nuniform float uReflStrength;\nuniform float uReflLodShift;\nvarying vec4 vReflUv;\nuniform vec3 uShock;\nuniform vec3 uShockColor;')
    .replace('#include <map_fragment>', `#include <map_fragment>
      ${FLOOR_DETAIL_GLSL}
      diffuseColor.rgb *= 1.0 - floorGroove * 0.6;
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.16, 0.16, 0.18), floorInlay);
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 2.2 + 0.012, floorBevel);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, 0.8, floorGroove);
      roughnessFactor = mix(roughnessFactor, 0.55, floorInlay);
      roughnessFactor = mix(roughnessFactor, 0.12, floorBevel);`)
    .replace('#include <tonemapping_fragment>', `
      {
        vec2 ruv = vReflUv.xy / vReflUv.w;
        // Unschärfe über Mipmaps nur mässig: tiefe Stufen mitteln in Blöcken (bis 32×32 Texel) und machten aus
        // gespiegelten Strahlen eine Kette weicher Flecken, die beim Bewegen der Kamera wanderten ("Wellen").
        // Die Strahlen werden für die Spiegelung ohnehin breit und weich gezeichnet (renderReflection).
        // uReflLodShift: höhere Pixeldichte (Handy) → entsprechend tiefere Stufe, gleiche Unschärfe wie am Desktop
        vec3 refl = texture2D(tReflect, ruv, min(1.0 + roughnessFactor * 2.0, 2.2) + uReflLodShift).rgb;
        float ndv = clamp(dot(normalize(vViewPosition), normal), 0.0, 1.0);
        float fresnel = 0.22 + 0.78 * pow(1.0 - ndv, 4.0);
        float gloss = 1.0 - smoothstep(0.15, 0.7, roughnessFactor);
        gl_FragColor.rgb += refl * fresnel * gloss * uReflStrength * 0.42;
      }
      if (uShock.y > 0.0) {
        // Ring um die Feldmitte, dahinter ein schwacher Nachschein
        float sd = length((vUv - 0.5) * ${PLATE.toFixed(4)});
        float ring = exp(-pow((sd - uShock.x) / uShock.z, 2.0));
        float trail = (1.0 - smoothstep(0.0, max(uShock.x, 1e-3), sd)) * 0.04;
        gl_FragColor.rgb += uShockColor * (ring + trail) * uShock.y;
      }
      #include <tonemapping_fragment>`);
  floorMaterial.userData.shader = shader;
};

const floorTop = new THREE.Mesh(new THREE.PlaneGeometry(PLATE, PLATE), floorMaterial);
floorTop.rotation.x = -Math.PI / 2;
floorTop.receiveShadow = true;
scene.add(floorTop);

// Seitenkanten der Platte: poliert, damit sie Softbox-Licht fangen und sich vom Hintergrund lösen
const plateSideMaterial = new THREE.MeshStandardMaterial({
  color: 0x14141b,
  roughness: 0.22,
  metalness: 0.0,
  envMapIntensity: 1.4,
});
const plateSides = new THREE.Mesh(new THREE.BoxGeometry(PLATE, PLATE_THICK, PLATE), plateSideMaterial);
plateSides.position.y = -PLATE_THICK / 2 - 0.03; // Deckfläche deutlich unter dem Boden
plateSides.receiveShadow = true;
scene.add(plateSides);

// Schmale Metallkante rund um die Platte (ausserhalb ihrer Fläche, minimal erhaben)
// – klare Silhouette aus jedem Blickwinkel, ohne mit dem Boden zu überlappen.
const plateTrim = new THREE.Group();
{
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x8d8e98, metalness: 1.0, roughness: 0.28, envMapIntensity: 1.3 });
  const T = 0.024, H = 0.056, y = 0.003 - H / 2;
  for (const sgn of [-1, 1]) {
    const bx = new THREE.Mesh(new THREE.BoxGeometry(PLATE + 2 * T, H, T), trimMat);
    bx.position.set(0, y, sgn * (PLATE / 2 + T / 2));
    const bz = new THREE.Mesh(new THREE.BoxGeometry(T, H, PLATE), trimMat);
    bz.position.set(sgn * (PLATE / 2 + T / 2), y, 0);
    bx.receiveShadow = bz.receiveShadow = true;
    plateTrim.add(bx, bz);
  }
}
scene.add(plateTrim);

// Schmaler, zurückversetzter Sockel unter der Platte – lässt die Platte schweben.
const plinth = new THREE.Mesh(
  new THREE.BoxGeometry(PLATE - 0.8, 1.6, PLATE - 0.8),
  new THREE.MeshStandardMaterial({ color: 0x050508, roughness: 0.8, metalness: 0.0, envMapIntensity: 0.3 })
);
plinth.position.y = -PLATE_THICK - 0.8;
scene.add(plinth);

/* =====================================================================
   BELEUCHTUNG — Museumsspot als Hauptlicht
   ===================================================================== */

const hemi = new THREE.HemisphereLight(0x2a2d50, 0x050308, 0.08);
scene.add(hemi);

const keyLight = new THREE.SpotLight(0xfff1e2, 1.5, 0, 0.44, 1.0, 1);
keyLight.position.set(2.5, 15, 6);
keyLight.target.position.set(0, 0, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(QUALITY.shadowSize, QUALITY.shadowSize);
keyLight.shadow.camera.near = 8;
keyLight.shadow.camera.far = 26;
keyLight.shadow.bias = -0.0002;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight, keyLight.target);

// Kein zusätzliches Gegenlicht: es glänzte bei flachem Blick als blauer Fleck auf dem polierten Stein.
// Lichtkanten an den Objekten liefern die Softboxen der Environment-Map.

/* =====================================================================
   POST-PROCESSING
   ===================================================================== */

const FinalShader = {
  uniforms: {
    tDiffuse: { value: null },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uExposure: { value: LOOK.exposure },
    uVignette: { value: LOOK.vignette },
    uAberration: { value: LOOK.aberration },
    uGrain: { value: LOOK.grain },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uResolution;
    uniform float uTime, uExposure, uVignette, uAberration, uGrain;
    varying vec2 vUv;

    // ACES Filmic (identisch zu three.js ACESFilmicToneMapping)
    vec3 RRTAndODTFit(vec3 v) {
      vec3 a = v * (v + 0.0245786) - 0.000090537;
      vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
      return a / b;
    }
    vec3 acesFilmic(vec3 color) {
      const mat3 inM = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
      const mat3 outM = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
      color *= uExposure / 0.6;
      color = inM * color;
      color = RRTAndODTFit(color);
      color = outM * color;
      return clamp(color, 0.0, 1.0);
    }
    vec3 linearToSRGB(vec3 c) {
      return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
    }
    float hash(vec2 p) {
      p = fract(p * vec2(443.897, 441.423));
      p += dot(p, p.yx + 19.19);
      return fract((p.x + p.y) * p.x);
    }

    void main() {
      vec2 c = vUv - 0.5;
      float aspect = uResolution.x / uResolution.y;
      vec2 ca = c * vec2(aspect, 1.0);
      float r2 = dot(ca, ca);

      // Chromatische Aberration: sehr dezent und erst im äusseren Bildbereich – nicht am Himmel (Alpha 0), sonst
      // bekämen die Sterne einen Rot-Blau-Saum. Additives Licht kann Alpha über 1 heben: begrenzen.
      vec4 base = texture2D(tDiffuse, vUv);
      vec2 off = c * smoothstep(0.45, 0.95, r2) * uAberration * clamp(base.a, 0.0, 1.0);
      vec3 col;
      col.r = texture2D(tDiffuse, vUv - off).r;
      col.g = base.g;
      col.b = texture2D(tDiffuse, vUv + off).b;

      // Vignette
      float vig = smoothstep(1.05, 0.25, length(ca));
      col *= mix(1.0 - uVignette, 1.0, vig);

      col = acesFilmic(col);
      col = linearToSRGB(col);

      // Filmkorn (in den Mitteltönen am stärksten) + gleichzeitig Dithering gegen Banding
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      float n = hash(vUv * uResolution + fract(uTime * 7.31) * vec2(97.3, 61.7)) - 0.5;
      col += n * uGrain * (0.45 + 0.55 * (1.0 - abs(lum - 0.4) * 1.6));

      gl_FragColor = vec4(col, 1.0);
    }`,
};

function createComposer() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const rt = new THREE.WebGLRenderTarget(size.x, size.y, {
    type: HDR_TYPE,
    samples: renderer.capabilities.isWebGL2 ? QUALITY.msaa : 0,
    // Mit Stencil legt three.js einen kombinierten Tiefen-/Stencil-Puffer an (WebGL2: DEPTH24_STENCIL8,
    // WebGL1 faktisch 24 Bit) – ohne nur DEPTH_COMPONENT16, was bei flachem Blickwinkel zu
    // Streifen (Z-Fighting) auf der Platte führt.
    stencilBuffer: true,
  });
  const comp = new THREE.EffectComposer(renderer, rt);
  comp.addPass(new THREE.RenderPass(scene, camera));

  const bloom = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    LOOK.bloomStrength, LOOK.bloomRadius, LOOK.bloomThreshold
  );
  // Bloom-Puffer auf HDR umstellen, sonst werden helle Strahlen auf 1.0 abgeschnitten.
  [bloom.renderTargetBright, ...bloom.renderTargetsHorizontal, ...bloom.renderTargetsVertical]
    .forEach(t => { t.texture.type = HDR_TYPE; });
  // Nur der Überschuss über der Schwelle blüht (weiches Knie), begrenzt gegen eckige Halos.
  bloom.materialHighPassFilter.fragmentShader = bloom.materialHighPassFilter.fragmentShader.replace(
    'gl_FragColor = mix( outputColor, texel, alpha );',
    'vec3 excess = texel.rgb * (max(v - luminosityThreshold, 0.0) / max(v, 1e-4));\n' +
    'gl_FragColor = vec4(min(excess, vec3(2.5)) * alpha, 1.0);'
  );
  bloom.highPassUniforms.smoothWidth.value = 0.6;
  // Leuchten additiv aufs Bild legen wie bisher, aber Alpha unverändert lassen (Alpha 0 = Himmel, siehe FinalShader)
  Object.assign(bloom.materialCopy, {
    blending: THREE.CustomBlending, blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  });
  // Original-Gauss endet bei 1 Sigma -> sichtbare eckige Halos. Engeres Sigma = runde Halos.
  bloom.separableBlurMaterials.forEach(m => {
    m.defines.SIGMA = (m.defines.KERNEL_RADIUS / 2.4).toFixed(3);
    m.needsUpdate = true;
  });
  // Desktop: Bloom zusätzlich in halber Auflösung (UnrealBloom halbiert intern schon einmal) – optisch kaum
  // ein Unterschied, spart rund 70 % seiner Kosten. Nicht auf dem Handy: Dort sind helle Linien (Strahlen,
  // Glanzkante der Platte) im Verhältnis zu den Pixeln dünn, und im Viertel der Auflösung wurden sie nur
  // stellenweise erfasst – das Leuchten zerfiel in Perlen und Wellen. Mit Pixeldichte 2 entspricht die
  // halbe Auflösung dort genau einem Bloom-Pixel pro CSS-Pixel.
  const bloomSetSize = bloom.setSize.bind(bloom);
  const bloomDiv = IS_MOBILE ? 1 : 2;
  bloom.setSize = (w, h) => bloomSetSize(Math.max(1, Math.round(w / bloomDiv)), Math.max(1, Math.round(h / bloomDiv)));
  bloom.setSize(size.x, size.y);
  comp.addPass(bloom);

  const finalPass = new THREE.ShaderPass(FinalShader);
  // Rendert direkt auf den Bildschirm: ohne Swap wird der zweite Composer-Puffer nie gebunden
  // und belegt daher keinen Grafikspeicher.
  finalPass.needsSwap = false;
  comp.addPass(finalPass);
  return { comp, bloom, finalPass };
}

const { comp: composer, bloom: bloomPass, finalPass } = createComposer();
// Mit eigenem RenderTarget setzt der Composer sein Pixelverhältnis auf 1 – für HiDPI korrigieren.
composer.setPixelRatio(renderer.getPixelRatio());

/* =====================================================================
   KAMERA — schräg von oben, schwebt sanft, frei ums Feld drehbar (Neigung begrenzt)
   ===================================================================== */

const cameraRig = {
  lead: 0.35,             // Blickpunkt so weit vor der Feldmitte (zur Kamera hin)
  target: new THREE.Vector3(),
  baseTheta: 0,           // Azimut
  basePhi: 0.86,          // Winkel von der Senkrechten
  userTheta: 0, userPhi: 0,
  goalTheta: 0, goalPhi: 0, // goalTheta bleibt in −π … π (dragCamera)
  limitsPhiUp: 0.22, limitsPhiDown: 0.16,
  radius: 18,             // Abstand der Ausgangsansicht; gedreht bleibt er gleich (ein Zoom pumpte, siehe PLAN 2.18)
  homing: null,           // Rückflug zur Ausgangsansicht beim Levelwechsel (cameraGoHome)
  cube: 0,                // Kantenlänge des Würfels im Würfel-Level, sonst 0 (loadLevel)
  lift: 0,                // Höhe des Blickpunkts (Würfel: seine Mitte)
  zoom: 1,                // Abstandsfaktor (Würfel: CUBE.cameraZoom)
  tilt: 0,                // zusätzliche Neigung (Würfel: CUBE.cameraTilt, flacher – die Höhe wird lesbar)
  turn: 0,                // zusätzlicher Azimut (Würfel: CUBE.cameraTurn, schräg auf eine Kante)
  wide: 1,                // 0 = Hochformat … 1 = Querformat (fitCameraDistance)
};

function fitCameraDistance() {
  // Spielfeld soll in Breite und Höhe sicher ins Bild passen
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const tanV = Math.tan(vfov / 2);
  const tanH = tanV * camera.aspect;
  // Hochformat: steiler von oben – das Feld nutzt die Höhe besser, und die Vorderkante wird
  // perspektivisch weniger breit, sodass weniger Rand nötig ist (grössere Zellen zum Tippen).
  const wide = THREE.MathUtils.clamp((camera.aspect - 0.5) / 0.8, 0, 1);
  cameraRig.wide = wide;
  const halfW = PLATE * THREE.MathUtils.lerp(0.52, 0.56, wide);
  const halfH = PLATE * 0.42;
  cameraRig.radius = Math.max(halfW / tanH, halfH / tanV, 14);
  cameraRig.basePhi = THREE.MathUtils.lerp(0.46, 0.86, wide);
  updateSky(wide);
}

/**
 * Das Hauptlicht kreist mit der Kamera (ohne ihr Schweben): So sieht das Feld von jeder Seite aus wie entworfen.
 * Ein festes Licht stünde von hinten gesehen gegenüber und spiegelte sich grell im polierten Stein.
 */
const keyLightHome = keyLight.position.clone();
const Y_AXIS = new THREE.Vector3(0, 1, 0);
let keyLightTheta = 0;
function orbitKeyLight(theta) {
  if (Math.abs(theta - keyLightTheta) < 1e-4) return; // Schatten nur neu berechnen, wenn das Licht wandert
  keyLightTheta = theta;
  keyLight.position.copy(keyLightHome).applyAxisAngle(Y_AXIS, theta);
  markShadowsDirty();
}

/** Beim Levelwechsel: in einem Bogen auf kürzestem Weg zurück zur Ausgangsansicht. */
function cameraGoHome() {
  const theta = cameraRig.goalTheta, phi = cameraRig.goalPhi;
  if (Math.abs(theta) + Math.abs(phi) < 1e-3) return;
  cameraRig.homing = { theta, phi, t: 0, duration: 0.8 + 0.25 * Math.abs(theta) };
}

function updateCamera(t, dt) {
  const h = cameraRig.homing;
  if (h) {
    h.t = Math.min(1, h.t + dt / h.duration);
    const e = h.t < 0.5 ? 4 * h.t ** 3 : 1 - (2 - 2 * h.t) ** 3 / 2; // ease-in-out
    cameraRig.goalTheta = h.theta * (1 - e);
    cameraRig.goalPhi = h.phi * (1 - e);
    if (h.t >= 1) cameraRig.homing = null;
  }
  const k = 1 - Math.pow(0.00002, dt); // Zeitkonstante ≈ 0.09 s: weich, aber nicht träge
  cameraRig.userTheta += (cameraRig.goalTheta - cameraRig.userTheta) * k;
  cameraRig.userPhi += (cameraRig.goalPhi - cameraRig.userPhi) * k;

  // Würfel-Level: Blick auf die Würfelmitte, etwas weiter weg (weich übergeblendet, auch beim Levelwechsel)
  const cube = cameraRig.cube;
  cameraRig.lift += ((cube ? cube * CELL / 2 : 0) - cameraRig.lift) * k;
  // Hochformat: Das 2D-Feld füllt die Breite, der schmalere Würfel darf näher heran
  const zoom = cube ? THREE.MathUtils.lerp(CUBE.cameraZoomNarrow, CUBE.cameraZoom, cameraRig.wide) : 1;
  cameraRig.zoom += (zoom - cameraRig.zoom) * k;
  cameraRig.tilt += ((cube ? CUBE.cameraTilt : 0) - cameraRig.tilt) * k;
  cameraRig.turn += ((cube ? CUBE.cameraTurn : 0) - cameraRig.turn) * k;

  const theta = cameraRig.baseTheta + cameraRig.turn + cameraRig.userTheta + Math.sin(t * 0.13) * 0.035;
  const phi = cameraRig.basePhi + cameraRig.tilt + cameraRig.userPhi + Math.sin(t * 0.21 + 1.3) * 0.018;
  const r = cameraRig.radius * cameraRig.zoom * (1 + Math.sin(t * 0.17 + 0.4) * 0.006);

  cameraRig.target.set(cameraRig.lead * Math.sin(theta), cameraRig.lift, cameraRig.lead * Math.cos(theta));
  camera.position.set(
    cameraRig.target.x + r * Math.sin(phi) * Math.sin(theta),
    cameraRig.target.y + r * Math.cos(phi),
    cameraRig.target.z + r * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(cameraRig.target);
  orbitKeyLight(cameraRig.baseTheta + cameraRig.userTheta);
}

// Ziehen dreht die Kamera; ausgewertet im Eingabemodul (INTERAKTION).
const drag = { active: false };
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

/* =====================================================================
   SPIELELEMENTE — 3D-Modelle für Quelle, Spiegel und Ziel
   ===================================================================== */

const BEAM_Y = 0.42; // Höhe, auf der die Strahlen über der Platte laufen
const HALF_GRID = (GRID - 1) / 2;

/** Rasterkoordinate → Weltposition (Zellmitte auf der Platte). */
function gridToWorld(x, z, y = 0, target = new THREE.Vector3()) {
  return target.set((x - HALF_GRID) * CELL, y, (z - HALF_GRID) * CELL);
}

/**
 * Würfel-Level: Rasterpunkt (auch Zwischenpunkte von Strahlen) → Welt. Die Zellen liegen mittig im Würfel, der auf
 * der Platte steht: die unterste Zellmitte eine halbe Zelle über der Platte (CUBE_FLOOR), jede weitere eine Zelle
 * höher – so passen auch senkrechte Ringe der untersten Ebene (Radius mit Marken 0.58) über die Platte.
 * Waagrecht mittig wie das 2D-Feld.
 */
const CUBE_FLOOR = CELL / 2;
function cubeToWorld(x, y, z, size, target = new THREE.Vector3()) {
  const half = (size - 1) / 2;
  return target.set((x - half) * CELL, CUBE_FLOOR + y * CELL, (z - half) * CELL);
}

/** Strahlpunkt eines Abschnitts oder Ereignisses in Weltkoordinaten (2D: auf Strahlhöhe). */
function beamPointToWorld(x, y, z, target) {
  return y === undefined ? gridToWorld(x, z, BEAM_Y, target) : cubeToWorld(x, y, z, game.board.size, target);
}

/** Normale aus der Logik als Weltvektor (2D: [nx, nz], Würfel: [nx, ny, nz]). */
const normalToWorld = (n, target = new THREE.Vector3()) => (n.length === 3 ? target.fromArray(n) : target.set(n[0], 0, n[1]));

/**
 * Würfel-Level: Lage eines Elementmodells. Die Modelle sind für die 2D-Platte gebaut (Sockel unten, Optik auf
 * Strahlhöhe, Drehung um ihr lokales y). Die Basis (u, a, v) der Drehachse (AXES) dreht lokales x, y, z in die
 * Drehebene; der Ursprung liegt so, dass die Optik in der Zellmitte sitzt.
 */
const _axisBasis = new THREE.Matrix4();
function placeInCube(obj, el, size) {
  const { u, a, v } = AXES[el.axis];
  _axisBasis.makeBasis(new THREE.Vector3(...u), new THREE.Vector3(...a), new THREE.Vector3(...v));
  obj.quaternion.setFromRotationMatrix(_axisBasis);
  cubeToWorld(el.x, el.y, el.z, size, obj.position).addScaledVector(new THREE.Vector3(...a), -BEAM_Y);
}

/**
 * 0 … 1: wie stark eine Farbe gedämpft werden soll, weil sie hell ist. Helle Farben (Weiss, Gelb,
 * Cyan, Grün) überschreiten die Bloom-Schwelle viel stärker als Rot, Blau oder Magenta.
 */
function brightTame(c) {
  const lum = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  return THREE.MathUtils.smoothstep(lum, 0.35, 0.95);
}

const COLOR_RGB = {
  1: new THREE.Color(1.0, 0.16, 0.12),  // Rot
  2: new THREE.Color(0.2, 1.0, 0.32),   // Grün
  3: new THREE.Color(1.0, 0.78, 0.18),  // Gelb
  4: new THREE.Color(0.18, 0.36, 1.0),  // Blau
  5: new THREE.Color(1.0, 0.22, 0.85),  // Magenta
  6: new THREE.Color(0.2, 0.92, 1.0),   // Cyan
  7: new THREE.Color(1.0, 0.97, 0.92),  // Weiss (minimal warm)
};

const brushedTex = createBrushedTexture(256);
brushedTex.repeat.set(2, 2);

const MAT = {
  metalDark: new THREE.MeshStandardMaterial({
    color: 0x2c2c33, metalness: 1, roughness: 0.42, roughnessMap: brushedTex, envMapIntensity: 1.1,
  }),
  metalBright: new THREE.MeshStandardMaterial({
    color: 0xb9bac4, metalness: 1, roughness: 0.3, roughnessMap: brushedTex, envMapIntensity: 1.25,
  }),
  mirror: new THREE.MeshStandardMaterial({
    color: 0xf2f4ff, metalness: 1, roughness: 0.03, envMap: mirrorEnvironment, envMapIntensity: 1.7,
  }),
  stone: new THREE.MeshStandardMaterial({
    color: 0x111117, metalness: 0, roughness: 0.38, envMapIntensity: 0.7,
  }),
  lens: new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.97, 0.92).multiplyScalar(5.5) }),
};

function shadowed(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/**
 * Würfel-Level (Prototyp): Die Elemente schweben, Sockel passen dort nicht. Statt des Drehtellers liegt ein Ring in
 * der Drehebene um das Element (mit 45°-Marken), zwei Achszapfen zeigen die Drehachse auch dann, wenn man den Ring
 * von der Kante sieht. Feste Elemente haben statt des eckigen Sockels einen eckigen Rahmen mit rotem Rand.
 * Alles in lokalen Koordinaten des 2D-Modells (lokal y = Drehachse, Optik auf BEAM_Y).
 */
const CUBE_MOUNT = { ring: 0.52, tube: 0.011, tick: 0.06, pin: [0.27, 0.44], frame: 0.98, bar: 0.03 };
const inCube = () => game.board?.dim === 3;

function makeCubeRing() {
  const g = new THREE.Group();
  const R = CUBE_MOUNT.ring;
  const ring = shadowed(new THREE.Mesh(new THREE.TorusGeometry(R, CUBE_MOUNT.tube, 8, 96), MAT.metalBright));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = BEAM_Y;
  g.add(ring);
  for (let i = 0; i < 8; i++) { // 45°-Marken, nach aussen
    const a = i * Math.PI / 4;
    const tick = new THREE.Mesh(new THREE.BoxGeometry(CUBE_MOUNT.tick, 0.014, 0.014), MAT.metalBright);
    tick.position.set(Math.cos(a) * (R + CUBE_MOUNT.tick / 2), BEAM_Y, Math.sin(a) * (R + CUBE_MOUNT.tick / 2));
    tick.rotation.y = -a;
    g.add(tick);
  }
  const [p0, p1] = CUBE_MOUNT.pin;
  for (const s of [-1, 1]) { // Achszapfen über und unter dem Element
    const pin = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, p1 - p0, 12), MAT.metalBright));
    pin.position.y = BEAM_Y + s * (p0 + p1) / 2;
    const knob = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 10), MAT.metalBright));
    knob.position.y = BEAM_Y + s * p1;
    g.add(pin, knob);
  }
  return g;
}

function makeCubeFrame() {
  const g = new THREE.Group();
  const s = CUBE_MOUNT.frame, t = CUBE_MOUNT.bar, e = s / 2 - t / 2, w = FIXED_EDGE.width;
  const { edgeMat } = fixedBase();
  for (const [bw, bd, x, z, along] of [[s, t, 0, -e, 'x'], [s, t, 0, e, 'x'], [t, s - 2 * t, -e, 0, 'z'], [t, s - 2 * t, e, 0, 'z']]) {
    const bar = shadowed(new THREE.Mesh(new THREE.BoxGeometry(bw, t, bd), MAT.metalDark));
    bar.position.set(x, BEAM_Y, z);
    // roter Rand: schmaler Streifen mitten im Profil, schaut oben und unten knapp heraus
    const edge = new THREE.Mesh(along === 'x' ? new THREE.BoxGeometry(bw, t + 0.006, w) : new THREE.BoxGeometry(w, t + 0.006, bd), edgeMat);
    edge.position.copy(bar.position);
    edge.raycast = () => {};
    edge.layers.set(LAYER_NO_REFLECT);
    g.add(bar, edge);
  }
  return g;
}

/** Runder Metallsockel (Drehteller), auf dem jedes drehbare Element steht. */
function makePedestal(radius = 0.34) {
  if (inCube()) return makeCubeRing();
  const g = new THREE.Group();
  const disk = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(radius, radius + 0.02, 0.06, 48), MAT.metalDark));
  disk.position.y = 0.03;
  const rim = shadowed(new THREE.Mesh(new THREE.TorusGeometry(radius - 0.03, 0.008, 8, 64), MAT.metalBright));
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.062;
  g.add(disk, rim);
  return g;
}

/**
 * Fester Sockel für alles, was sich nicht drehen lässt (Quelle, Ziel, Filter, fester Spiegel; auch ein festes Prisma
 * oder ein fester Kombinator): eckiger, dunkler Steinblock mit schmalem rot leuchtendem Rand – kein Drehteller.
 * Formensprache: rund mit weissem Leuchtring = drehbar, eckig mit rotem Rand = fest (auf dem Handy waren die feinen
 * Drehmarken unsichtbar).
 */
const FIXED_BASE_SIZE = 0.66;
const FIXED_BASE_TOP = 0.07;  // Oberkante des Steinblocks (Teller: 0.06) – Ringe und Lichthöfe liegen knapp darüber
// Randleiste: feine Linie (halb so breit wie der Leuchtring der drehbaren Elemente), flach knapp über dem Block;
// Oberkante 0.079 – knapp über dem Lichthof des Ziels (FIXED_BASE_TOP + 0.008), sonst flimmert sein Rand.
// Gedämpftes Rot weit unter der Bloom-Schwelle: ruhig und unaufdringlich. Wenig Grün- und Blauanteil – das ACES im
// finalPass zieht helles Rot sonst ins Orange.
const FIXED_EDGE = { width: 0.017, height: 0.010, inset: 0.012, color: new THREE.Color(0.42, 0.06, 0.07) };
let fixedBaseParts = null; // Geometrien und Material, geteilt von allen festen Sockeln (beim ersten Gebrauch gebaut)
function fixedBase() {
  if (fixedBaseParts) return fixedBaseParts;
  const size = FIXED_BASE_SIZE, { width: t, height: h, inset } = FIXED_EDGE;
  const blockGeo = new THREE.BoxGeometry(size, FIXED_BASE_TOP, size).translate(0, FIXED_BASE_TOP / 2, 0);
  const frameGeo = new THREE.BoxGeometry(size + 0.02, 0.02, size + 0.02).translate(0, 0.01, 0);
  // eckiger Rand oben, knapp innerhalb der Blockkante: macht die Form "eckig = fest" auch auf dem dunklen Boden lesbar
  const outer = size - 2 * inset, e = outer / 2 - t / 2, y = FIXED_BASE_TOP - 0.001 + h / 2;
  const edgeGeo = mergeGeometries([[outer, t, 0, -e], [outer, t, 0, e], [t, outer - 2 * t, -e, 0], [t, outer - 2 * t, e, 0]]
    .map(([w, d, x, z]) => new THREE.BoxGeometry(w, h, d).translate(x, y, z)));
  const edgeMat = new THREE.MeshBasicMaterial({ color: FIXED_EDGE.color, fog: false });
  for (const geo of [blockGeo, frameGeo, edgeGeo]) SHARED_GEOMETRIES.add(geo);
  SHARED_MATERIALS.add(edgeMat);
  fixedBaseParts = { blockGeo, frameGeo, edgeGeo, edgeMat };
  return fixedBaseParts;
}
/** Drei Draw-Calls: Block, Rahmen, Randleiste (alle Geometrien geteilt). */
function makeFixedBase() {
  if (inCube()) return makeCubeFrame();
  const { blockGeo, frameGeo, edgeGeo, edgeMat } = fixedBase();
  const g = new THREE.Group();
  g.add(shadowed(new THREE.Mesh(blockGeo, MAT.stone)), shadowed(new THREE.Mesh(frameGeo, MAT.metalDark)));
  // Leuchtrand nicht in der Bodenspiegelung (wie der Leuchtring der drehbaren Elemente)
  const edge = new THREE.Mesh(edgeGeo, edgeMat);
  edge.raycast = () => {};
  edge.layers.set(LAYER_NO_REFLECT);
  g.add(edge);
  return g;
}

/** Lichtquelle: schlanker Scheinwerfer auf einer Säule, Linse strahlt in +x. */
function makeSource(el) {
  const root = new THREE.Group();
  root.add(makeFixedBase());

  const head = new THREE.Group();
  head.rotation.y = dirToRotationY(el.dir);
  root.add(head);

  const column = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.065, BEAM_Y - 0.05, 24), MAT.metalBright));
  column.position.y = 0.06 + (BEAM_Y - 0.05) / 2 - 0.02;
  if (!inCube()) head.add(column);

  const housing = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.15, 0.5, 40), MAT.metalDark));
  housing.rotation.z = Math.PI / 2;
  housing.position.set(-0.04, BEAM_Y, 0);
  head.add(housing);

  // Kühlrippen
  for (let i = 0; i < 4; i++) {
    const fin = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.012, 8, 40), MAT.metalBright));
    fin.rotation.y = Math.PI / 2;
    fin.position.set(-0.24 + i * 0.07, BEAM_Y, 0);
    head.add(fin);
  }

  const bezel = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.022, 12, 48), MAT.metalBright));
  bezel.rotation.y = Math.PI / 2;
  bezel.position.set(0.21, BEAM_Y, 0);
  head.add(bezel);

  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.11, 40), MAT.lens.clone());
  lens.rotation.y = Math.PI / 2;
  lens.position.set(0.212, BEAM_Y, 0);
  head.add(lens);

  root.userData.lens = lens;
  return root;
}

/** Spiegel: gebürsteter Rahmen, hochglänzende Fläche, auf Drehteller mit 45°-Markierungen (fest: Steinblock). */
function makeMirror(el) {
  const root = new THREE.Group();
  root.add(el.fixed ? makeFixedBase() : makePedestal(0.4));

  // Gravierte 45°-Marken auf dem Teller (nur drehbare Spiegel – feste stehen auf dem eckigen Sockel)
  for (let i = 0; i < 8 && !el.fixed && !inCube(); i++) {
    const tick = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.004, 0.012), MAT.metalBright);
    const a = i * Math.PI / 4;
    tick.position.set(Math.cos(a) * 0.32, 0.063, Math.sin(a) * 0.32);
    tick.rotation.y = -a;
    root.add(tick);
  }

  const pivot = new THREE.Group();
  pivot.rotation.y = dirToRotationY(el.rot);
  root.add(pivot);

  const W = MIRROR_HALF_WIDTH * 2 * CELL, H = 0.6, T = 0.05, P = 0.032; // Breite, Höhe, Rahmentiefe, Profil
  const bottom = BEAM_Y - H / 2;

  const frame = new THREE.Group();
  const bar = (w, h, x, y) => {
    const m = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, T), MAT.metalBright));
    m.position.set(x, y, 0);
    frame.add(m);
  };
  bar(W, P, 0, bottom + P / 2);
  bar(W, P, 0, bottom + H - P / 2);
  bar(P, H, -W / 2 + P / 2, bottom + H / 2);
  bar(P, H, W / 2 - P / 2, bottom + H / 2);
  pivot.add(frame);

  const glass = shadowed(new THREE.Mesh(new THREE.BoxGeometry(W - P * 1.4, H - P * 1.4, 0.012), MAT.mirror));
  glass.position.y = bottom + H / 2;
  pivot.add(glass);

  // Zwei schlanke Stützen zum Teller
  for (const sx of inCube() ? [] : [-0.22, 0.22]) {
    const leg = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.018, bottom - 0.06, 12), MAT.metalBright));
    leg.position.set(sx, 0.06 + (bottom - 0.06) / 2, 0);
    pivot.add(leg);
  }

  root.userData.pivot = pivot;
  root.userData.orient = (e) => { pivot.rotation.y = dirToRotationY(e.rot); };
  return root;
}

/** Brillantschliff als Lathe-Profil (unten Spitze, oben Tafel), facettiert durch flatShading. */
function makeGemGeometry(radius) {
  const pts = [
    new THREE.Vector2(0.0, -0.95),
    new THREE.Vector2(0.62, -0.28),
    new THREE.Vector2(1.0, 0.0),
    new THREE.Vector2(1.0, 0.08),
    new THREE.Vector2(0.62, 0.42),
    new THREE.Vector2(0.0, 0.42),
  ].map(p => p.multiplyScalar(radius));
  const geo = new THREE.LatheGeometry(pts, 8);
  geo.computeVertexNormals();
  return geo;
}

/** Ziel: schwebender Edelstein in seiner Zielfarbe, mit Leuchtkern und glimmendem Ring. */
function makeTarget(el) {
  const root = new THREE.Group();
  root.add(makeFixedBase());
  const col = COLOR_RGB[el.color];
  const mask = el.color; // Farbmaske: Rot 1, Grün 2, Blau 4
  // Etwas sattere Variante der Strahlfarbe für den Stein (die Strahlfarben sind bewusst hell, z. B. Himmelblau)
  const deep = new THREE.Color(col.r * col.r, col.g * col.g, col.b * col.b).lerp(col, 0.85);
  // Dunkle Farben (Blau, Rot) verwässern schnell: Mit viel Weiss und Schillern im Glas liest sich Blau neben
  // Weiss nur als „Weiss mit Blaustich“. Helle Farben vertragen mehr (und werden getroffen gedämpft, siehe litTame).
  const bt = brightTame(col);

  // Ring aus drei Bögen, ein fester Platz je Grundfarbe (Rot links, Grün rechts, Blau vorne; hinten offen, dort
  // verdeckt ihn der Stein). Es leuchten die Grundfarben, aus denen die Zielfarbe besteht: Blau ein Bogen, Cyan
  // zwei, Weiss drei. So ist die Farbe auch ohne Farbunterscheidung lesbar, und man sieht, woraus sie gemischt
  // wird. Kommt Licht an, zeigt jeder Bogen seine Grundfarbe: gebraucht und da = heller, fehlt = ruhig,
  // nicht gebraucht und da = flackert im leeren Platz (falsches Licht).
  const ringSegs = [];
  for (const p of [1, 2, 4]) {
    const on = (mask & p) !== 0;
    const seg = new THREE.Mesh(targetArcGeometry(), new THREE.MeshBasicMaterial({
      color: on ? COLOR_RGB[p].clone().multiplyScalar(TARGET_IDLE.ring) : TARGET_RING.offColor, toneMapped: false,
    }));
    // Bogen in der xy-Ebene drehen, dann flach legen: Winkel 90° zeigt zur Kamera (+z)
    seg.rotation.set(Math.PI / 2, 0, THREE.MathUtils.degToRad(TARGET_RING.slots[p] - TARGET_RING.arc / 2));
    seg.position.y = FIXED_BASE_TOP + 0.006;
    if (inCube()) { seg.position.y = BEAM_Y; seg.scale.setScalar(1.4); } // Würfel: um den Stein statt auf dem Sockel
    // In der Bodenspiegelung verdeckt ihn ohnehin das Spiegelbild des Sockels: dort nicht zeichnen
    seg.layers.set(LAYER_NO_REFLECT);
    root.add(seg);
    // arrive: Grundfarbe kommt sichtbar an (animiert 0..1). partial: Zusatzhelligkeit, wenn sie ankommt –
    // bei hellen Farben (Grün) gedämpft, sonst überstrahlt der Bogen schon vor dem Treffer.
    const partial = TARGET_RING.partial * (1 - 0.6 * brightTame(COLOR_RGB[p]));
    Object.assign(seg.userData, { primary: p, on, color: COLOR_RGB[p], partial, arrive: 0, arriveGoal: 0 });
    ringSegs.push(seg);
  }

  // Farbiger Lichthof auf dem Sockel: zeigt schon vor dem Treffer, welche Farbe das Ziel erwartet.
  const haloMat = new THREE.MeshBasicMaterial({
    map: spotTexture, color: col.clone().multiplyScalar(TARGET_IDLE.halo), transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  });
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), haloMat);
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = inCube() ? BEAM_Y : FIXED_BASE_TOP + 0.008;
  halo.raycast = () => {};
  root.add(halo);

  // Bewusst ohne echte Transmission: die würde jedes Frame die ganze Szene ein zweites Mal rendern
  // (≈ ein Drittel der Frame-Zeit). Transparenz + Clearcoat + Iridescence + Leuchtkern wirken fast gleich.
  const gemMat = new THREE.MeshPhysicalMaterial({
    color: deep.clone().lerp(new THREE.Color(1, 1, 1), THREE.MathUtils.lerp(0.06, 0.3, bt)), // getönt, aber noch Glas
    metalness: 0, roughness: 0.04, ior: 2.0, specularIntensity: 1,
    transparent: true, opacity: 0.84,
    clearcoat: 1, clearcoatRoughness: 0.02,
    iridescence: THREE.MathUtils.lerp(0.15, 0.45, bt), iridescenceIOR: 1.8, // Schillern hellt dunkle Farben auf
    emissive: deep.clone(), emissiveIntensity: TARGET_IDLE.emissive,
    flatShading: true, envMapIntensity: 1.8,
  });
  // Kein Schattenwurf: der Stein dreht und schwebt, die Shadow-Map wird aber nur bei Änderungen
  // neu berechnet – und Transparenz kennt die Shadow-Map nicht (voll dunkler Schatten).
  const gem = new THREE.Mesh(makeGemGeometry(0.26), gemMat);
  gem.position.y = BEAM_Y;
  root.add(gem);

  // Opaker Leuchtkern: scheint durch den transparenten Stein.
  const coreMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(TARGET_IDLE.core) });
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.075, 0), coreMat);
  gem.add(core);

  root.userData.gem = gem;
  root.userData.core = core;
  root.userData.ringSegs = ringSegs;
  root.userData.halo = halo;
  root.userData.color = col;
  // Dunkle Farben (v. a. Blau) gehen sonst in den hellen Glanzlichtern unter: stärker selbst leuchten lassen.
  const lum = 0.2126 * col.r + 0.7152 * col.g + 0.0722 * col.b;
  // Helle Farben überschreiten die Bloom-Schwelle viel stärker: getroffen gedämpfter leuchten,
  // sonst wird der ganze Edelstein (v. a. Weiss) zum facettenlosen Fleck
  root.userData.litTame = 1 - 0.4 * bt;
  root.userData.emissiveTame = 1 - 0.65 * bt;
  root.userData.glowBoost = THREE.MathUtils.clamp(0.35 / Math.max(lum, 0.01), 1, 1.2);
  root.userData.hit = 0;        // animierter Zustand 0..1
  root.userData.hitGoal = 0;
  root.userData.wrong = 0;      // falsches Licht kommt an: animiert 0..1
  root.userData.wrongGoal = 0;
  root.userData.wrongMix = 0;
  root.userData.wrongColor = new THREE.Color();
  root.userData.flash = 0;      // kurzes Aufblitzen im Lösungsmoment (1 → 0)
  root.userData.phase = Math.random() * Math.PI * 2;
  root.userData.update = (t, dt) => updateTarget(root, t, dt);
  return root;
}

/** Leuchtstärken eines noch nicht getroffenen Ziels (getroffen kommt jeweils hit × … dazu). */
// Unter der Bloom-Schwelle bleiben, sonst kippt die Farbe im Tone Mapping ins Weisse.
const TARGET_IDLE = { core: 0.8, emissive: 0.15, ring: 0.7, halo: 0.12 };
/**
 * Farbring der Ziele: Radius (ausserhalb des Steins, Radius 0.26 – er schwebt höher und verdeckt von oben sonst die
 * Bögen; innerhalb des roten Sockelrands bei 0.30), Bogenmitte je Grundfarbe in Grad (0 = +x, 90 = zur Kamera; Rot
 * und Grün leicht nach vorne, damit sie auch im Hochformat neben dem Stein sichtbar bleiben), Bogenlänge, Dicke,
 * Farbe leerer Plätze und Zusatzhelligkeit eines gebrauchten Bogens, dessen Farbe schon ankommt.
 */
const TARGET_RING = {
  radius: 0.27, slots: { 1: 190, 2: 350, 4: 90 }, arc: 90, tube: 0.017,
  offColor: new THREE.Color(0.05, 0.05, 0.06), partial: 1.0,
};
let targetArcGeo = null;
/** Ein Bogen des Farbrings (geteilt von allen Zielen). */
function targetArcGeometry() {
  if (!targetArcGeo) {
    targetArcGeo = new THREE.TorusGeometry(TARGET_RING.radius, TARGET_RING.tube, 8, 32, THREE.MathUtils.degToRad(TARGET_RING.arc));
    SHARED_GEOMETRIES.add(targetArcGeo);
  }
  return targetArcGeo;
}

/** Ziel-Zustand weich nachführen (Glimmen ↔ hell leuchtend). */
function updateTarget(obj, t, dt) {
  const u = obj.userData;
  u.hit += (u.hitGoal - u.hit) * (1 - Math.pow(0.0005, dt));
  u.wrong += (u.wrongGoal - u.wrong) * (1 - Math.pow(0.002, dt));
  const h = u.hit, hl = h * u.litTame;
  u.flash *= Math.pow(0.04, dt);
  const f = u.flash;
  u.gem.scale.setScalar(1 + f * 0.28);
  u.gem.rotation.y = t * (0.25 + h * 0.6) + u.phase;
  u.gem.position.y = BEAM_Y + Math.sin(t * 1.1 + u.phase) * 0.018;
  const flicker = 1 + Math.sin(t * 13.0 + u.phase) * 0.03 * h;
  // Wartend atmet das Ziel langsam in seiner Farbe – es "fragt" nach Licht.
  const breathe = (1 - h) * (0.5 + 0.5 * Math.sin(t * 1.8 + u.phase));
  u.core.material.color.copy(u.color).multiplyScalar((TARGET_IDLE.core + breathe * 0.15 + hl * 6.9 + f * 14 * u.litTame) * flicker);
  u.gem.material.emissiveIntensity = (TARGET_IDLE.emissive + breathe * 0.05) * u.glowBoost + h * 1.3 * u.emissiveTame;
  u.halo.material.color.copy(u.color).multiplyScalar(TARGET_IDLE.halo + breathe * 0.05 + hl * 0.6 + f * 1.4);
  // Farbring: je Grundfarbe ein Bogen. Gebraucht: leuchtet, heller sobald seine Farbe ankommt (danach trägt hit).
  // Nicht gebraucht, kommt aber an: flackert unruhig im leeren Platz – z. B. "hier kommt zu viel Blau an".
  const ringLevel = TARGET_IDLE.ring + breathe * 0.1 + hl * 2.9 + f * 5;
  const unrest = 0.65 + 0.35 * Math.sin(t * 7.0 + u.phase) * Math.sin(t * 2.3);
  for (const seg of u.ringSegs) {
    const s = seg.userData;
    s.arrive += (s.arriveGoal - s.arrive) * (1 - Math.pow(0.002, dt));
    if (s.on) seg.material.color.copy(s.color).multiplyScalar(ringLevel + s.arrive * (1 - h) * s.partial);
    else seg.material.color.copy(TARGET_RING.offColor).lerp(_wrongTint.copy(s.color).multiplyScalar(TARGET_WRONG.ring * unrest), s.arrive);
  }
  // Falsche Farbe: Der Lichtfleck flackert zusätzlich in der Mischung, die ankommt; Stein und gebrauchte Bögen
  // zeigen weiter, welche Farbe gesucht ist.
  if (u.wrong > 0.002) u.halo.material.color.lerp(_wrongTint.copy(u.wrongColor).multiplyScalar(TARGET_WRONG.halo * unrest), u.wrong);
}
/** Ziel mit Licht der falschen Farbe: leerer Platz im Farbring und Lichtfleck (unter der Bloom-Schwelle). */
const TARGET_WRONG = { ring: 0.9, halo: 0.6 };
const _wrongTint = new THREE.Color();

/* ---------- Phase 4: Prisma, Farbfilter, Kombinator, Blocker ---------- */

/** Geschliffenes Glas ohne Transmission (zu teuer, siehe Edelstein); tiefen-neutral, damit Strahlen im Glas sichtbar bleiben. */
function makeGlassMaterial(color, opts = {}) {
  return new THREE.MeshPhysicalMaterial(Object.assign({
    color, metalness: 0, roughness: 0.03, ior: 1.5, specularIntensity: 1,
    transparent: true, opacity: 0.42, depthWrite: false,
    clearcoat: 1, clearcoatRoughness: 0.02,
    iridescence: 0.7, iridescenceIOR: 1.35, iridescenceThicknessRange: [120, 700],
    flatShading: true, envMapIntensity: 2.2,
  }, opts));
}

/** Feine, helle Glaskanten: lassen den Schliff auch vor dunklem Grund erkennen. */
function glassEdges(geometry, opacity = 0.28) {
  const lines = new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry, 20),
    new THREE.LineBasicMaterial({ color: 0xdfe6ff, transparent: true, opacity, depthWrite: false })
  );
  lines.renderOrder = 6; // nach dem Glas (renderOrder 5), sonst deckt es die Kanten ab
  lines.raycast = () => {};
  return lines;
}

/** Weicher Regenbogenverlauf (für das Spektralfenster des Prismas). */
function createSpectrumTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 32;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 256, 0);
  ['#ff2a1e', '#ffb21e', '#f4ff3a', '#30ff6a', '#2ad8ff', '#3a5bff', '#a43aff'].forEach((col, i, a) => g.addColorStop(i / (a.length - 1), col));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 32);
  // vertikal weich ausblenden
  const v = ctx.createLinearGradient(0, 0, 0, 32);
  v.addColorStop(0, 'rgba(0,0,0,1)'); v.addColorStop(0.5, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, 256, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
const spectrumTexture = createSpectrumTexture();

/** Leuchtzustand eines Elements weich nachführen: aktiv, sobald die Strahlfront es erreicht. */
function activeColorOf(u) {
  let color = 0;
  for (const r of u.events || []) if (beamView.revealed(r, r.worldDist)) color |= r.ev.color;
  return color;
}
function easeToward(current, goal, dt, speed = 0.0005) {
  return current + (goal - current) * (1 - Math.pow(speed, dt));
}

/** Prisma: dreiseitiges Glasprisma zwischen zwei Metallplatten, Austrittsfläche (lokal −z) in Richtung rot·45°. */
function makePrism(el) {
  const root = new THREE.Group();
  root.add(el.fixed ? makeFixedBase() : makePedestal(0.38));
  const pivot = new THREE.Group();
  root.add(pivot);

  const H = 0.5;
  const R = 0.33;
  const geo = new THREE.CylinderGeometry(R, R, H, 3, 1); // Ecke lokal bei +z, gegenüber die Fläche bei −z
  const glass = new THREE.Mesh(geo, makeGlassMaterial(new THREE.Color(0.86, 0.9, 1.0), { iridescence: 1.0 }));
  glass.position.y = BEAM_Y;
  glass.renderOrder = 5;
  pivot.add(glass);
  const edges = glassEdges(geo, 0.32);
  edges.position.y = BEAM_Y;
  pivot.add(edges);

  for (const y of [BEAM_Y - H / 2 - 0.012, BEAM_Y + H / 2 + 0.012]) {
    const cap = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.024, 3), MAT.metalBright));
    cap.position.y = y;
    pivot.add(cap);
  }
  const post = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, BEAM_Y - H / 2 - 0.07, 12), MAT.metalBright));
  post.position.y = 0.06 + (BEAM_Y - H / 2 - 0.07) / 2;
  if (!inCube()) pivot.add(post);

  // Spektralfenster auf der Austrittsfläche: zeigt die Fächerrichtung und leuchtet, wenn Licht austritt.
  // (Bei Blick von aussen liegt Rot auf der Seite, zu der der rote Strahl abgelenkt wird.)
  const veilMat = new THREE.MeshBasicMaterial({
    map: spectrumTexture, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide, fog: false, opacity: 1,
  });
  const veil = new THREE.Mesh(new THREE.PlaneGeometry(R * Math.sqrt(3) * 0.8, H * 0.82), veilMat);
  veil.position.set(0, BEAM_Y, -(R * 0.5 + 0.004));
  veil.raycast = () => {};
  pivot.add(veil);

  const u = root.userData;
  u.pivot = pivot;
  u.veil = veil;
  u.glow = 0;
  // Austrittsfläche lokal −z → Rasterrichtung (cos a, sin a): rotation.y = −π/2 − a
  u.orient = (e) => { pivot.rotation.y = -Math.PI / 2 - e.rot * Math.PI / 4; };
  u.orient(el);
  u.update = (t, dt) => {
    u.glow = easeToward(u.glow, activeColorOf(u) ? 1 : 0, dt);
    veilMat.color.setScalar(0.08 + u.glow * 1.1);
  };
  return root;
}

/** Farbfilter: schwebender, sechseckig geschliffener Kristall in seiner Durchlassfarbe. */
function makeFilter(el) {
  const root = new THREE.Group();
  root.add(makeFixedBase());
  const col = COLOR_RGB[el.color];

  const pts = [[0, -0.34], [0.16, -0.2], [0.18, 0.16], [0, 0.34]].map(([x, y]) => new THREE.Vector2(x, y));
  const geo = new THREE.LatheGeometry(pts, 6);
  // Wie beim Zielkristall: Dunkle Farben (Blau, Rot) mit weniger Weiss und Schillern, etwas deckender und mit mehr
  // Eigenleuchten – sonst wirkt ein Blaufilter blasslila.
  const bt = brightTame(col);
  const idleGlow = THREE.MathUtils.lerp(0.3, 0.18, bt);
  const tint = col.clone().lerp(new THREE.Color(1, 1, 1), THREE.MathUtils.lerp(0.05, 0.25, bt));
  const crystal = new THREE.Mesh(geo, makeGlassMaterial(tint, {
    opacity: THREE.MathUtils.lerp(0.72, 0.62, bt), emissive: col.clone(), emissiveIntensity: idleGlow,
    iridescence: THREE.MathUtils.lerp(0.1, 0.3, bt),
  }));
  crystal.position.y = BEAM_Y;
  crystal.renderOrder = 5;
  root.add(crystal);
  const edges = glassEdges(geo, 0.22);
  crystal.add(edges);

  const coreMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(0.5) });
  const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.05, 0), coreMat);
  crystal.add(core);

  const ringMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(0.5) });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.008, 8, 48), ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = FIXED_BASE_TOP + 0.006;
  if (inCube()) { ring.position.y = BEAM_Y; ring.scale.setScalar(1.5); }
  root.add(ring);

  const u = root.userData;
  u.glow = 0;
  u.phase = Math.random() * Math.PI * 2;
  u.update = (t, dt) => {
    u.glow = easeToward(u.glow, activeColorOf(u) ? 1 : 0, dt);
    crystal.rotation.y = t * 0.3 + u.phase;
    crystal.position.y = BEAM_Y + Math.sin(t * 0.9 + u.phase) * 0.012;
    coreMat.color.copy(col).multiplyScalar(0.5 + u.glow * 4.5);
    ringMat.color.copy(col).multiplyScalar(0.5 + u.glow * 2.0);
    crystal.material.emissiveIntensity = idleGlow + u.glow * 0.8;
  };
  return root;
}

/** Kombinator: Glaskugel in einer kardanischen Fassung, Austrittsdüse zeigt in Richtung dir. */
function makeCombiner(el) {
  const root = new THREE.Group();
  root.add(el.fixed ? makeFixedBase() : makePedestal(0.38));
  const pivot = new THREE.Group();
  root.add(pivot);

  const orbGeo = new THREE.IcosahedronGeometry(0.2, 1);
  const orb = new THREE.Mesh(orbGeo, makeGlassMaterial(new THREE.Color(0.9, 0.92, 1.0), { opacity: 0.38 }));
  orb.position.y = BEAM_Y;
  orb.renderOrder = 5;
  pivot.add(orb);
  orb.add(glassEdges(orbGeo, 0.18));

  const coreMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.15, 0.15, 0.17) });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.065, 20, 14), coreMat);
  core.position.y = BEAM_Y;
  pivot.add(core);

  // Kardanische Ringe
  const gimbal = new THREE.Group();
  gimbal.position.y = BEAM_Y;
  pivot.add(gimbal);
  for (const [rx, ry] of [[Math.PI / 2, 0], [0, 0]]) {
    // kein Schattenwurf: die Ringe drehen sich, die Shadow-Map wird nur bei Änderungen erneuert
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.01, 8, 64), MAT.metalBright);
    ring.rotation.set(rx, ry, 0);
    gimbal.add(ring);
  }

  // Austrittsdüse (lokal +x) mit Linse in der Mischfarbe. Hell und mit schwach leuchtender Linse, damit die
  // Richtung auch ohne Licht und auf dem Handy erkennbar ist; die Linse ist eine flache Scheibe statt einer
  // Kreisfläche, damit sie auch von oben als Streifen zu sehen ist.
  const nozzle = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.085, 0.14, 24), MAT.metalBright));
  nozzle.rotation.z = Math.PI / 2;
  nozzle.position.set(0.31, BEAM_Y, 0);
  pivot.add(nozzle);
  const lensMat = new THREE.MeshBasicMaterial({ color: COMBINER_LENS_IDLE.clone() });
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.058, 0.02, 24), lensMat);
  lens.rotation.z = Math.PI / 2;
  lens.position.set(0.39, BEAM_Y, 0);
  pivot.add(lens);

  const post = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, BEAM_Y - 0.33, 12), MAT.metalBright));
  post.position.y = 0.06 + (BEAM_Y - 0.33) / 2;
  if (!inCube()) pivot.add(post);

  const u = root.userData;
  u.pivot = pivot;
  u.glow = 0;
  u.mix = 0;
  u.orient = (e) => { pivot.rotation.y = dirToRotationY(e.dir); };
  u.orient(el);
  const tmp = new THREE.Color();
  let shown = 7;
  u.update = (t, dt) => {
    const arrived = activeColorOf(u); // nur Farben, deren Strahl schon sichtbar angekommen ist
    if (arrived) shown = arrived;
    u.glow = easeToward(u.glow, arrived ? 1 : 0, dt);
    gimbal.rotation.y = t * 0.35;
    gimbal.rotation.x = Math.sin(t * 0.4) * 0.25;
    const tame = 1 - 0.45 * brightTame(COLOR_RGB[shown]); // weisse Mischung sonst eine weisse Scheibe
    tmp.copy(COLOR_RGB[shown]).multiplyScalar(2.6 * tame);
    coreMat.color.setRGB(0.15, 0.15, 0.17).lerp(tmp, u.glow);
    tmp.copy(COLOR_RGB[shown]).multiplyScalar(4.0 * tame);
    lensMat.color.copy(COMBINER_LENS_IDLE).lerp(tmp, u.glow);
  };
  return root;
}
/** Linse des Kombinators ohne Licht: schwach leuchtend (unter der Bloom-Schwelle), zeigt die Austrittsrichtung. */
const COMBINER_LENS_IDLE = new THREE.Color(0.55, 0.57, 0.66);

/** Blocker: schwere, dunkle Steinsäule mit Metallband. */
function makeBlocker() {
  const root = new THREE.Group();
  const stoneMat = new THREE.MeshStandardMaterial({
    color: 0x0c0c10, roughness: 0.62, metalness: 0, envMapIntensity: 0.6, flatShading: true,
  });
  const column = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.33, 0.92, 6), stoneMat));
  column.position.y = 0.46;
  column.rotation.y = Math.PI / 6;
  root.add(column);
  const top = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.27, 0.06, 6), stoneMat));
  top.position.y = 0.95;
  top.rotation.y = Math.PI / 6;
  root.add(top);
  const band = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.335, 0.34, 0.035, 6), MAT.metalDark));
  band.position.y = 0.1;
  band.rotation.y = Math.PI / 6;
  root.add(band);
  return root;
}

const ELEMENT_FACTORIES = {
  source: makeSource,
  mirror: makeMirror,
  prism: makePrism,
  filter: makeFilter,
  combiner: makeCombiner,
  blocker: makeBlocker,
  target: makeTarget,
};

/* =====================================================================
   BOARD — verbindet Spiellogik und 3D-Darstellung
   ===================================================================== */

const boardGroup = new THREE.Group();
scene.add(boardGroup);

const game = {
  levelIndex: 0,
  board: null,
  objects: new Map(), // element.id → Object3D
  hitProxies: [],     // unsichtbare Trefferzylinder der drehbaren Elemente
  targets: [],        // Modelle der Ziele
  result: null,
};

const SHARED_MATERIALS = new Set(Object.values(MAT));

/** Gibt Geometrien und elementeigene Materialien eines entfernten Modells frei. */
function disposeTree(root) {
  root.traverse((o) => {
    if (o.geometry && !SHARED_GEOMETRIES.has(o.geometry)) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) if (!SHARED_MATERIALS.has(m) && m !== hitProxyMaterial) m.dispose();
  });
}

/* =====================================================================
   WÜRFEL — Hilfen für die Würfel-Level (Prototyp): Rahmen und Zellpunkte zeigen die Tiefe.
   ===================================================================== */

const CUBE = {
  frameColor: new THREE.Color(0.3, 0.34, 0.5),
  cameraZoom: 1.3,                                  // Abstand im Vergleich zum 2D-Feld (der Würfel ist höher)
  cameraZoomNarrow: 0.95,                           // … im Hochformat (dort begrenzt die Breite, der Würfel ist schmaler)
  cameraTilt: 0.3,                                  // flacher als beim 2D-Feld: die Ebenen liegen sichtbar übereinander
  cameraTurn: 0.5,                                  // schräg: Strahlen zur Kamera hin liegen nicht hintereinander
  phiMin: 0.22, phiMax: 1.42,                       // Neigung: fast senkrecht von oben bis knapp über die Platte
};

const cubeView = {
  group: new THREE.Group(),
  size: 0,         // Kantenlänge des aktuellen Würfels, 0 = 2D-Level
  frameMat: null,  // Linien des Rahmens (leuchten beim Lösen auf, siehe glow)

  /** Neues Level: Hilfen auf- bzw. abbauen. */
  build(board) {
    this.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    this.group.clear();
    this.frameMat = null;
    this.size = board.dim === 3 ? board.size : 0;
    if (!this.size) return;
    const n = this.size, ext = n * CELL, mid = (n - 1) / 2;
    const quiet = (o) => { o.raycast = () => {}; o.layers.set(LAYER_NO_REFLECT); return o; };
    const lineMat = (color, opacity) => new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false, fog: false });
    const dotMat = (color, opacity, size) => new THREE.PointsMaterial({ color, size, transparent: true, opacity, depthWrite: false, fog: false });

    const box = new THREE.BoxGeometry(ext, ext, ext);
    const frame = quiet(new THREE.LineSegments(new THREE.EdgesGeometry(box), this.frameMat = lineMat(CUBE.frameColor.clone(), 0.5)));
    box.dispose();
    // auf der Platte stehend, die Zellen mittig darin (siehe cubeToWorld)
    cubeToWorld(mid, 0, mid, n, frame.position).y = ext / 2 + 0.002;

    const p = [];
    for (let y = 0; y < n; y++) for (let z = 0; z < n; z++) for (let x = 0; x < n; x++) p.push(...cubeToWorld(x, y, z, n).toArray());
    const cells = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    const dots = quiet(new THREE.Points(cells, dotMat(CUBE.frameColor, 0.7, 0.045)));
    this.group.add(frame, dots);
  },

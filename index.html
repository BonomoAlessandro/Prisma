const beach = (() => {
  const group = new THREE.Group();
  group.visible = false;
  const noPick = (o) => { o.layers.set(LAYER_NO_REFLECT); o.raycast = () => {}; o.frustumCulled = false; return o; };
  const ss = THREE.MathUtils.smoothstep;
  const W = BEACH.waterY;

  // Uferlinie: Land liegt hinter dem Brett (−z), links eine Landzunge, die bis neben das Brett reicht
  const shoreZ = (x) => 10.5 + 0.12 * x + 1.8 * Math.sin(0.085 * x + 0.6) - 8 * Math.exp(-(((x + 22) / 7) ** 2));
  /** Richtung aufs Ufer zu, nach dem grossräumigen Verlauf der Küste (ohne das kleine Rauschen der Uferlinie: über den
   *  Hebel bis zur Mitte des Übergangs wurde aus jeder kleinen Drehung ein Sprung in der Phase, sichtbar als Naht). */
  const shoreDir = (x) => { const gx = -(shoreZ(x + 4) - shoreZ(x - 4)) / 8, l = Math.hypot(gx, 1); return [gx / l, -1 / l]; };
  /** Ausgleich der Phase (shorePhase) für einen Punkt mit Abstand s zur Wasserlinie: Richtung der Dünung dort, wo die
   *  Senkrechte zum Ufer die Mitte des Übergangs (Abstand −15) trifft, minus jener Abstand. Gerechnet mit dem Abstand
   *  zur grossräumigen Küste; das kleine Rauschen der Uferlinie (s minus dieser Abstand) wird abgezogen – so folgt die
   *  Phase einem glatten Feld, und das Gitter hinterlässt keine Knicke (Haarlinien im Glitzern). */
  const phaseOffset = (x, z, s) => {
    // Hebel begrenzt: An der stark gekrümmten Landzunge verstärkte er jede Drehung der Küste – die Wellen liefen an
    // ihrer Flanke seitwärts, dicht gedrängt und fast stehend
    const [gx, gz] = shoreDir(x), [sx, sz] = BEACH.swell, smooth = -z - shoreZ(x), lever = Math.min(smooth + 15, 5);
    return (x - gx * lever) * sx + (z - gz * lever) * sz + 15 + smooth - s;
  };
  /** Geländehöhe, Fels (0 … 1), Bewuchs (0 … 1) und Abstand zur Wasserlinie (> 0 an Land) an (x, z); out = [Höhe, Fels, Bewuchs, Abstand, 0] (out[4]: groundWithTrees). */
  function ground(x, z, out) {
    const wob = (smoothNoise(x * 0.05 + 3.3, z * 0.05 - 8.1, 3) - 0.5) * 4;
    const s = -z - shoreZ(x) + wob; // > 0: an Land, Abstand zur Wasserlinie
    let h;
    if (s < 0) {
      // Grund: am Ufer rasch tiefer, dann eine flache Lagune, weiter draussen eine Kante ins Tiefe. (Eine Sandbank in der
      // Lagune liess die Wellen ein zweites Mal brechen, lief aber als gleichförmiger Wulst die ganze Küste entlang.)
      const d = -s;
      h = -1.6 * (1 - Math.exp(-d / 4)) - 0.09 * d - 7 * ss(d, 18, 30);
    } else {
      // Strand, dahinter Dünen und flaches, bewachsenes Hinterland
      const dune = smoothNoise(x * 0.09 + 31, z * 0.09 + 20, 3);
      h = 0.1 * Math.min(s, 5) + 1.5 * ss(s, 4.5, 9) * (0.4 + dune) + 0.05 * Math.max(s - 12, 0) * dune;
    }
    h += (smoothNoise(x * 0.3 + 9, z * 0.3 - 4, 2) - 0.5) * 0.18; // sanfte Mulden
    // Strandsicheln: Die Brandung formt die Wasserlinie zu regelmässigen Bögen – Spitzen ragen ins Meer, dazwischen Buchten
    h += 0.09 * Math.sin((x + 0.25 * z) * 0.9) * ss(s, -2.5, 0) * (1 - ss(s, 3, 5.5));
    // Fels: Landzunge und einzelne Blöcke in der Brandung
    // (Rauschen nur, wo Fels sein kann – das Gelände wird beim Bauen oft abgefragt)
    const point = Math.exp(-(((x + 22) / 6) ** 2)) * ss(s, -5, 2);
    const band = s > -6 && s < 5 ? ss(s, -6, -3) * (1 - ss(s, 2, 5)) * ss(Math.hypot(x, z), 17, 24) : 0; // nicht neben dem Brett
    let rock = 0;
    if (point > 1e-3 || band > 0) {
      const crag = smoothNoise(x * 0.32 - 7, z * 0.32 + 13, 3), rough = smoothNoise(x * 0.9 - 2, z * 0.9 + 4, 2);
      const blocks = band > 0 ? Math.sqrt(ss(smoothNoise(x * 0.42 + 50, z * 0.42 - 30, 2), 0.68, 0.8)) * band : 0; // Kuppeln
      rock = point * (0.25 + 1.1 * ss(crag, 0.3, 0.72) + 0.35 * rough) + blocks * (0.3 + 0.8 * crag + 0.3 * rough); // Sockel; darauf Felsblöcke
    }
    // Bewuchs hinter den Dünen: dichtes Buschwerk und niedrige Bäume, von oben ein Teppich aus Kronen (Buckel), die
    // sich im Streiflicht gegenseitig beschatten
    const veg = ss(s, ...BEACH.veg) * (1 - ss(rock, 0.1, 0.35) * (1 - ss(s, 6, 12))); // Fels zum Meer hin, oben bewachsen
    out[0] = W + h + rock;
    out[1] = ss(rock, 0.1, 0.35);
    out[2] = veg;
    out[3] = s;
    out[4] = 0; // Höhe einer Baumkrone darüber (withTrees)
    return out;
  }
  /** Wie ground(), dazu die Baumkronen: out[4] Höhe der Krone über dem Boden, out[2] Bewuchs mal Helligkeit (darunter dunkel). */
  function groundWithTrees(x, z, out) {
    ground(x, z, out);
    if (out[2] > 0) {
      const top = canopy(x, z);
      out[4] = top;
      out[2] *= top > 0 ? 0.35 : 0.75;
    }
    return out;
  }

  // Bäume: je Zelle eines Gitters höchstens einer, an zufälliger Stelle (nur wo Bewuchs ist); Kronen als Ellipsoide,
  // in Beständen höher und niedriger
  const TREE_CELL = 2.3;
  const hash = (i, j, k) => { const v = Math.sin(i * 127.1 + j * 311.7 + k * 74.7) * 43758.5453; return v - Math.floor(v); };
  const trees = new Map(), probe = [0, 0, 0, 0, 0];
  function treeAt(i, j) {
    const key = i * 8192 + j;
    if (trees.has(key)) return trees.get(key);
    const x = (i + 0.15 + 0.7 * hash(i, j, 1)) * TREE_CELL, z = (j + 0.15 + 0.7 * hash(i, j, 2)) * TREE_CELL;
    ground(x, z, probe);
    let tree = null;
    if (probe[2] > 0.35 && hash(i, j, 5) < 0.93) {
      const tall = 0.55 + 0.45 * ss(smoothNoise(x * 0.12 - 3, z * 0.12 + 7, 3), 0.25, 0.55);
      tree = { x, z, y: probe[0], r: 1.0 + 0.8 * hash(i, j, 3), h: (1.6 + 1.6 * hash(i, j, 4)) * tall * probe[2] };
    }
    trees.set(key, tree);
    return tree;
  }
  /** Höhe der höchsten Krone über (x, z), gemessen vom Fuss des Baums (0: keine) */
  function canopy(x, z) {
    const ci = Math.floor(x / TREE_CELL), cj = Math.floor(z / TREE_CELL);
    let best = 0;
    for (let i = ci - 1; i <= ci + 1; i++) {
      for (let j = cj - 1; j <= cj + 1; j++) {
        const t = treeAt(i, j);
        if (!t) continue;
        const q = 1 - ((x - t.x) ** 2 + (z - t.z) ** 2) / (t.r * t.r);
        if (q > 0) best = Math.max(best, t.h * (0.2 + 0.8 * Math.sqrt(q)));
      }
    }
    return best;
  }

  function build() {
    beachUniforms.uWaves.value = createWaveTexture(256);
    beachUniforms.uFoam.value = createFoamTexture(512);
    const tmp = [0, 0, 0, 0, 0];

    // Höhen für den Schattenwurf des Geländes (Bäume und Palmen: Schattenkarte, siehe unten): gleichmässiges Gitter
    const SG = 0.9, gx0 = -BEACH.reach, gz0 = -BEACH.reach, GW = Math.ceil(2 * BEACH.reach / SG) + 1, GH = Math.ceil((BEACH.reach + 12) / SG) + 1;
    const grid = new Float32Array(GW * GH);
    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) grid[j * GW + i] = ground(gx0 + i * SG, gz0 + j * SG, tmp)[0];
    const heightAt = (x, z) => {
      const fx = (x - gx0) / SG, fz = (z - gz0) / SG, i = Math.floor(fx), j = Math.floor(fz);
      if (i < 0 || j < 0 || i >= GW - 1 || j >= GH - 1) return -Infinity;
      const u = fx - i, v = fz - j, k = j * GW + i;
      return (grid[k] * (1 - u) + grid[k + 1] * u) * (1 - v) + (grid[k + GW] * (1 - u) + grid[k + GW + 1] * u) * v;
    };
    // Weicher Schatten der tiefen Sonne: zur Sonne hin abtasten, wie knapp das Gelände den Strahl verfehlt
    const sunH = Math.hypot(BEACH.sun.x, BEACH.sun.z), dx = BEACH.sun.x / sunH, dz = BEACH.sun.z / sunH, rise = BEACH.sun.y / sunH;
    const sunlight = (x, z, h) => {
      let lit = 1;
      for (let d = 0.5; d < 40; d += 0.5 + d * 0.04) {
        const t = heightAt(x + dx * d, z + dz * d);
        if (t === -Infinity) break;
        lit = Math.min(lit, 6 * (h + rise * d - t) / d + 0.15);
        if (lit <= 0) return 0;
      }
      return Math.min(lit, 1);
    };

    // Gelände: in der Mitte fein, nach aussen gröber (dort liegt es im Dunst)
    const N = 280, R = BEACH.reach, warp = (u) => R * (0.4 * u + 0.6 * u * u * u);
    const count = (N + 1) * (N + 1);
    const pos = new Float32Array(count * 3), mat = new Float32Array(count * 4);
    for (let j = 0; j <= N; j++) {
      for (let i = 0; i <= N; i++) {
        const k = j * (N + 1) + i, x = warp(i / N * 2 - 1), z = warp(j / N * 2 - 1);
        const [h, rock, veg, s] = groundWithTrees(x, z, tmp);
        pos.set([x, h, z], k * 3);
        mat.set([h > W - 2.5 ? sunlight(x, z, h) : 1, rock, veg, s], k * 4);
      }
    }
    // Richtung aufs Ufer zu (dorthin laufen die Wellen im Flachen) und Ausgleich der Phase, je Ecke
    const dir = new Float32Array(count * 3);
    for (let k = 0; k < count; k++) {
      const x = pos[k * 3], z = pos[k * 3 + 2];
      dir.set([...shoreDir(x), phaseOffset(x, z, mat[k * 4 + 3])], k * 3);
    }
    const index = [];
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const a = j * (N + 1) + i, b = a + N + 1;
        index.push(a, b, a + 1, b, b + 1, a + 1);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aMat', new THREE.BufferAttribute(mat, 4));
    geo.setAttribute('aDir', new THREE.BufferAttribute(dir, 3));
    geo.setIndex(index);
    geo.computeVertexNormals();

    // Gelände, und darüber pro Pixel das Wasser: Der Wasserstand (swellHeight) entscheidet genau, wo Meer, brechende
    // Walze, auflaufender Film oder nasser Sand ist – unabhängig vom Gitter. Unter Wasser zeichnet das Gelände die
    // Oberfläche darüber (es kennt die Tiefe), draussen die Himmelskugel mit denselben Funktionen.
    const terrain = noPick(new THREE.Mesh(geo, new THREE.ShaderMaterial({
      uniforms: beachUniforms, fog: false,
      vertexShader: `attribute vec4 aMat;
        attribute vec3 aDir;
        varying vec3 vPos, vN;
        varying vec4 vMat;
        varying vec3 vDir; // Richtung aufs Ufer zu, Ausgleich der Phase (shorePhase)
        void main() { vPos = position; vN = normal; vMat = aMat; vDir = aDir; gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform float uFade;
        varying vec3 vPos, vN;
        varying vec4 vMat;
        varying vec3 vDir; // Richtung aufs Ufer zu, Ausgleich der Phase (shorePhase)
        ${BEACH_GLSL}
        void main() {
          vec3 toCam = cameraPosition - vPos;
          float dist = length(toCam);
          vec3 V = toCam / dist;
          float bedD = WATER_Y - vPos.y; // Tiefe unter dem Meeresspiegel, an Land negativ
          float sun = vMat.x * (bedD < 2.5 && dist < 75.0 ? objectShadow(vPos + vec3(0.0, 0.05, 0.0), 0.001) : 1.0);
          float rock = vMat.y, shore = vMat.w;
          // Bewuchs: Anteil wie in ground(); vMat.z ist er mal der Helligkeit unter den Kronen (Umgebungsverdeckung)
          float veg = smoothstep(${BEACH.veg[0].toFixed(1)}, ${BEACH.veg[1].toFixed(1)}, shore) * (1.0 - rock * (1.0 - smoothstep(6.0, 12.0, shore)));
          float ao = veg > 0.01 ? clamp(vMat.z / veg, 0.0, 1.0) : 1.0;
          // Boden: Sand mit Rippeln (die feinen Wellen der Normal-Map, klein), Fels, Bewuchs. Durch tieferes Wasser sieht
          // man davon kaum etwas: dort geht er in die mittlere Farbe über (spart die Texturen auf einem Grossteil des Bildes)
          vec3 N = vec3(0.0, 1.0, 0.0), alb = vec3(0.8, 0.68, 0.53);
          if (bedD < 4.0) {
            vec4 fine = texture2D(uWaves, vPos.xz * 1.1);
            float grain = fine.a;
            // Windrippel: im Streiflicht der tiefen Sonne leuchten ihre Sonnenseiten, die anderen liegen im Schatten
            vec3 ripple = texture2D(uWaves, vPos.xz * vec2(0.16, 0.3) + 0.5).rgb - 0.5;
            N = normalize(normalize(vN) + vec3(fine.r - 0.5, 0.0, fine.g - 0.5) * mix(mix(0.12, 0.9, rock), 1.4, veg)
              + vec3(ripple.x, 0.0, ripple.y) * 0.2 * (1.0 - smoothstep(20.0, 50.0, dist)) * (1.0 - rock) * (1.0 - veg) * smoothstep(-0.3, -0.6, bedD));
            float tone = 0.6 * texture2D(uWaves, vPos.xz * 0.045 + 0.3).a + 0.4 * texture2D(uWaves, vPos.xz * 0.13 + 0.6).a; // grosse weiche Flecken
            alb = mix(vec3(0.66, 0.53, 0.37), vec3(0.76, 0.62, 0.45), tone) * (0.95 + 0.1 * grain);
            // Spülsaum: angeschwemmter Tang knapp über der höchsten Auflauflinie, ein lückenhaftes dunkles Band
            float wrack = smoothstep(0.05, 0.0, abs(-bedD - 0.36 - 0.08 * (tone - 0.5))) * smoothstep(0.45, 0.6, texture2D(uWaves, vPos.xz * 0.4).a);
            alb *= 1.0 - 0.35 * wrack * (1.0 - rock);
            alb = mix(alb, mix(vec3(0.035, 0.032, 0.03), vec3(0.10, 0.085, 0.07), grain), rock);
            // Boden unter dem Bewuchs: Laubstreu und Kraut in verschiedenen Grüntönen
            float crown = texture2D(uWaves, vPos.xz * 0.07 + 0.7).a;
            alb = mix(alb, mix(vec3(0.035, 0.07, 0.02), vec3(0.09, 0.15, 0.04), crown) * (0.8 + 0.4 * grain), veg);
            float plain = smoothstep(2.5, 4.0, bedD);
            alb = mix(alb, vec3(0.8, 0.68, 0.53), plain);
            N = normalize(mix(N, vec3(0.0, 1.0, 0.0), plain));
          }

          // Wasserstand hier: Dünung und Brandung mit Laufrichtung und Phase der Wellen an dieser Stelle; am Ufer das
          // Auflaufen im Takt der Walzen, die hier die Wasserlinie erreichen
          float env = swellSet(vPos.xz);
          float sharp = mix(7.0, 3.0, smoothstep(15.0, 50.0, dist)); // Front der Walze in der Ferne weicher: kein Flimmern
          float along = vPos.x + 0.25 * vPos.z; // entlang des Strands
          float ph = shorePhase(vPos.xz, shore, vDir.z), x = wrapPhase(ph), brk = breakGaps(ph, bedD, along);
          float cyc = (uTime * SWELL_W - vDir.z * SWELL_K) / 6.28319; // so viele Walzen haben die Wasserlinie erreicht
          float u = fract(cyc), n = floor(cyc);
          float reach = swashReach(n, along) * waveEnv(vPos.xz, n, vDir.z), reachPrev = swashReach(n - 1.0, along) * waveEnv(vPos.xz, n - 1.0, vDir.z);
          float swash = swashLevel(u, reach), share = swashShare(bedD);
          float thick = mix(swellHeight(x, bedD, env, sharp, brk), swash, share) + bedD; // Wasser über dem Grund
          // Trockenfallen: Wie lange ist es her, dass das Wasser hier abgeflossen ist? Frisch glänzt der Sand, dann
          // versickert der Film; dunkel bleibt er bis über die höchsten Wellen. Am höchsten Punkt jeder Welle bleibt ein
          // Schaumsaum liegen und zerfällt.
          float a = -bedD, since = 9.0, residue = 0.0;
          if (thick <= 0.0 && a > -0.3 && a < 0.6) {
            if (a < reach && u > swashLeaves(a, reach)) since = u - swashLeaves(a, reach);
            else if (a < reachPrev) since = u + 1.0 - swashLeaves(a, reachPrev);
            residue = smoothstep(0.03, 0.0, abs(a - reach)) * step(SWASH_UP, u) * exp(-(u - SWASH_UP) * 2.5)
              + smoothstep(0.03, 0.0, abs(a - reachPrev)) * exp(-(u + 1.0 - SWASH_UP) * 2.5);
          }
          float shine = exp(-since * 4.0);
          float damp = 1.0 - smoothstep(0.34, 0.5, a);
          float wetness = max(damp, shine) * (1.0 - veg);
          alb = mix(alb, alb * alb * 1.9, 0.35 * wetness) * (1.0 - 0.35 * wetness); // nass: dunkler, satter
          vec3 col = alb * (SUN_COL * max(dot(N, SUN), 0.0) * sun * mix(1.0, ao, 0.5 * veg) + SKY_AMB * (0.55 + 0.45 * N.y) * mix(1.0, ao, veg));
          vec3 foamCol = vec3(0.95) * (SUN_COL * (0.16 + 0.24 * sun) + SKY_AMB * 2.2);
          float hazeDist = dist;
          if (thick > 0.0) {
            // Blick bis zur Wasseroberfläche: erst auf der Höhe des Wassers hier, dann an der getroffenen Stelle
            // nachgebessert (dort Phase und Höhe neu; Abstand zur Wasserlinie über ihr Gefälle fortgesetzt)
            float k = (cameraPosition.y - vPos.y - thick) / max(cameraPosition.y - vPos.y, 1e-3);
            vec2 sxz = cameraPosition.xz - toCam.xz * k;
            float shoreS = shore + dot(sxz - vPos.xz, vDir.xy);
            float phS = shorePhase(sxz, shoreS, vDir.z), xs = wrapPhase(phS), brkS = breakGaps(phS, bedD, along);
            float sy = WATER_Y + mix(swellHeight(xs, bedD, env, sharp, brkS), swash, share);
            // (die Oberfläche dort kann knapp unter dem Grund hier liegen: an der steilen Front)
            k = min((cameraPosition.y - sy) / max(cameraPosition.y - vPos.y, 1e-3), 1.0);
            vec3 sp = cameraPosition - toCam * k;
            float path = dist * (1.0 - k), depth = max(sy - vPos.y, 0.0);
            hazeDist = dist * k;
            float var;
            vec2 dirS = swellDir(vDir.xy, shoreS);
            vec3 Nw = waterNormal(sp.xz, hazeDist, xs, dirS, bedD, env, sharp, brkS, var);
            // Lichtnetz der Wellen auf dem Grund (Kaustik), schwach und nur im klaren Flachen – nicht im Auflauffilm
            float caustic = 0.0;
            if (depth < 2.5 && share < 0.99) {
              float c1 = texture2D(uWaves, vPos.xz * 0.21 + vec2(0.02, -0.03) * uTime).a;
              float c2 = texture2D(uWaves, vPos.xz * 0.17 - vec2(0.025, 0.015) * uTime).a;
              caustic = pow(1.0 - abs(c1 - c2), 12.0) * 0.35 * exp(-depth * 1.5) * (1.0 - share);
            }
            // Licht am Grund: gebrochene Sonne (unter Wasser steiler) und das Licht des ganzen Himmels – bläulich,
            // sonst wird der Sand durch das türkise Wasser olivgrün
            vec3 bedLight = (SUN_COL * 0.35 * sun * (0.7 + caustic) + vec3(0.12, 0.16, 0.22)) * exp(-ABSORB * depth);
            vec3 trans = exp(-ABSORB * path);
            vec3 below = alb * bedLight * trans + DEEP * (1.0 - trans);
            // Trübung: In der Brandung wirbeln die Walzen Sand auf – das Wasser wird milchig sandfarben bis khaki, gleich
            // hinter einer Walze am stärksten; draussen und im dünnen Film klar
            float breaking = smoothstep(1.8, 0.9, bedD) * mix(1.0, brkS, smoothstep(3.0, 2.2, abs(xs)));
            float stirred = smoothstep(2.4, 0.6, bedD) * (0.4 + 0.6 * exp(min(xs, 0.0) * 0.6) * smoothstep(0.15, 0.0, xs) * smoothstep(-3.14, -2.4, xs));
            vec3 sediment = vec3(0.62, 0.56, 0.4) * (SUN_COL * 0.3 * sun + SKY_AMB * 1.6) * 0.5;
            below = mix(below, sediment, stirred * 0.6 * (1.0 - exp(-path * 1.5)) * (1.0 - 0.7 * share));
            col = waterColor(Nw, var, V, below);
            // Vor der brechenden Front liegt ihre steile, beschattete Seite: ein dunkler Streifen; scheint die Sonne
            // durch die dünne Lippe, leuchtet sie türkis (draussen ebenso die Kämme)
            col *= 1.0 - 0.25 * breaking * smoothstep(0.0, 0.06, xs) * smoothstep(0.4, 0.12, xs) * (1.0 - share);
            float face = breaking * smoothstep(0.8, 0.0, xs) * smoothstep(-0.15, 0.0, xs) + 0.3 * (1.0 - breaking) * smoothstep(0.6, 1.0, cos(xs));
            col += vec3(0.03, 0.17, 0.13) * SUN_COL * 0.14 * face * env * (0.4 + 0.6 * sun) * (1.0 - share) * smoothstep(0.0, 0.3, depth);
            // Schaum (foamDissolve): an der brechenden Front ein schmaler, dichter weisser Kern, dahinter ein Feld aus
            // Zellen und Fäden, das seewärts ausdünnt; in der ganzen Brandungszone ein Rest. Nicht jede Welle bricht
            // überall (Lücken entlang der Front, von Welle zu Welle anders). Auf dem Auflauffilm Schaum, solange er
            // hinaufläuft, vorn eine helle Kante; ein Saum um die Felsen.
            if (bedD < 2.4) {
              float fn = texture2D(uWaves, sp.xz * vec2(0.35, 0.5) + vec2(0.0, uTime * 0.03)).a;
              float xf = xs + (fn - 0.5) * 0.3; // ausgefranster Kamm
              float core = smoothstep(0.08, -0.02, xf) * smoothstep(-0.75, -0.15, xf);
              float field = exp(min(xf, 0.0) * 0.75) * smoothstep(0.12, 0.04, xf) * smoothstep(-3.14, -2.4, xf) * 0.85;
              float dens = (breaking * max(core * 1.15 * (1.0 - 0.5 * rock), field) + 0.16 * smoothstep(2.2, 0.8, bedD)) * (1.0 - share);
              float rising = max(1.0 - smoothstep(SWASH_UP * 0.7, SWASH_UP * 1.3, u), smoothstep(0.9, 1.0, u)); // ohne Sprung zur nächsten Welle
              dens = max(dens, share * (0.12 + 0.6 * rising * smoothstep(0.12, 0.01, depth))); // Schaumrolle vorn am dünnen Rand
              float foam = foamDissolve(sp.xz, dens, dirS, share * swash * 8.0 + uTime * 0.05);

            if (shine > 0.01) {

              float F = 0.02 + 0.98 * pow(1.0 - max(dot(Nf, V), 0.0), 5.0);

            // Welle ihn wegspült; an der letzten zerfällt noch ein Rest Schaum

        }`,
    })));
    terrain.renderOrder = 1; // nach Brett und Platte: was darunter liegt, verwirft der Tiefentest früh
    group.add(terrain);

    // Baumkronen (die Bäume aus treeAt, soweit man sie vor dem Dunst sieht): Laub in grossen und kleinen Ballen. Licht

    const list = [];
    const C = Math.ceil(80 / TREE_CELL);

    const crownVertex = `${GLSL_NOISE}
      ${BEACH_CASTER_GLSL}

        vec3 t1 = normalize(cross(position, abs(position.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
        vec3 t2 = cross(normalize(position), t1);

        vec3 sc = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));

    const crowns = noPick(new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 9), new THREE.ShaderMaterial({
      uniforms: beachUniforms, fog: false,
      vertexShader: `attribute vec2 aSun;
        varying vec3 vPos, vN, vLocal;
        varying vec2 vSun;
        varying float vSeed;
        ${crownVertex}
        void main() {
          vec4 wp = crownWorld(vN);
          if (dot(vN, normalize(mat3(modelMatrix * instanceMatrix) * position)) < 0.0) vN = -vN;

        }`,
      fragmentShader: `uniform float uFade;
        varying vec3 vPos, vN, vLocal;
        varying vec2 vSun;
        varying float vSeed;
        ${BEACH_GLSL}
        ${GLSL_NOISE}
        void main() {
          vec3 toCam = cameraPosition - vPos;
          float dist = length(toCam);
          // Blattbüschel in drei Grössen: zwischen ihnen tiefe, dunkle Lücken, ihre Spitzen hell; die Normale folgt den Büscheln
          float c1 = noise(vPos * 2.4 + vSeed * 9.0), c2 = noise(vPos * 6.0 - vSeed * 5.0), c3 = noise(vPos * 15.0);

          float leaf = smoothstep(0.28, 0.68, clump);
          vec3 N = normalize(vN + 0.6 * (vec3(noise(vPos * 6.0 + 2.0), noise(vPos * 6.0 + 7.0), noise(vPos * 6.0 + 4.0)) - 0.5));
          vec3 alb = mix(vec3(0.035, 0.075, 0.02), vec3(0.09, 0.135, 0.035), vSeed) * (0.25 + 0.95 * leaf) * (0.85 + 0.3 * c3);
          float up = vLocal.y * 0.5 + 0.5;
          float sun = mix(vSun.x, vSun.y, smoothstep(0.2, 0.95, up)) * objectShadow(vPos + vN * 0.3, 0.0015);
          float wrap = max(dot(N, SUN) * 0.7 + 0.3, 0.0);                    // Laub lässt etwas Licht durch
          float occl = (0.3 + 0.7 * smoothstep(-0.3, 0.9, vLocal.y)) * (0.4 + 0.6 * leaf); // unten und in den Lücken dunkel
          vec3 col = alb * (SUN_COL * wrap * sun * (0.55 + 0.45 * occl) + SKY_AMB * (0.6 + 0.6 * N.y) * occl);
          // Gegenlicht: am Rand der Krone scheint die Sonne durch die Blätter
          col += alb * SUN_COL * 0.5 * sun * pow(max(dot(-toCam / dist, SUN), 0.0), 4.0) * pow(1.0 - abs(dot(N, toCam / dist)), 2.0);
          gl_FragColor = vec4(beachHaze(col, -toCam / dist, dist) * uFade, 1.0);
        }`,
    }), list.length));
    const sunAttr = new Float32Array(list.length * 2), mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    list.forEach((t, k) => {
      e.set(0, hash(t.x, t.z, 6) * 6.3, 0);
      mtx.compose(new THREE.Vector3(t.x, t.y + t.h * 0.45, t.z), q.setFromEuler(e), new THREE.Vector3(t.r, t.h * 0.55, t.r * (0.85 + 0.3 * hash(t.x, t.z, 7))));
      crowns.setMatrixAt(k, mtx);
      // Licht vom Gelände her unten an der Krone und am Wipfel (knapp ausserhalb der eigenen Krone gemessen)
      sunAttr[k * 2] = sunlight(t.x + dx * t.r * 1.05, t.z + dz * t.r * 1.05, t.y + t.h * 0.35);
      sunAttr[k * 2 + 1] = sunlight(t.x + dx * t.r * 0.5, t.z + dz * t.r * 0.5, t.y + t.h * 1.02);
    });
    crowns.geometry.setAttribute('aSun', new THREE.InstancedBufferAttribute(sunAttr, 2));
    crowns.renderOrder = 1;
    group.add(crowns);

    // Palmen am Dünenrand, in Gruppen, zum Meer geneigt (dorthin, wo der Abstand zur Wasserlinie abnimmt); zwei
    // Formen, je Palme eigene Höhe und Drehung. Bei der tiefen Sonne werfen sie lange Schatten über den Strand.
    const palmSpots = [], pr = mulberry32(404), probe2 = [0, 0, 0, 0, 0];
    for (let tries = 0; tries < 5000 && palmSpots.length < 64; tries++) {
      const x = (pr() - 0.5) * 150, z = 2 - pr() * 75;
      ground(x, z, probe2);
      const s = probe2[3], y = probe2[0];
      if (s < 4.5 || s > 9.5 || probe2[1] > 0.2 || Math.hypot(x, z) > 72) continue;
      if (pr() > ss(smoothNoise(x * 0.07 + 5, z * 0.07 - 3, 2), 0.35, 0.6)) continue; // Gruppen
      if (palmSpots.some((p) => (p.x - x) ** 2 + (p.z - z) ** 2 < 6)) continue;
      const gx = ground(x + 0.5, z, probe2)[3] - ground(x - 0.5, z, probe2)[3], gz = ground(x, z + 0.5, probe2)[3] - ground(x, z - 0.5, probe2)[3];
      palmSpots.push({ x, z, y, h: 4.2 + 2.2 * pr(), turn: Math.atan2(gz, -gx) + (pr() - 0.5) * 1.2 });
    }
    const palmVertex = `${GLSL_NOISE}
      ${BEACH_CASTER_GLSL}
      attribute vec3 aPalm;
      vec4 palmWorld() { return modelMatrix * instanceMatrix * vec4(palmShape(position, aPalm, instanceSeed()), 1.0); }`;
    const palmMaterial = new THREE.ShaderMaterial({
      uniforms: beachUniforms, fog: false, side: THREE.DoubleSide,
      vertexShader: `attribute float aSunP;
        varying vec3 vPos, vN, vInfo;
        varying float vSun, vSeed;
        ${palmVertex}
        void main() {
          vec4 wp = palmWorld();
          vPos = wp.xyz;
          vN = normalize(mat3(modelMatrix * instanceMatrix) * normal);
          vInfo = aPalm;
          vSun = aSunP;
          vSeed = instanceSeed();

      fragmentShader: `uniform float uFade;
        varying vec3 vPos, vN, vInfo;
        varying float vSun, vSeed;
        ${BEACH_GLSL}
        void main() {
          vec3 toCam = cameraPosition - vPos;
          float dist = length(toCam);
          vec3 V = toCam / dist, N = normalize(vN);
          if (dot(N, V) < 0.0) N = -N; // Wedel von beiden Seiten
          float sun = vSun * objectShadow(vPos + N * 0.06, 0.002);
          vec3 col;
          if (vInfo.x < 0.5) {
            // Stamm: graubraun mit Ringen
            vec3 alb = vec3(0.15, 0.12, 0.09) * (0.7 + 0.3 * smoothstep(-0.3, 0.6, sin(vInfo.y * 150.0)));
            col = alb * (SUN_COL * max(dot(N, SUN), 0.0) * sun + SKY_AMB * (0.6 + 0.4 * N.y));
          } else {
            // Wedel: grün bis gelbgrün, die unteren dürr und braun; durchscheinend, wenn die Sonne dahinter steht

            vec3 alb = mix(mix(vec3(0.05, 0.09, 0.025), vec3(0.12, 0.15, 0.045), fract(vInfo.z * 3.1 + vSeed)), vec3(0.2, 0.14, 0.07), dry);
            alb *= 0.75 + 0.35 * smoothstep(0.0, 0.3, vInfo.y); // zum Stamm hin dunkler

            col = alb * (SUN_COL * (max(dot(N, SUN), 0.0) + transl * vec3(1.0, 1.25, 0.6)) * sun + SKY_AMB * (0.7 + 0.3 * N.y));
          }
          gl_FragColor = vec4(beachHaze(col, -V, dist) * uFade, 1.0);
        }`,
    });
    const palms = [0, 1].map((variant) => {
      const spots = palmSpots.filter((_, k) => k % 2 === variant);
      const mesh = noPick(new THREE.InstancedMesh(createPalmGeometry(11 + variant * 7), palmMaterial, spots.length));
      const sunP = new Float32Array(spots.length);
      spots.forEach((p, k) => {
        e.set(0, p.turn, 0);
        mtx.compose(new THREE.Vector3(p.x, p.y - 0.05, p.z), q.setFromEuler(e), new THREE.Vector3(p.h, p.h, p.h));
        mesh.setMatrixAt(k, mtx);

    });

    // Felsblöcke auf der Landzunge und in der Brandung (wo das Gelände Fels ist), halb im Sand versenkt; drei Formen.
    // Im Wasser zeigen sie die Wasserfarbe, an der Wasserlinie schäumt es, darüber sind sie nass und mit Algen
    // bewachsen, oben trocken mit Flechten.
    const rockSpots = [], rr = mulberry32(505);
    for (let tries = 0; tries < 8000 && rockSpots.length < 140; tries++) {
      const x = -40 + rr() * 80, z = -40 + rr() * 52;
      ground(x, z, probe2);
      if (probe2[1] < 0.5 || Math.hypot(x, z) > 72) continue;
      const size = 0.45 + 2.0 * rr() ** 2;
      if (probe2[0] + 0.35 * size < W + 0.15) continue; // ragt nicht deutlich aus dem Wasser
      if (rockSpots.some((p) => (p.x - x) ** 2 + (p.z - z) ** 2 < (p.size + size) ** 2 * 0.5)) continue;
      rockSpots.push({ x, z, y: probe2[0], size, turn: rr() * 6.3, tilt: (rr() - 0.5) * 0.5 });
    }
    const rockMaterial = new THREE.ShaderMaterial({
      uniforms: beachUniforms, fog: false,
      vertexShader: `attribute vec2 aSunR;
        attribute vec4 aWaterR;
        varying vec3 vPos, vN, vLocal;
        varying vec4 vWater;
        varying vec2 vCenter;
        varying float vSun, vSeed, vBed;
        float instanceSeed() { return fract(sin(dot(instanceMatrix[3].xz, vec2(12.9898, 78.233))) * 43758.5453); }
        void main() {
          vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);
          vPos = wp.xyz;
          vN = normalize(mat3(modelMatrix * instanceMatrix) * normal);
          vLocal = position;
          vSun = aSunR.x;
          vBed = aSunR.y;

      fragmentShader: `uniform float uFade;
        varying vec3 vPos, vN, vLocal;
        varying vec4 vWater;
        varying vec2 vCenter;
        varying float vSun, vSeed, vBed;
        ${BEACH_GLSL}
        ${GLSL_NOISE}
        void main() {
          vec3 toCam = cameraPosition - vPos;
          float dist = length(toCam);
          vec3 V = toCam / dist;
          // Gestein: Schichten und Risse, Körnung; die Normale folgt den Unebenheiten

          float grain = noise(vPos * 9.0), crevice = smoothstep(0.32, 0.18, noise(q * 1.7)) * smoothstep(0.4, 0.25, noise(q * 3.9 + 2.0));
          float strata = 0.5 + 0.5 * sin(vPos.y * 7.0 + noise(q) * 6.0);
          vec3 N = normalize(vN + 0.5 * (vec3(noise(q * 2.1), noise(q * 2.1 + 5.0), noise(q * 2.1 + 9.0)) - 0.5));
          vec3 alb = mix(vec3(0.075, 0.065, 0.055), vec3(0.15, 0.13, 0.105), noise(q * 0.7)) * (0.75 + 0.35 * grain) * (0.8 + 0.25 * strata);
          alb *= 1.0 - 0.6 * crevice; // Spalten
          // Wasserstand an der Stelle, wie ihn das Gelände daneben zeichnet (Phase mit Refraktion, Brandung, Auflaufen;
          // Abstand zur Wasserlinie über ihr Gefälle von der Mitte des Blocks fortgesetzt), und die Zonen am Fels

          float ph = shorePhase(vPos.xz, vWater.x + dot(vPos.xz - vCenter, vWater.zw), vWater.y), x = wrapPhase(ph);
          float cyc = (uTime * SWELL_W - vWater.y * SWELL_K) / 6.28319;
          float reach = swashReach(floor(cyc), vPos.x + 0.25 * vPos.z) * waveEnv(vPos.xz, floor(cyc), vWater.y);
          float level = WATER_Y + mix(swellHeight(x, vBed, env, 3.0, breakGaps(ph, vBed, vPos.x + 0.25 * vPos.z)), swashLevel(fract(cyc), reach), swashShare(vBed)) + 0.03;
          float h = vPos.y - level;
          float wet = 1.0 - smoothstep(0.1, 0.55, h);                        // Spritzwasser: nass und dunkel
          alb = mix(alb, vec3(0.03, 0.045, 0.025), smoothstep(0.35, 0.0, abs(h - 0.05)) * 0.8 * step(0.4, noise(q * 1.3))); // Algen
          alb = mix(alb, vec3(0.22, 0.17, 0.07), smoothstep(0.75, 0.95, N.y) * smoothstep(0.6, 1.0, h) * smoothstep(0.55, 0.7, noise(q * 1.1 + 3.0))); // Flechten
          alb *= 1.0 - 0.5 * wet;
          float sun = vSun * objectShadow(vPos + vN * 0.15, 0.0015);
          float occl = 0.55 + 0.45 * smoothstep(-0.3, 0.6, vLocal.y);
          vec3 col = alb * (SUN_COL * max(dot(N, SUN), 0.0) * sun + SKY_AMB * (0.5 + 0.5 * N.y) * occl);
          // nass glänzend
          vec3 R = reflect(-V, N);
          col += wet * (beachSky(vec3(R.x, abs(R.y), R.z), 0.0) * 0.05 + SUN_COL * sunGlint(N, V, 0.03) * sun * 0.12);

          // (mit der Spiegelung der Wasserfläche darüber)
          if (h < 0.0) {
            vec3 trans = exp(-ABSORB * (-h) * 2.5);
            col = waterColor(vec3(0.0, 1.0, 0.0), 0.004, V, col * trans + DEEP * (1.0 - trans));
          }
          // Schaum, wo die Wellen auf den Fels schlagen
          float fn = texture2D(uWaves, vPos.xz * 0.5 + vec2(vPos.y * 0.3, uTime * 0.05)).a;
          float wash = smoothstep(0.8, 0.0, abs(x));   // Gischt, wenn eine Welle anläuft
          float foam = foamDissolve(vPos.xz + vec2(vPos.y * 0.7, 0.0), smoothstep(0.07 + 0.08 * wash, 0.0, abs(h - 0.03)) * (0.4 + 0.4 * wash) + 0.08 * fn, vec2(0.0, 1.0), uTime * 0.04);
          col = mix(col, vec3(0.95) * (SUN_COL * (0.16 + 0.24 * sun) + SKY_AMB * 2.2), foam * 0.9);
          gl_FragColor = vec4(beachHaze(col, -V, dist) * uFade, 1.0);
        }`,
    });
    const rocks = [0, 1, 2].map((variant) => {
      const spots = rockSpots.filter((_, k) => k % 3 === variant);
      const mesh = noPick(new THREE.InstancedMesh(createRockGeometry(variant + 1), rockMaterial, spots.length));
      const sunR = new Float32Array(spots.length * 2), waterR = new Float32Array(spots.length * 4);
      spots.forEach((p, k) => {
        // Wasser an der Mitte des Blocks: Abstand zur Wasserlinie, Ausgleich der Phase und Richtung aufs Ufer (wie aDir)
        const sc = ground(p.x, p.z, probe2)[3];
        waterR.set([sc, phaseOffset(p.x, p.z, sc), ...shoreDir(p.x)], k * 4);
        e.set(p.tilt, p.turn, p.tilt * 0.6);
        mtx.compose(new THREE.Vector3(p.x, p.y - 0.15 * p.size, p.z), q.setFromEuler(e), new THREE.Vector3(p.size, p.size * (0.8 + 0.4 * hash(p.x, p.z, 8)), p.size));
        mesh.setMatrixAt(k, mtx);
        sunR.set([sunlight(p.x, p.z, p.y + p.size * 0.6), W - p.y], k * 2);
      });
      mesh.geometry.setAttribute('aSunR', new THREE.InstancedBufferAttribute(sunR, 2));
      mesh.geometry.setAttribute('aWaterR', new THREE.InstancedBufferAttribute(waterR, 4));
      mesh.renderOrder = 1;
      group.add(mesh);
      return mesh;
    });

    // Schattenkarte: Kronen, Palmen und Felsen aus Sonnenrichtung, einmal beim Bauen (sie stehen still; das Wiegen im Wind ist
    // zu klein, um zu zählen). Gelände und Wasser, Kronen, Palmen und Felsen fragen sie ab: lange, scharfe Abendschatten.
    const casters = new THREE.Scene(), box = new THREE.Box3();
    const proxy = (source, vertexShader, side) => {
      const m = new THREE.InstancedMesh(source.geometry, new THREE.ShaderMaterial({
        uniforms: beachUniforms, vertexShader, fragmentShader: SHADOW_DEPTH_FRAGMENT, side,
      }), source.count);
      m.instanceMatrix = source.instanceMatrix;
      m.frustumCulled = false;

    };

      void main() { vec3 n; gl_Position = projectionMatrix * viewMatrix * crownWorld(n); }`, THREE.FrontSide);
    for (const { mesh } of palms) proxy(mesh, `${palmVertex}
      void main() { gl_Position = projectionMatrix * viewMatrix * palmWorld(); }`, THREE.DoubleSide);
    for (const mesh of rocks) proxy(mesh, `void main() { gl_Position = projectionMatrix * viewMatrix * modelMatrix * instanceMatrix * vec4(position, 1.0); }`, THREE.FrontSide);
    for (const p of rockSpots) box.expandByPoint(new THREE.Vector3(p.x - 2 * p.size, p.y - p.size, p.z - 2 * p.size)).expandByPoint(new THREE.Vector3(p.x + 2 * p.size, p.y + 1.5 * p.size, p.z + 2 * p.size));
    for (const t of list) box.expandByPoint(new THREE.Vector3(t.x - t.r, t.y, t.z - t.r)).expandByPoint(new THREE.Vector3(t.x + t.r, t.y + t.h, t.z + t.r));
    for (const p of palmSpots) box.expandByPoint(new THREE.Vector3(p.x - 0.8 * p.h, p.y, p.z - 0.8 * p.h)).expandByPoint(new THREE.Vector3(p.x + 0.8 * p.h, p.y + p.h * 1.2, p.z + 0.8 * p.h));
    bakeShadowMap(casters, box, BEACH.sun, BEACH.shadowSize, beachUniforms);

    // Himmelskugel: Himmel und, wo kein Gelände ist, das tiefe Meer bis zum Horizont. Nicht in der Spiegelung der
    // Platte (wie der Hintergrund).
    const sky = noPick(new THREE.Mesh(new THREE.SphereGeometry(79, 48, 24), new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: beachUniforms,
      vertexShader: `varying vec3 vDir; void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vDir = wp.xyz - cameraPosition;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
      fragmentShader: `uniform float uFade;
        varying vec3 vDir;
        ${BEACH_GLSL}
        void main() {
          vec3 d = normalize(vDir), col;
          if (d.y < 0.0 && cameraPosition.y > WATER_Y) {
            float t = min((cameraPosition.y - WATER_Y) / -d.y, 1e4);
            vec2 p = cameraPosition.xz + d.xz * t;
            float var;
            vec3 N = waterNormal(p, t, wrapPhase(swellPhase(p)), SWELL, 100.0, swellSet(p), 3.0, 1.0, var);
            col = beachHaze(waterColor(N, var, -d, DEEP), d, t);
          } else {
            col = beachSky(d, 1.0);
          }
          gl_FragColor = vec4(col * uFade, 0.0); // Alpha 0 = Himmel (siehe Hintergrund)
        }`,
    })));
    sky.renderOrder = 1001; // nach dem Hintergrund, den sie überdeckt
    group.add(sky);
    return { sky };
  }

  let parts = null;
  return {
    group,
    /** Erst bauen, wenn der Strand gewählt wird (kostet einen Moment Rechenzeit; die meisten wählen ihn nie). */
    prepare() {
      if (parts) return;
      parts = build();
      // Shader gleich übersetzen, nicht erst im ersten Bild nach dem Einblenden
      const visible = group.visible;
      group.visible = true;
      renderer.compile(scene, camera);
      group.visible = visible;
    },
    show(visible) {
      if (visible) this.prepare();
      group.visible = visible;
    },
    update(t) {
      beachUniforms.uTime.value = t;
      parts.sky.position.copy(camera.position);
    },
  };
})();
scene.add(beach.group);

/**
 * Hintergrund umschalten: Milchstrasse, Sonnensystem, Wald oder Strand (Knopf unten rechts, Taste H; der Reihe nach). Die
 * Wahl bleibt gespeichert. Beim Wechsel blendet erst der bisherige Hintergrund ganz aus, dann der neue ein: Undurch-
 * sichtige Teile (Planeten, Gelände des Strands) blenden aus Schwarz ein und lägen sonst als dunkle Flächen über dem alten.
 */
const skyTheme = {
  storageKey: 'prisma.sky',
  order: ['milky', 'solar', 'forest', 'beach'],
  names: { milky: 'Milchstrasse', solar: 'Sonnensystem', forest: 'Wald', beach: 'Strand' },
  current: 'milky',
  weight: { milky: 1, solar: 0, forest: 0, beach: 0 }, // Anteil jedes Hintergrunds, 0 … 1
  fadeTime: 0.9,   // s für Aus- und Einblenden zusammen
  goal(name) { return name === this.current ? 1 : 0; },
  get fading() { return this.order.some((n) => this.weight[n] !== this.goal(n)); },
  set(name, animate = true) {
    this.current = name;
    if (name === 'beach') beach.prepare(); // vor dem Ausblenden: sonst stockte die Überblendung
    if (name === 'forest') forest.prepare();
    if (!animate) for (const n of this.order) this.weight[n] = this.goal(n);
    try { localStorage.setItem(this.storageKey, name); } catch { /* egal */ }
    this.apply();
  },
  next() { this.set(this.order[(this.order.indexOf(this.current) + 1) % this.order.length]); },
  update(dt, t) {
    if (this.fading) {
      const step = 2 * dt / this.fadeTime;
      const others = this.order.filter((n) => n !== this.current);
      for (const n of others) this.weight[n] = Math.max(0, this.weight[n] - step);
      if (others.every((n) => this.weight[n] === 0)) this.weight[this.current] = Math.min(1, this.weight[this.current] + step);
      this.apply();
    }
    if (this.weight.solar > 0) solar.update(t);
    if (this.weight.forest > 0) forest.update(t);
    if (this.weight.beach > 0) beach.update(t);
  },
  apply() {
    const e = (n) => { const w = this.weight[n]; return w * w * (3 - 2 * w); };
    background.material.uniforms.uGlow.value = SKY.glow * e('milky');
    background.material.uniforms.uForest.value = e('forest');
    // Im Wald überstrahlt der Mond die meisten Sterne, am Strand ist es noch hell
    stars.material.uniforms.uFade.value = 1 - 0.7 * e('forest') - e('beach');
    stars.material.uniforms.uForest.value = e('forest');
    stars.visible = this.weight.beach < 1;
    background.visible = this.weight.beach < 1; // dann ganz von der Himmelskugel des Strands überdeckt
    solarUniforms.uFade.value = e('solar');
    solar.lineMat.opacity = 0.12 * e('solar');
    solar.group.visible = this.weight.solar > 0;
    forestUniforms.uFade.value = e('forest');
    forest.show(this.weight.forest > 0);
    beachUniforms.uFade.value = e('beach');
    beach.show(this.weight.beach > 0);
  },
};
try {
  const stored = localStorage.getItem(skyTheme.storageKey);
  if (skyTheme.order.includes(stored)) skyTheme.current = stored;
} catch { /* Standard */ }
skyTheme.set(skyTheme.current, false);

/* =====================================================================
   STEINPLATTE mit planarer Spiegelung
   ===================================================================== */

const stoneTex = createStoneTextures(QUALITY.textureSize);

// Spiegelungs-Kamera: rendert die Szene gespiegelt in eine Textur,
// die vom Bodenmaterial (je nach Rauheit leicht weichgezeichnet) gelesen wird.
const reflector = new THREE.Reflector(new THREE.PlaneGeometry(PLATE, PLATE), {
  textureWidth: 256,
  textureHeight: 256,
  clipBias: 0.002,
  multisample: 0, // MSAA wird unten über samples gesetzt (WebGL2)
});
// Hängt bewusst nicht im Szenengraph; seine Matrix wird in renderReflection() vom Boden übernommen.
reflector.getRenderTarget().stencilBuffer = true; // 24 statt 16 Bit Tiefe (vor dem ersten Rendern setzen)
// Kantenglättung in der Spiegelung: sonst bekommen Strahlen und Kristalle in der kleinen Textur
// Treppenkanten. three.js löst MSAA vor dem Erzeugen der Mipmaps auf – beides lässt sich kombinieren.
if (renderer.capabilities.isWebGL2) reflector.getRenderTarget().samples = QUALITY.reflectionMsaa;
// Mipmaps: Unschärfe je nach Rauheit mit einer einzigen Abtastung (versetzte Abtastungen erzeugten Geisterbilder)
if (renderer.capabilities.isWebGL2) { // WebGL1 kann keine Mipmaps für NPOT-Texturen
  reflector.getRenderTarget().texture.generateMipmaps = true;
  reflector.getRenderTarget().texture.minFilter = THREE.LinearMipmapLinearFilter;
}

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: stoneTex.map,
  roughness: 1.0,
  roughnessMap: stoneTex.roughnessMap,
  metalness: 0.0,
  normalMap: stoneTex.normalMap,
  normalScale: new THREE.Vector2(0.12, 0.12), // nur ein Hauch Relief – sonst wirken Spiegelungen ölig-wellig
  envMapIntensity: 0.22,
});

// Analytische Details des Bodens (Plattenkoordinaten in Welteinheiten), kantengeglättet über fwidth.
const FLOOR_DETAIL_GLSL = `
  float floorGroove = 0.0, floorInlay = 0.0, floorBevel = 0.0;
  {
    vec2 pp = (vUv - 0.5) * ${PLATE.toFixed(4)};
    float halfBoard = ${(BOARD / 2).toFixed(4)};

    // Gravierte Rasterlinien; Kontrast sinkt, wenn die Linie schmaler als ein Pixel wird
    vec2 q = (pp + halfBoard) / ${CELL.toFixed(4)};
    vec2 fw = max(fwidth(q), vec2(1e-5));
    vec2 gq = abs(fract(q + 0.5) - 0.5);
    float lw = ${(0.0055 / CELL).toFixed(5)};
    vec2 line = (1.0 - smoothstep(vec2(lw) - fw * 0.5, vec2(lw) + fw * 0.5, gq)) * clamp(lw * 2.0 / fw, 0.25, 1.0);
    vec2 apw = fwidth(pp);
    vec2 inside = 1.0 - smoothstep(vec2(halfBoard), vec2(halfBoard) + apw, abs(pp));
    floorGroove = max(line.x, line.y) * inside.x * inside.y;

    // Helle, matte Einlegelinie knapp ausserhalb des Spielfelds. Bewusst nicht metallisch:
    // eine dünne Glanzlinie auf leicht unebenem Grund glitzert pixelweise (wirkt gestrichelt).
    float box = max(abs(pp.x), abs(pp.y));
    float bw = max(fwidth(box), 1e-5);
    float r1 = abs(box - (halfBoard + 0.16));
    float iw = 0.011;
    floorInlay = (1.0 - smoothstep(iw - bw, iw + bw, r1)) * clamp(iw * 2.0 / bw, 0.2, 1.0);

    // Polierte Fase an der Plattenkante: fängt das Licht und zeichnet die Silhouette
    float edgeDist = ${(PLATE / 2).toFixed(4)} - box;
    floorBevel = (1.0 - smoothstep(0.0, 0.06, edgeDist)) * 0.7;
  }
`;

// Lichtwelle beim Lösen (siehe celebration): x = Radius, y = Stärke, z = Breite (Welt)
const shockUniforms = {
  uShock: { value: new THREE.Vector3(0, 0, 0.4) },
  uShockColor: { value: new THREE.Color(1, 1, 1) },
};

// Verschiebung der Mipmap-Stufe (Bias): Die automatische Stufe berücksichtigt die Texturgrösse schon; damit die
// Unschärfe in CSS-Pixeln gleich bleibt, muss der Bias nur die Pixeldichte ausgleichen.
const reflLodShift = { value: 0 };
floorMaterial.onBeforeCompile = (shader) => {
  Object.assign(shader.uniforms, shockUniforms);
  shader.uniforms.tReflect = { value: reflector.getRenderTarget().texture };
  shader.uniforms.uReflMatrix = reflector.material.uniforms.textureMatrix;
  shader.uniforms.uReflStrength = { value: QUALITY.reflections ? 1.0 : 0.0 };
  shader.uniforms.uReflLodShift = reflLodShift;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\nuniform mat4 uReflMatrix;\nvarying vec4 vReflUv;')
    .replace('#include <project_vertex>', '#include <project_vertex>\nvReflUv = uReflMatrix * vec4(position, 1.0);');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform sampler2D tReflect;\nuniform float uReflStrength;\nuniform float uReflLodShift;\nvarying vec4 vReflUv;\nuniform vec3 uShock;\nuniform vec3 uShockColor;')
    .replace('#include <map_fragment>', `#include <map_fragment>
      ${FLOOR_DETAIL_GLSL}
      diffuseColor.rgb *= 1.0 - floorGroove * 0.6;
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.16, 0.16, 0.18), floorInlay);
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 2.2 + 0.012, floorBevel);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
      roughnessFactor = mix(roughnessFactor, 0.8, floorGroove);
      roughnessFactor = mix(roughnessFactor, 0.55, floorInlay);
      roughnessFactor = mix(roughnessFactor, 0.12, floorBevel);`)
    .replace('#include <tonemapping_fragment>', `
      {
        vec2 ruv = vReflUv.xy / vReflUv.w;
        // Unschärfe über Mipmaps nur mässig: tiefe Stufen mitteln in Blöcken (bis 32×32 Texel) und machten aus
        // gespiegelten Strahlen eine Kette weicher Flecken, die beim Bewegen der Kamera wanderten ("Wellen").
        // Die Strahlen werden für die Spiegelung ohnehin breit und weich gezeichnet (renderReflection).
        // uReflLodShift: höhere Pixeldichte (Handy) → entsprechend tiefere Stufe, gleiche Unschärfe wie am Desktop
        vec3 refl = texture2D(tReflect, ruv, min(1.0 + roughnessFactor * 2.0, 2.2) + uReflLodShift).rgb;
        float ndv = clamp(dot(normalize(vViewPosition), normal), 0.0, 1.0);
        float fresnel = 0.22 + 0.78 * pow(1.0 - ndv, 4.0);
        float gloss = 1.0 - smoothstep(0.15, 0.7, roughnessFactor);
        gl_FragColor.rgb += refl * fresnel * gloss * uReflStrength * 0.42;
      }
      if (uShock.y > 0.0) {
        // Ring um die Feldmitte, dahinter ein schwacher Nachschein
        float sd = length((vUv - 0.5) * ${PLATE.toFixed(4)});
        float ring = exp(-pow((sd - uShock.x) / uShock.z, 2.0));
        float trail = (1.0 - smoothstep(0.0, max(uShock.x, 1e-3), sd)) * 0.04;
        gl_FragColor.rgb += uShockColor * (ring + trail) * uShock.y;
      }
      #include <tonemapping_fragment>`);
  floorMaterial.userData.shader = shader;
};

const floorTop = new THREE.Mesh(new THREE.PlaneGeometry(PLATE, PLATE), floorMaterial);
floorTop.rotation.x = -Math.PI / 2;
floorTop.receiveShadow = true;
scene.add(floorTop);

// Seitenkanten der Platte: poliert, damit sie Softbox-Licht fangen und sich vom Hintergrund lösen
const plateSideMaterial = new THREE.MeshStandardMaterial({
  color: 0x14141b,
  roughness: 0.22,
  metalness: 0.0,
  envMapIntensity: 1.4,
});
const plateSides = new THREE.Mesh(new THREE.BoxGeometry(PLATE, PLATE_THICK, PLATE), plateSideMaterial);
plateSides.position.y = -PLATE_THICK / 2 - 0.03; // Deckfläche deutlich unter dem Boden
plateSides.receiveShadow = true;
scene.add(plateSides);

// Schmale Metallkante rund um die Platte (ausserhalb ihrer Fläche, minimal erhaben)
// – klare Silhouette aus jedem Blickwinkel, ohne mit dem Boden zu überlappen.
const plateTrim = new THREE.Group();
{
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x8d8e98, metalness: 1.0, roughness: 0.28, envMapIntensity: 1.3 });
  const T = 0.024, H = 0.056, y = 0.003 - H / 2;
  for (const sgn of [-1, 1]) {
    const bx = new THREE.Mesh(new THREE.BoxGeometry(PLATE + 2 * T, H, T), trimMat);
    bx.position.set(0, y, sgn * (PLATE / 2 + T / 2));
    const bz = new THREE.Mesh(new THREE.BoxGeometry(T, H, PLATE), trimMat);
    bz.position.set(sgn * (PLATE / 2 + T / 2), y, 0);
    bx.receiveShadow = bz.receiveShadow = true;
    plateTrim.add(bx, bz);
  }
}
scene.add(plateTrim);

// Schmaler, zurückversetzter Sockel unter der Platte – lässt die Platte schweben.
const plinth = new THREE.Mesh(
  new THREE.BoxGeometry(PLATE - 0.8, 1.6, PLATE - 0.8),
  new THREE.MeshStandardMaterial({ color: 0x050508, roughness: 0.8, metalness: 0.0, envMapIntensity: 0.3 })
);
plinth.position.y = -PLATE_THICK - 0.8;
scene.add(plinth);

/* =====================================================================
   BELEUCHTUNG — Museumsspot als Hauptlicht
   ===================================================================== */

const hemi = new THREE.HemisphereLight(0x2a2d50, 0x050308, 0.08);
scene.add(hemi);

const keyLight = new THREE.SpotLight(0xfff1e2, 1.5, 0, 0.44, 1.0, 1);
keyLight.position.set(2.5, 15, 6);
keyLight.target.position.set(0, 0, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(QUALITY.shadowSize, QUALITY.shadowSize);
keyLight.shadow.camera.near = 8;
keyLight.shadow.camera.far = 26;
keyLight.shadow.bias = -0.0002;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight, keyLight.target);

// Kein zusätzliches Gegenlicht: es glänzte bei flachem Blick als blauer Fleck auf dem polierten Stein.
// Lichtkanten an den Objekten liefern die Softboxen der Environment-Map.

/* =====================================================================
   POST-PROCESSING
   ===================================================================== */

const FinalShader = {
  uniforms: {
    tDiffuse: { value: null },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uExposure: { value: LOOK.exposure },
    uVignette: { value: LOOK.vignette },
    uAberration: { value: LOOK.aberration },
    uGrain: { value: LOOK.grain },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uResolution;
    uniform float uTime, uExposure, uVignette, uAberration, uGrain;
    varying vec2 vUv;

    // ACES Filmic (identisch zu three.js ACESFilmicToneMapping)
    vec3 RRTAndODTFit(vec3 v) {
      vec3 a = v * (v + 0.0245786) - 0.000090537;
      vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
      return a / b;
    }
    vec3 acesFilmic(vec3 color) {
      const mat3 inM = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
      const mat3 outM = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
      color *= uExposure / 0.6;
      color = inM * color;
      color = RRTAndODTFit(color);
      color = outM * color;
      return clamp(color, 0.0, 1.0);
    }
    vec3 linearToSRGB(vec3 c) {
      return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
    }
    float hash(vec2 p) {
      p = fract(p * vec2(443.897, 441.423));
      p += dot(p, p.yx + 19.19);
      return fract((p.x + p.y) * p.x);
    }

    void main() {
      vec2 c = vUv - 0.5;
      float aspect = uResolution.x / uResolution.y;
      vec2 ca = c * vec2(aspect, 1.0);
      float r2 = dot(ca, ca);

      // Chromatische Aberration: sehr dezent und erst im äusseren Bildbereich – nicht am Himmel (Alpha 0), sonst
      // bekämen die Sterne einen Rot-Blau-Saum. Additives Licht kann Alpha über 1 heben: begrenzen.
      vec4 base = texture2D(tDiffuse, vUv);
      vec2 off = c * smoothstep(0.45, 0.95, r2) * uAberration * clamp(base.a, 0.0, 1.0);
      vec3 col;
      col.r = texture2D(tDiffuse, vUv - off).r;
      col.g = base.g;
      col.b = texture2D(tDiffuse, vUv + off).b;

      // Vignette
      float vig = smoothstep(1.05, 0.25, length(ca));
      col *= mix(1.0 - uVignette, 1.0, vig);

      col = acesFilmic(col);
      col = linearToSRGB(col);

      // Filmkorn (in den Mitteltönen am stärksten) + gleichzeitig Dithering gegen Banding
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      float n = hash(vUv * uResolution + fract(uTime * 7.31) * vec2(97.3, 61.7)) - 0.5;
      col += n * uGrain * (0.45 + 0.55 * (1.0 - abs(lum - 0.4) * 1.6));

      gl_FragColor = vec4(col, 1.0);
    }`,
};

function createComposer() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const rt = new THREE.WebGLRenderTarget(size.x, size.y, {
    type: HDR_TYPE,
    samples: renderer.capabilities.isWebGL2 ? QUALITY.msaa : 0,
    // Mit Stencil legt three.js einen kombinierten Tiefen-/Stencil-Puffer an (WebGL2: DEPTH24_STENCIL8,
    // WebGL1 faktisch 24 Bit) – ohne nur DEPTH_COMPONENT16, was bei flachem Blickwinkel zu
    // Streifen (Z-Fighting) auf der Platte führt.
    stencilBuffer: true,
  });
  const comp = new THREE.EffectComposer(renderer, rt);
  comp.addPass(new THREE.RenderPass(scene, camera));

  const bloom = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    LOOK.bloomStrength, LOOK.bloomRadius, LOOK.bloomThreshold
  );
  // Bloom-Puffer auf HDR umstellen, sonst werden helle Strahlen auf 1.0 abgeschnitten.
  [bloom.renderTargetBright, ...bloom.renderTargetsHorizontal, ...bloom.renderTargetsVertical]
    .forEach(t => { t.texture.type = HDR_TYPE; });
  // Nur der Überschuss über der Schwelle blüht (weiches Knie), begrenzt gegen eckige Halos.
  bloom.materialHighPassFilter.fragmentShader = bloom.materialHighPassFilter.fragmentShader.replace(
    'gl_FragColor = mix( outputColor, texel, alpha );',
    'vec3 excess = texel.rgb * (max(v - luminosityThreshold, 0.0) / max(v, 1e-4));\n' +
    'gl_FragColor = vec4(min(excess, vec3(2.5)) * alpha, 1.0);'
  );
  bloom.highPassUniforms.smoothWidth.value = 0.6;
  // Leuchten additiv aufs Bild legen wie bisher, aber Alpha unverändert lassen (Alpha 0 = Himmel, siehe FinalShader)
  Object.assign(bloom.materialCopy, {
    blending: THREE.CustomBlending, blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  });
  // Original-Gauss endet bei 1 Sigma -> sichtbare eckige Halos. Engeres Sigma = runde Halos.
  bloom.separableBlurMaterials.forEach(m => {
    m.defines.SIGMA = (m.defines.KERNEL_RADIUS / 2.4).toFixed(3);
    m.needsUpdate = true;
  });
  // Desktop: Bloom zusätzlich in halber Auflösung (UnrealBloom halbiert intern schon einmal) – optisch kaum
  // ein Unterschied, spart rund 70 % seiner Kosten. Nicht auf dem Handy: Dort sind helle Linien (Strahlen,
  // Glanzkante der Platte) im Verhältnis zu den Pixeln dünn, und im Viertel der Auflösung wurden sie nur
  // stellenweise erfasst – das Leuchten zerfiel in Perlen und Wellen. Mit Pixeldichte 2 entspricht die
  // halbe Auflösung dort genau einem Bloom-Pixel pro CSS-Pixel.
  const bloomSetSize = bloom.setSize.bind(bloom);
  const bloomDiv = IS_MOBILE ? 1 : 2;
  bloom.setSize = (w, h) => bloomSetSize(Math.max(1, Math.round(w / bloomDiv)), Math.max(1, Math.round(h / bloomDiv)));
  bloom.setSize(size.x, size.y);
  comp.addPass(bloom);

  const finalPass = new THREE.ShaderPass(FinalShader);
  // Rendert direkt auf den Bildschirm: ohne Swap wird der zweite Composer-Puffer nie gebunden
  // und belegt daher keinen Grafikspeicher.
  finalPass.needsSwap = false;
  comp.addPass(finalPass);
  return { comp, bloom, finalPass };
}

const { comp: composer, bloom: bloomPass, finalPass } = createComposer();
// Mit eigenem RenderTarget setzt der Composer sein Pixelverhältnis auf 1 – für HiDPI korrigieren.
composer.setPixelRatio(renderer.getPixelRatio());

/* =====================================================================
   KAMERA — schräg von oben, schwebt sanft, frei ums Feld drehbar (Neigung begrenzt)
   ===================================================================== */

const cameraRig = {
  lead: 0.35,             // Blickpunkt so weit vor der Feldmitte (zur Kamera hin)
  target: new THREE.Vector3(),
  baseTheta: 0,           // Azimut
  basePhi: 0.86,          // Winkel von der Senkrechten
  userTheta: 0, userPhi: 0,
  goalTheta: 0, goalPhi: 0, // goalTheta bleibt in −π … π (dragCamera)
  limitsPhiUp: 0.22, limitsPhiDown: 0.16,
  radius: 18,             // Abstand der Ausgangsansicht; gedreht bleibt er gleich (ein Zoom pumpte, siehe PLAN 2.18)
  homing: null,           // Rückflug zur Ausgangsansicht beim Levelwechsel (cameraGoHome)
};

function fitCameraDistance() {
  // Spielfeld soll in Breite und Höhe sicher ins Bild passen
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const tanV = Math.tan(vfov / 2);
  const tanH = tanV * camera.aspect;
  // Hochformat: steiler von oben – das Feld nutzt die Höhe besser, und die Vorderkante wird
  // perspektivisch weniger breit, sodass weniger Rand nötig ist (grössere Zellen zum Tippen).
  const wide = THREE.MathUtils.clamp((camera.aspect - 0.5) / 0.8, 0, 1);
  const halfW = PLATE * THREE.MathUtils.lerp(0.52, 0.56, wide);
  const halfH = PLATE * 0.42;
  cameraRig.radius = Math.max(halfW / tanH, halfH / tanV, 14);
  cameraRig.basePhi = THREE.MathUtils.lerp(0.46, 0.86, wide);
  updateSky(wide);
}

/**
 * Das Hauptlicht kreist mit der Kamera (ohne ihr Schweben): So sieht das Feld von jeder Seite aus wie entworfen.
 * Ein festes Licht stünde von hinten gesehen gegenüber und spiegelte sich grell im polierten Stein.
 */
const keyLightHome = keyLight.position.clone();
const Y_AXIS = new THREE.Vector3(0, 1, 0);
let keyLightTheta = 0;
function orbitKeyLight(theta) {
  if (Math.abs(theta - keyLightTheta) < 1e-4) return; // Schatten nur neu berechnen, wenn das Licht wandert
  keyLightTheta = theta;
  keyLight.position.copy(keyLightHome).applyAxisAngle(Y_AXIS, theta);
  markShadowsDirty();
}

/** Beim Levelwechsel: in einem Bogen auf kürzestem Weg zurück zur Ausgangsansicht. */
function cameraGoHome() {
  const theta = cameraRig.goalTheta, phi = cameraRig.goalPhi;
  if (Math.abs(theta) + Math.abs(phi) < 1e-3) return;
  cameraRig.homing = { theta, phi, t: 0, duration: 0.8 + 0.25 * Math.abs(theta) };
}

function updateCamera(t, dt) {
  const h = cameraRig.homing;
  if (h) {
    h.t = Math.min(1, h.t + dt / h.duration);
    const e = h.t < 0.5 ? 4 * h.t ** 3 : 1 - (2 - 2 * h.t) ** 3 / 2; // ease-in-out
    cameraRig.goalTheta = h.theta * (1 - e);
    cameraRig.goalPhi = h.phi * (1 - e);
    if (h.t >= 1) cameraRig.homing = null;
  }
  const k = 1 - Math.pow(0.00002, dt); // Zeitkonstante ≈ 0.09 s: weich, aber nicht träge
  cameraRig.userTheta += (cameraRig.goalTheta - cameraRig.userTheta) * k;
  cameraRig.userPhi += (cameraRig.goalPhi - cameraRig.userPhi) * k;

  const theta = cameraRig.baseTheta + cameraRig.userTheta + Math.sin(t * 0.13) * 0.035;
  const phi = cameraRig.basePhi + cameraRig.userPhi + Math.sin(t * 0.21 + 1.3) * 0.018;
  const r = cameraRig.radius * (1 + Math.sin(t * 0.17 + 0.4) * 0.006);

  cameraRig.target.set(cameraRig.lead * Math.sin(theta), 0, cameraRig.lead * Math.cos(theta));
  camera.position.set(
    cameraRig.target.x + r * Math.sin(phi) * Math.sin(theta),
    cameraRig.target.y + r * Math.cos(phi),
    cameraRig.target.z + r * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(cameraRig.target);
  orbitKeyLight(cameraRig.baseTheta + cameraRig.userTheta);
}

// Ziehen dreht die Kamera; ausgewertet im Eingabemodul (INTERAKTION).
const drag = { active: false };
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

/* =====================================================================
   SPIELELEMENTE — 3D-Modelle für Quelle, Spiegel und Ziel
   ===================================================================== */

const BEAM_Y = 0.42; // Höhe, auf der die Strahlen über der Platte laufen
const HALF_GRID = (GRID - 1) / 2;

/** Rasterkoordinate → Weltposition (Zellmitte auf der Platte). */
function gridToWorld(x, z, y = 0, target = new THREE.Vector3()) {
  return target.set((x - HALF_GRID) * CELL, y, (z - HALF_GRID) * CELL);
}

/**
 * 0 … 1: wie stark eine Farbe gedämpft werden soll, weil sie hell ist. Helle Farben (Weiss, Gelb,
 * Cyan, Grün) überschreiten die Bloom-Schwelle viel stärker als Rot, Blau oder Magenta.
 */
function brightTame(c) {
  const lum = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  return THREE.MathUtils.smoothstep(lum, 0.35, 0.95);
}

const COLOR_RGB = {
  1: new THREE.Color(1.0, 0.16, 0.12),  // Rot
  2: new THREE.Color(0.2, 1.0, 0.32),   // Grün
  3: new THREE.Color(1.0, 0.78, 0.18),  // Gelb
  4: new THREE.Color(0.18, 0.36, 1.0),  // Blau
  5: new THREE.Color(1.0, 0.22, 0.85),  // Magenta
  6: new THREE.Color(0.2, 0.92, 1.0),   // Cyan
  7: new THREE.Color(1.0, 0.97, 0.92),  // Weiss (minimal warm)
};

const brushedTex = createBrushedTexture(256);
brushedTex.repeat.set(2, 2);

const MAT = {
  metalDark: new THREE.MeshStandardMaterial({
    color: 0x2c2c33, metalness: 1, roughness: 0.42, roughnessMap: brushedTex, envMapIntensity: 1.1,
  }),
  metalBright: new THREE.MeshStandardMaterial({
    color: 0xb9bac4, metalness: 1, roughness: 0.3, roughnessMap: brushedTex, envMapIntensity: 1.25,
  }),
  mirror: new THREE.MeshStandardMaterial({
    color: 0xf2f4ff, metalness: 1, roughness: 0.03, envMap: mirrorEnvironment, envMapIntensity: 1.7,
  }),
  stone: new THREE.MeshStandardMaterial({
    color: 0x111117, metalness: 0, roughness: 0.38, envMapIntensity: 0.7,
  }),
  lens: new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.97, 0.92).multiplyScalar(5.5) }),
};

function shadowed(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/** Runder Metallsockel (Drehteller), auf dem jedes drehbare Element steht. */
function makePedestal(radius = 0.34) {
  const g = new THREE.Group();
  const disk = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(radius, radius + 0.02, 0.06, 48), MAT.metalDark));
  disk.position.y = 0.03;
  const rim = shadowed(new THREE.Mesh(new THREE.TorusGeometry(radius - 0.03, 0.008, 8, 64), MAT.metalBright));
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.062;
  g.add(disk, rim);
  return g;
}

/**
 * Fester Sockel für alles, was sich nicht drehen lässt (Quelle, Ziel, Filter, fester Spiegel; auch ein festes Prisma
 * oder ein fester Kombinator): eckiger, dunkler Steinblock mit schmalem rot leuchtendem Rand – kein Drehteller.
 * Formensprache: rund mit weissem Leuchtring = drehbar, eckig mit rotem Rand = fest (auf dem Handy waren die feinen
 * Drehmarken unsichtbar).
 */
const FIXED_BASE_SIZE = 0.66;
const FIXED_BASE_TOP = 0.07;  // Oberkante des Steinblocks (Teller: 0.06) – Ringe und Lichthöfe liegen knapp darüber
// Randleiste: feine Linie (halb so breit wie der Leuchtring der drehbaren Elemente), flach knapp über dem Block;
// Oberkante 0.079 – knapp über dem Lichthof des Ziels (FIXED_BASE_TOP + 0.008), sonst flimmert sein Rand.
// Gedämpftes Rot weit unter der Bloom-Schwelle: ruhig und unaufdringlich. Wenig Grün- und Blauanteil – das ACES im
// finalPass zieht helles Rot sonst ins Orange.
const FIXED_EDGE = { width: 0.017, height: 0.010, inset: 0.012, color: new THREE.Color(0.42, 0.06, 0.07) };
let fixedBaseParts = null; // Geometrien und Material, geteilt von allen festen Sockeln (beim ersten Gebrauch gebaut)
function fixedBase() {
  if (fixedBaseParts) return fixedBaseParts;
  const size = FIXED_BASE_SIZE, { width: t, height: h, inset } = FIXED_EDGE;
  const blockGeo = new THREE.BoxGeometry(size, FIXED_BASE_TOP, size).translate(0, FIXED_BASE_TOP / 2, 0);
  const frameGeo = new THREE.BoxGeometry(size + 0.02, 0.02, size + 0.02).translate(0, 0.01, 0);
  // eckiger Rand oben, knapp innerhalb der Blockkante: macht die Form "eckig = fest" auch auf dem dunklen Boden lesbar
  const outer = size - 2 * inset, e = outer / 2 - t / 2, y = FIXED_BASE_TOP - 0.001 + h / 2;
  const edgeGeo = mergeGeometries([[outer, t, 0, -e], [outer, t, 0, e], [t, outer - 2 * t, -e, 0], [t, outer - 2 * t, e, 0]]
    .map(([w, d, x, z]) => new THREE.BoxGeometry(w, h, d).translate(x, y, z)));
  const edgeMat = new THREE.MeshBasicMaterial({ color: FIXED_EDGE.color, fog: false });
  for (const geo of [blockGeo, frameGeo, edgeGeo]) SHARED_GEOMETRIES.add(geo);
  SHARED_MATERIALS.add(edgeMat);
  fixedBaseParts = { blockGeo, frameGeo, edgeGeo, edgeMat };
  return fixedBaseParts;
}
/** Drei Draw-Calls: Block, Rahmen, Randleiste (alle Geometrien geteilt). */
function makeFixedBase() {
  const { blockGeo, frameGeo, edgeGeo, edgeMat } = fixedBase();
  const g = new THREE.Group();
  g.add(shadowed(new THREE.Mesh(blockGeo, MAT.stone)), shadowed(new THREE.Mesh(frameGeo, MAT.metalDark)));
  // Leuchtrand nicht in der Bodenspiegelung (wie der Leuchtring der drehbaren Elemente)
  const edge = new THREE.Mesh(edgeGeo, edgeMat);
  edge.raycast = () => {};
  edge.layers.set(LAYER_NO_REFLECT);
  g.add(edge);
  return g;
}

/** Lichtquelle: schlanker Scheinwerfer auf einer Säule, Linse strahlt in +x. */
function makeSource(el) {
  const root = new THREE.Group();
  root.add(makeFixedBase());

  const head = new THREE.Group();
  head.rotation.y = dirToRotationY(el.dir);
  root.add(head);

  const column = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.065, BEAM_Y - 0.05, 24), MAT.metalBright));
  column.position.y = 0.06 + (BEAM_Y - 0.05) / 2 - 0.02;
  head.add(column);

  const housing = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.15, 0.5, 40), MAT.metalDark));
  housing.rotation.z = Math.PI / 2;
  housing.position.set(-0.04, BEAM_Y, 0);
  head.add(housing);

  // Kühlrippen
  for (let i = 0; i < 4; i++) {
    const fin = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.012, 8, 40), MAT.metalBright));
    fin.rotation.y = Math.PI / 2;
    fin.position.set(-0.24 + i * 0.07, BEAM_Y, 0);
    head.add(fin);
  }

  const bezel = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.022, 12, 48), MAT.metalBright));
  bezel.rotation.y = Math.PI / 2;
  bezel.position.set(0.21, BEAM_Y, 0);
  head.add(bezel);

  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.11, 40), MAT.lens.clone());
  lens.rotation.y = Math.PI / 2;
  lens.position.set(0.212, BEAM_Y, 0);
  head.add(lens);

  root.userData.lens = lens;
  return root;
}

/** Spiegel: gebürsteter Rahmen, hochglänzende Fläche, auf Drehteller mit 45°-Markierungen (fest: Steinblock). */
function makeMirror(el) {
  const root = new THREE.Group();
  root.add(el.fixed ? makeFixedBase() : makePedestal(0.4));

  // Gravierte 45°-Marken auf dem Teller (nur drehbare Spiegel – feste stehen auf dem eckigen Sockel)
  for (let i = 0; i < 8 && !el.fixed; i++) {
    const tick = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.004, 0.012), MAT.metalBright);
    const a = i * Math.PI / 4;
    tick.position.set(Math.cos(a) * 0.32, 0.063, Math.sin(a) * 0.32);
    tick.rotation.y = -a;
    root.add(tick);
  }

  const pivot = new THREE.Group();
  pivot.rotation.y = dirToRotationY(el.rot);
  root.add(pivot);

  const W = MIRROR_HALF_WIDTH * 2 * CELL, H = 0.6, T = 0.05, P = 0.032; // Breite, Höhe, Rahmentiefe, Profil
  const bottom = BEAM_Y - H / 2;

  const frame = new THREE.Group();
  const bar = (w, h, x, y) => {
    const m = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, T), MAT.metalBright));
    m.position.set(x, y, 0);
    frame.add(m);
  };
  bar(W, P, 0, bottom + P / 2);
  bar(W, P, 0, bottom + H - P / 2);
  bar(P, H, -W / 2 + P / 2, bottom + H / 2);
  bar(P, H, W / 2 - P / 2, bottom + H / 2);
  pivot.add(frame);

  const glass = shadowed(new THREE.Mesh(new THREE.BoxGeometry(W - P * 1.4, H - P * 1.4, 0.012), MAT.mirror));
  glass.position.y = bottom + H / 2;
  pivot.add(glass);

  // Zwei schlanke Stützen zum Teller
  for (const sx of [-0.22, 0.22]) {
    const leg = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.018, bottom - 0.06, 12), MAT.metalBright));
    leg.position.set(sx, 0.06 + (bottom - 0.06) / 2, 0);
    pivot.add(leg);
  }

  root.userData.pivot = pivot;
  root.userData.orient = (e) => { pivot.rotation.y = dirToRotationY(e.rot); };
  return root;
}

/** Brillantschliff als Lathe-Profil (unten Spitze, oben Tafel), facettiert durch flatShading. */
function makeGemGeometry(radius) {
  const pts = [
    new THREE.Vector2(0.0, -0.95),
    new THREE.Vector2(0.62, -0.28),
    new THREE.Vector2(1.0, 0.0),
    new THREE.Vector2(1.0, 0.08),
    new THREE.Vector2(0.62, 0.42),
    new THREE.Vector2(0.0, 0.42),
  ].map(p => p.multiplyScalar(radius));
  const geo = new THREE.LatheGeometry(pts, 8);
  geo.computeVertexNormals();
  return geo;
}

/** Ziel: schwebender Edelstein in seiner Zielfarbe, mit Leuchtkern und glimmendem Ring. */
function makeTarget(el) {
  const root = new THREE.Group();
  root.add(makeFixedBase());
  const col = COLOR_RGB[el.color];
  const mask = el.color; // Farbmaske: Rot 1, Grün 2, Blau 4
  // Etwas sattere Variante der Strahlfarbe für den Stein (die Strahlfarben sind bewusst hell, z. B. Himmelblau)
  const deep = new THREE.Color(col.r * col.r, col.g * col.g, col.b * col.b).lerp(col, 0.85);
  // Dunkle Farben (Blau, Rot) verwässern schnell: Mit viel Weiss und Schillern im Glas liest sich Blau neben
  // Weiss nur als „Weiss mit Blaustich“. Helle Farben vertragen mehr (und werden getroffen gedämpft, siehe litTame).
  const bt = brightTame(col);

  // Ring aus drei Bögen, ein fester Platz je Grundfarbe (Rot links, Grün rechts, Blau vorne; hinten offen, dort
  // verdeckt ihn der Stein). Es leuchten die Grundfarben, aus denen die Zielfarbe besteht: Blau ein Bogen, Cyan
  // zwei, Weiss drei. So ist die Farbe auch ohne Farbunterscheidung lesbar, und man sieht, woraus sie gemischt
  // wird. Kommt Licht an, zeigt jeder Bogen seine Grundfarbe: gebraucht und da = heller, fehlt = ruhig,
  // nicht gebraucht und da = flackert im leeren Platz (falsches Licht).
  const ringSegs = [];
  for (const p of [1, 2, 4]) {
    const on = (mask & p) !== 0;
    const seg = new THREE.Mesh(targetArcGeometry(), new THREE.MeshBasicMaterial({
      color: on ? COLOR_RGB[p].clone().multiplyScalar(TARGET_IDLE.ring) : TARGET_RING.offColor, toneMapped: false,
    }));
    // Bogen in der xy-Ebene drehen, dann flach legen: Winkel 90° zeigt zur Kamera (+z)
    seg.rotation.set(Math.PI / 2, 0, THREE.MathUtils.degToRad(TARGET_RING.slots[p] - TARGET_RING.arc / 2));
    seg.position.y = FIXED_BASE_TOP + 0.006;
    // In der Bodenspiegelung verdeckt ihn ohnehin das Spiegelbild des Sockels: dort nicht zeichnen
    seg.layers.set(LAYER_NO_REFLECT);
    root.add(seg);
    // arrive: Grundfarbe kommt sichtbar an (animiert 0..1). partial: Zusatzhelligkeit, wenn sie ankommt –
    // bei hellen Farben (Grün) gedämpft, sonst überstrahlt der Bogen schon vor dem Treffer.
    const partial = TARGET_RING.partial * (1 - 0.6 * brightTame(COLOR_RGB[p]));
    Object.assign(seg.userData, { primary: p, on, color: COLOR_RGB[p], partial, arrive: 0, arriveGoal: 0 });
    ringSegs.push(seg);
  }

  // Farbiger Lichthof auf dem Sockel: zeigt schon vor dem Treffer, welche Farbe das Ziel erwartet.
  const haloMat = new THREE.MeshBasicMaterial({
    map: spotTexture, color: col.clone().multiplyScalar(TARGET_IDLE.halo), transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  });
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), haloMat);
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = FIXED_BASE_TOP + 0.008;
  halo.raycast = () => {};
  root.add(halo);

  // Bewusst ohne echte Transmission: die würde jedes Frame die ganze Szene ein zweites Mal rendern
  // (≈ ein Drittel der Frame-Zeit). Transparenz + Clearcoat + Iridescence + Leuchtkern wirken fast gleich.
  const gemMat = new THREE.MeshPhysicalMaterial({
    color: deep.clone().lerp(new THREE.Color(1, 1, 1), THREE.MathUtils.lerp(0.06, 0.3, bt)), // getönt, aber noch Glas
    metalness: 0, roughness: 0.04, ior: 2.0, specularIntensity: 1,
    transparent: true, opacity: 0.84,
    clearcoat: 1, clearcoatRoughness: 0.02,
    iridescence: THREE.MathUtils.lerp(0.15, 0.45, bt), iridescenceIOR: 1.8, // Schillern hellt dunkle Farben auf
    emissive: deep.clone(), emissiveIntensity: TARGET_IDLE.emissive,
    flatShading: true, envMapIntensity: 1.8,
  });
  // Kein Schattenwurf: der Stein dreht und schwebt, die Shadow-Map wird aber nur bei Änderungen
  // neu berechnet – und Transparenz kennt die Shadow-Map nicht (voll dunkler Schatten).
  const gem = new THREE.Mesh(makeGemGeometry(0.26), gemMat);
  gem.position.y = BEAM_Y;
  root.add(gem);

  // Opaker Leuchtkern: scheint durch den transparenten Stein.
  const coreMat = new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(TARGET_IDLE.core) });
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.075, 0), coreMat);
  gem.add(core);

  root.userData.gem = gem;
  root.userData.core = core;
  root.userData.ringSegs = ringSegs;
  root.userData.halo = halo;
  root.userData.color = col;
  // Dunkle Farben (v. a. Blau) gehen sonst in den hellen Glanzlichtern unter: stärker selbst leuchten lassen.
  const lum = 0.2126 * col.r + 0.7152 * col.g + 0.0722 * col.b;
  // Helle Farben überschreiten die Bloom-Schwelle viel stärker: getroffen gedämpfter leuchten,
  // sonst wird der ganze Edelstein (v. a. Weiss) zum facettenlosen Fleck
  root.userData.litTame = 1 - 0.4 * bt;
  root.userData.emissiveTame = 1 - 0.65 * bt;
  root.userData.glowBoost = THREE.MathUtils.clamp(0.35 / Math.max(lum, 0.01), 1, 1.2);
  root.userData.hit = 0;        // animierter Zustand 0..1
  root.userData.hitGoal = 0;
  root.userData.wrong = 0;      // falsches Licht kommt an: animiert 0..1
  root.userData.wrongGoal = 0;
  root.userData.wrongMix = 0;
  root.userData.wrongColor = new THREE.Color();
  root.userData.flash = 0;      // kurzes Aufblitzen im Lösungsmoment (1 → 0)
  root.userData.phase = Math.random() * Math.PI * 2;
  root.userData.update = (t, dt) => updateTarget(root, t, dt);
  return root;
}

/** Leuchtstärken eines noch nicht getroffenen Ziels (getroffen kommt jeweils hit × … dazu). */
// Unter der Bloom-Schwelle bleiben, sonst kippt die Farbe im Tone Mapping ins Weisse.
const TARGET_IDLE = { core: 0.8, emissive: 0.15, ring: 0.7, halo: 0.12 };
/**
 * Farbring der Ziele: Radius (ausserhalb des Steins, Radius 0.26 – er schwebt höher und verdeckt von oben sonst die
 * Bögen; innerhalb des roten Sockelrands bei 0.30), Bogenmitte je Grundfarbe in Grad (0 = +x, 90 = zur Kamera; Rot
 * und Grün leicht nach vorne, damit sie auch im Hochformat neben dem Stein sichtbar bleiben), Bogenlänge, Dicke,
 * Farbe leerer Plätze und Zusatzhelligkeit eines gebrauchten Bogens, dessen Farbe schon ankommt.
 */
const TARGET_RING = {
  radius: 0.27, slots: { 1: 190, 2: 350, 4: 90 }, arc: 90, tube: 0.017,
  offColor: new THREE.Color(0.05, 0.05, 0.06), partial: 1.0,
};
let targetArcGeo = null;
/** Ein Bogen des Farbrings (geteilt von allen Zielen). */
function targetArcGeometry() {
  if (!targetArcGeo) {
    targetArcGeo = new THREE.TorusGeometry(TARGET_RING.radius, TARGET_RING.tube, 8, 32, THREE.MathUtils.degToRad(TARGET_RING.arc));
    SHARED_GEOMETRIES.add(targetArcGeo);
  }
  return targetArcGeo;
}

/** Ziel-Zustand weich nachführen (Glimmen ↔ hell leuchtend). */
function updateTarget(obj, t, dt) {
  const u = obj.userData;
  u.hit += (u.hitGoal - u.hit) * (1 - Math.pow(0.0005, dt));
  u.wrong += (u.wrongGoal - u.wrong) * (1 - Math.pow(0.002, dt));
  const h = u.hit, hl = h * u.litTame;
  u.flash *= Math.pow(0.04, dt);
  const f = u.flash;
  u.gem.scale.setScalar(1 + f * 0.28);
  u.gem.rotation.y = t * (0.25 + h * 0.6) + u.phase;
  u.gem.position.y = BEAM_Y + Math.sin(t * 1.1 + u.phase) * 0.018;
  const flicker = 1 + Math.sin(t * 13.0 + u.phase) * 0.03 * h;
  // Wartend atmet das Ziel langsam in seiner Farbe – es "fragt" nach Licht.
  const breathe = (1 - h) * (0.5 + 0.5 * Math.sin(t * 1.8 + u.phase));
  u.core.material.color.copy(u.color).multiplyScalar((TARGET_IDLE.core + breathe * 0.15 + hl * 6.9 + f * 14 * u.litTame) * flicker);
  u.gem.material.emissiveIntensity = (TARGET_IDLE.emissive + breathe * 0.05) * u.glowBoost + h * 1.3 * u.emissiveTame;
  u.halo.material.color.copy(u.color).multiplyScalar(TARGET_IDLE.halo + breathe * 0.05 + hl * 0.6 + f * 1.4);
  // Farbring: je Grundfarbe ein Bogen. Gebraucht: leuchtet, heller sobald seine Farbe ankommt (danach trägt hit).
  // Nicht gebraucht, kommt aber an: flackert unruhig im leeren Platz – z. B. "hier kommt zu viel Blau an".
  const ringLevel = TARGET_IDLE.ring + breathe * 0.1 + hl * 2.9 + f * 5;
  const unrest = 0.65 + 0.35 * Math.sin(t * 7.0 + u.phase) * Math.sin(t * 2.3);
  for (const seg of u.ringSegs) {
    const s = seg.userData;
    s.arrive += (s.arriveGoal - s.arrive) * (1 - Math.pow(0.002, dt));
    if (s.on) seg.material.color.copy(s.color).multiplyScalar(ringLevel + s.arrive * (1 - h) * s.partial);
    else seg.material.color.copy(TARGET_RING.offColor).lerp(_wrongTint.copy(s.color).multiplyScalar(TARGET_WRONG.ring * unrest), s.arrive);
  }
  // Falsche Farbe: Der Lichtfleck flackert zusätzlich in der Mischung, die ankommt; Stein und gebrauchte Bögen
  // zeigen weiter, welche Farbe gesucht ist.
  if (u.wrong > 0.002) u.halo.material.color.lerp(_wrongTint.copy(u.wrongColor).multiplyScalar(TARGET_WRONG.halo * unrest), u.wrong);
}
/** Ziel mit Licht der falschen Farbe: leerer Platz im Farbring und Lichtfleck (unter der Bloom-Schwelle). */
const TARGET_WRONG = { ring: 0.9, halo: 0.6 };
const _wrongTint = new THREE.Color();

/* ---------- Phase 4: Prisma, Farbfilter, Kombinator, Blocker ---------- */

/** Geschliffenes Glas ohne Transmission (zu teuer, siehe Edelstein); tiefen-neutral, damit Strahlen im Glas sichtbar bleiben. */
function makeGlassMaterial(color, opts = {}) {
  return new THREE.MeshPhysicalMaterial(Object.assign({
    color, metalness: 0, roughness: 0.03, ior: 1.5, specularIntensity: 1,
    transparent: true, opacity: 0.42, depthWrite: false,
    clearcoat: 1, clearcoatRoughness: 0.02,
    iridescence: 0.7, iridescenceIOR: 1.35, iridescenceThicknessRange: [120, 700],
    flatShading: true, envMapIntensity: 2.2,
  }, opts));
}

/** Feine, helle Glaskanten: lassen den Schliff auch vor dunklem Grund erkennen. */
function glassEdges(geometry, opacity = 0.28) {
  const lines = new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry, 20),
    new THREE.LineBasicMaterial({ color: 0xdfe6ff, transparent: true, opacity, depthWrite: false })
  );
  lines.renderOrder = 6; // nach dem Glas (renderOrder 5), sonst deckt es die Kanten ab
  lines.raycast = () => {};
  return lines;
}

/** Weicher Regenbogenverlauf (für das Spektralfenster des Prismas). */
function createSpectrumTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 32;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 256, 0);
  ['#ff2a1e', '#ffb21e', '#f4ff3a', '#30ff6a', '#2ad8ff', '#3a5bff', '#a43aff'].forEach((col, i, a) => g.addColorStop(i / (a.length - 1), col));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 32);
  // vertikal weich ausblenden
  const v = ctx.createLinearGradient(0, 0, 0, 32);
  v.addColorStop(0, 'rgba(0,0,0,1)'); v.addColorStop(0.5, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, 256, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
const spectrumTexture = createSpectrumTexture();

/** Leuchtzustand eines Elements weich nachführen: aktiv, sobald die Strahlfront es erreicht. */
function activeColorOf(u) {
  let color = 0;
  for (const r of u.events || []) if (beamView.revealed(r, r.worldDist)) color |= r.ev.color;

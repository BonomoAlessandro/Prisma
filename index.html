        atm = vec3(0.9, 0.8, 0.7) * 0.15;
      } else if (uKind == 5) {
        col = bands(p, 7.0, 0.8, vec3(0.74, 0.62, 0.42), vec3(0.93, 0.85, 0.64));
        atm = vec3(0.9, 0.8, 0.6) * 0.12;
      } else if (uKind == 6) {
        col = mix(vec3(0.52, 0.76, 0.80), vec3(0.62, 0.84, 0.86), 0.5 + 0.5 * sin(p.y * 10.0));
        atm = vec3(0.5, 0.85, 0.9) * 0.3;
      } else {
        col = bands(p, 8.0, 1.0, vec3(0.13, 0.24, 0.64), vec3(0.24, 0.42, 0.88));
        vec3 d = p - normalize(vec3(-0.6, -0.35, 0.7)); // dunkler Fleck
        col = mix(col, vec3(0.06, 0.10, 0.35), 0.8 * exp(-dot(d, d) / 0.01));
        atm = vec3(0.35, 0.55, 1.0) * 0.35;
      }
      vec3 N = normalize(vN), L = normalize(uSun - vPos), V = normalize(cameraPosition - vPos);
      float ndl = dot(N, L);
      float lit = clamp(ndl * 0.92 + 0.08, 0.0, 1.0); // etwas weicher Übergang zur Nachtseite
      float rim = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.5) * smoothstep(-0.25, 0.4, ndl);
      gl_FragColor = vec4((col * (0.02 + 1.15 * lit) + atm * rim) * uFade, 1.0);
    }`,
};

const solar = (() => {
  const group = new THREE.Group();
  group.visible = false;
  const noPick = (o) => { o.layers.set(LAYER_NO_REFLECT); o.raycast = () => {}; o.frustumCulled = o.isMesh; return o; };

  // Sonne: brodelnde Oberfläche, zum Rand dunkler; hell genug für Bloom, liegt aber fast ganz hinter der Platte
  const sun = noPick(new THREE.Mesh(new THREE.SphereGeometry(SOLAR.sunRadius, 48, 32), new THREE.ShaderMaterial({
    uniforms: solarUniforms, fog: false,
    vertexShader: PLANET_SHADER.vertexShader,
    fragmentShader: `uniform float uFade, uTime;
      varying vec3 vObj, vN, vPos;
      ${GLSL_NOISE}
      void main() {
        vec3 p = normalize(vObj);
        float g = fbm(p * 6.0 + vec3(0.0, uTime * 0.04, 0.0));
        float mu = clamp(dot(normalize(vN), normalize(cameraPosition - vPos)), 0.0, 1.0);
        vec3 col = mix(vec3(1.0, 0.42, 0.10), vec3(1.0, 0.82, 0.50), g) * (1.3 + 1.3 * g) * (0.45 + 0.55 * sqrt(mu));
        gl_FragColor = vec4(col * uFade, 1.0);
      }`,
  })));
  sun.position.copy(solarUniforms.uSun.value);
  group.add(sun);

  // Korona: Leuchten um die Sonne, das rund um die Platte hervorscheint (Billboard, additiv, Alpha bleibt 0 = Himmel)
  const CORONA = 17; // halbe Breite des Billboards
  const corona = noPick(new THREE.Mesh(new THREE.PlaneGeometry(2 * CORONA, 2 * CORONA), new THREE.ShaderMaterial({
    uniforms: { ...solarUniforms, uRadius: { value: SOLAR.sunRadius / CORONA } },
    transparent: true, depthWrite: false, fog: false,
    blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float uFade, uTime, uRadius;
      varying vec2 vUv;
      ${GLSL_NOISE}
      void main() {
        vec2 c = vUv * 2.0 - 1.0;
        float r = length(c), x = max(r - uRadius, 0.0);
        float rays = 0.8 + 0.4 * noise(vec3(atan(c.y, c.x) * 3.0, r * 2.0 - uTime * 0.05, uTime * 0.03));
        float glow = (exp(-x * 10.0) * 0.9 + exp(-x * 4.5) * 0.12 * rays) * smoothstep(1.0, 0.6, r);
        gl_FragColor = vec4(vec3(1.0, 0.52, 0.2) * glow * uFade, 0.0);
      }`,
  })));
  corona.renderOrder = -98; // nach den Sternen
  group.add(corona);
  const coronaRay = new THREE.Vector3();

  const sphere = new THREE.SphereGeometry(1, 48, 32);
  const planetMaterial = (kind) => new THREE.ShaderMaterial({
    uniforms: { ...solarUniforms, uKind: { value: kind } }, fog: false, ...PLANET_SHADER,
  });
  const orbitY = (r) => -1.5 - SOLAR.slope * (r - 7.6);
  const deg = THREE.MathUtils.degToRad;
  const orbitPos = (pl, a, target) => target.set(pl.orbit * Math.cos(a),
    orbitY(pl.orbit) + pl.orbit * Math.sin(deg(pl.incl)) * Math.sin(a - pl.node), -pl.orbit * Math.sin(a));

  const lineMat = new THREE.LineBasicMaterial({
    color: 0x8890b0, transparent: true, opacity: 0, depthWrite: false, fog: false,
    blending: THREE.CustomBlending, blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneFactor,
    blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  });
  const planets = SOLAR.planets.map((cfg, i) => {
    const pl = { ...cfg, node: i * 1.3, rate: 2 * Math.PI / (SOLAR.mercuryPeriod * Math.sqrt(cfg.years / 0.24)) };
    pl.holder = new THREE.Group(); // läuft auf der Bahn
    const tilt = new THREE.Group();
    tilt.rotation.z = deg(cfg.tilt);
    pl.body = noPick(new THREE.Mesh(sphere, planetMaterial(cfg.kind)));
    pl.body.scale.setScalar(cfg.size);
    tilt.add(pl.body);
    if (cfg.ring) tilt.add(pl.ring = makeRing(cfg.size));
    pl.holder.add(tilt);
    group.add(pl.holder);
    // feine Bahnlinie
    const pts = [];
    for (let k = 0; k < 160; k++) pts.push(orbitPos(pl, k / 160 * 2 * Math.PI, new THREE.Vector3()));
    group.add(noPick(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), lineMat)));
    return pl;
  });
  const earth = planets.find((p) => p.kind === 2);
  const moon = noPick(new THREE.Mesh(sphere, planetMaterial(0)));
  moon.scale.setScalar(SOLAR.moon.size);
  earth.holder.add(moon);

  /** Saturnring: Ringe mit Lücken (Cassini-Teilung), von der Sonne beleuchtet, mit dem Schatten des Planeten. */
  function makeRing(size) {
    const inner = size * 1.25, outer = size * 2.25;
    const mesh = noPick(new THREE.Mesh(new THREE.RingGeometry(inner, outer, 128, 1), new THREE.ShaderMaterial({
      uniforms: { ...solarUniforms, uCenter: { value: new THREE.Vector3() }, uPlanet: { value: size },
        uInner: { value: inner }, uOuter: { value: outer } },
      transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
      vertexShader: `varying vec3 vLocal, vPos, vN;
        void main() {
          vLocal = position;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vPos = wp.xyz;
          vN = normalize(mat3(modelMatrix) * vec3(0.0, 0.0, 1.0));
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `uniform vec3 uSun, uCenter;
        uniform float uFade, uPlanet, uInner, uOuter;
        varying vec3 vLocal, vPos, vN;
        void main() {
          float u = (length(vLocal.xy) - uInner) / (uOuter - uInner);
          float dens = (0.55 + 0.25 * sin(u * 47.0) + 0.2 * sin(u * 113.0 + 1.0)) * smoothstep(0.0, 0.06, u) * smoothstep(1.0, 0.9, u);
          dens *= 1.0 - 0.9 * smoothstep(0.62, 0.64, u) * smoothstep(0.70, 0.68, u); // Cassini-Teilung
          vec3 L = normalize(uSun - vPos);
          vec3 cp = uCenter - vPos;
          float t = dot(cp, L);
          float shade = (t > 0.0 && dot(cp, cp) - t * t < uPlanet * uPlanet) ? 0.12 : 1.0; // Schatten des Planeten
          vec3 col = mix(vec3(0.62, 0.54, 0.40), vec3(0.92, 0.85, 0.68), u) * (0.25 + 0.85 * abs(dot(normalize(vN), L))) * shade;
          gl_FragColor = vec4(col * uFade, dens * 0.9 * uFade);
        }`,
    })));
    mesh.rotation.x = -Math.PI / 2; // in die Äquatorebene
    return mesh;
  }

  return {
    group, corona, planets, lineMat,
    update(t) {
      solarUniforms.uTime.value = t;
      // Korona hinter die Platte schieben und im selben Mass vergrössern (gleich gross im Bild): Durch die
      // Sonnenmitte schnitte sie die Platte, ihr Leuchten läge dann auf deren hinterem Teil.
      coronaRay.subVectors(sun.position, camera.position);
      const dist = coronaRay.length(), push = 12;
      corona.position.copy(sun.position).addScaledVector(coronaRay, push / dist);
      corona.scale.setScalar((dist + push) / dist);
      corona.quaternion.copy(camera.quaternion);
      for (const pl of planets) {
        orbitPos(pl, deg(pl.phase) + pl.rate * t, pl.holder.position);
        pl.body.rotation.y = 2 * Math.PI * t / pl.spin;
        if (pl.ring) pl.body.getWorldPosition(pl.ring.material.uniforms.uCenter.value);
      }
      const m = 2 * Math.PI * t / SOLAR.moon.period;
      moon.position.set(Math.cos(m) * SOLAR.moon.distance, 0.12 * Math.sin(m), -Math.sin(m) * SOLAR.moon.distance);
    },
  };
})();
scene.add(solar.group);

/* =====================================================================
   WALD — dritter Hintergrund: nächtliche Berglandschaft mit Nadelwald (umschaltbar, siehe skyTheme)
   Das Brett schwebt über einer bewaldeten Kuppe; von dort fällt das Gelände in Kämme und Täler ab. Ein Nebelmeer
   füllt die Täler, die Kämme ragen heraus, und jede Schicht dahinter verblasst im Dunst (Luftperspektive) – so sehen
   neblige Nadelwälder von oben auf Fotos aus. Auf flacher Ebene wirkte der Wald wie ein Muster, egal wie gut der
   einzelne Baum war. Bäume als geschlossene Silhouetten: Ausgestanzte Astflächen mit Nadeltextur wurden ohne
   Kantenglättung (MSAA) pixelig und unruhig.
   Bäume und Gelände bleiben in der Nähe unter der Brettebene; weiter draussen als die Kamera fährt, könnten sie
   ohnehin nicht zwischen Kamera und Spielfeld kommen. Alles berechnet, ohne Bilddateien; nicht in der Bodenspiegelung.
   ===================================================================== */

// Gelände von Wald und Strand: Wertrauschen liegt auf einem Gitter und bildet achsparallele, eckige Formen; darum
// jede Stufe gedreht.
function valueNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), u = x - xi, v = z - zi;
  const h = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  const su = u * u * u * (u * (u * 6 - 15) + 10), sv = v * v * v * (v * (v * 6 - 15) + 10);
  return (h(xi, zi) * (1 - su) + h(xi + 1, zi) * su) * (1 - sv) + (h(xi, zi + 1) * (1 - su) + h(xi + 1, zi + 1) * su) * sv;
}
function smoothNoise(x, z, octaves = 4) { // 0 … 1, ohne Vorzugsrichtung
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    const c = Math.cos(0.7 + i * 1.1), sn = Math.sin(0.7 + i * 1.1);
    s += a * valueNoise((x * c - z * sn) * f + i * 17.3, (x * sn + z * c) * f - i * 9.1);
    norm += a; a *= 0.5; f *= 2.03;
  }
  return s / norm;
}

/* =====================================================================
   IMPOSTOR-FICHTE — für den Wald: eine detaillierte Fichte (Stamm, Astquirle, Zweige mit Nadelbüscheln) wird beim
   Bauen einmal aus 64 Blickwinkeln in eine Bildtafel gerendert (Farbe; Normale und Tiefe). Jeder Baum ist dann nur
   eine zur Kamera gedrehte Fläche, die die vier nächsten Ansichten überblendet und wie ein Körper beleuchtet wird
   (Normalen, Tiefe für Schatten und Überschneidungen). So machen es Spiele für grosse Wälder; tausende Bäume aus
   Geometrie wären zu teuer, aus einfachen Kegeln zu grob (die Etagen wirkten wie Weihnachtsbäume).
   ===================================================================== */

const IMPOSTOR = {
  yaw: 16, elev: 4,          // Blickwinkel: 16 Richtungen rundum × 4 Höhen
  elevMin: 10, elevMax: 70,  // Höhen der Ansichten (Grad über dem Horizont): so steil, wie die Kamera schaut
  cols: 8,                   // Tafel 8 × 8 Ansichten
  frame: IS_MOBILE ? 128 : 256, // Pixel je Ansicht
  half: 0.56,                // halbe Kantenlänge einer Ansicht (Baumhöhe 1, Mitte auf halber Höhe)
  halfWidth: 0.3,            // halbe Breite der Fläche: so weit reichen Krone und Zweige seitlich
};

/**
 * Fichte, Höhe 1, Fuss im Ursprung: Stamm, 26 Astquirle mit 5–7 Ästen, jeder Ast mit beidseits schräg nach vorn und
 * unten hängenden Zweigen (Nadelbüschel als schmale Dreiecke), unten hängend, oben aufstrebend; ein Leittrieb. Normalen
 * wie bei einem Volumen (halb vom Stamm weg, halb nach oben): Die Krone wird weich beleuchtet statt facettiert. In den
 * Farben steckt die Verdeckung: innen am Stamm und unten dunkel, an den Zweigspitzen heller (junge Triebe).
 */
function createSpruceGeometry(seed) {
  const rand = mulberry32(seed);
  const pos = [], nor = [], col = [];
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const crown = (y) => (y < 0.12 ? 0.02 : 0.2 * Math.pow(Math.max(1 - y, 0), 0.9)); // Radius der Krone auf Höhe y
  const foliage = (p, tip, tint) => {
    const rad = Math.hypot(p.x, p.z), q = Math.min(rad / Math.max(crown(p.y), 0.02), 1);
    const n = rad > 1e-4 ? V(p.x / rad, 0.55, p.z / rad).normalize() : V(0, 1, 0);
    const ao = (0.22 + 0.78 * Math.pow(q, 0.8)) * (0.65 + 0.35 * Math.min(p.y / 0.55, 1));
    const c = [0.066 + 0.012 * tint, 0.08 + 0.016 * tint, 0.074 + 0.01 * tint].map((v) => v * ao * (1 + 0.45 * tip));
    return [n, c];
  };
  const tri = (a, b, c, ta, tb, tc, tint) => {
    for (const [p, t] of [[a, ta], [b, tb], [c, tc]]) {
      const [n, cl] = foliage(p, t, tint);
      pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z); col.push(...cl);
    }
  };
  // Stamm: unten sichtbar zwischen den hängenden Ästen
  for (let k = 0; k < 6; k++) {
    const a0 = k / 6 * 2 * Math.PI, a1 = (k + 1) / 6 * 2 * Math.PI;
    const ring = (a, y) => V(Math.cos(a) * 0.02 * (1 - 0.8 * y), y, Math.sin(a) * 0.02 * (1 - 0.8 * y));
    const quad = [ring(a0, 0), ring(a1, 0), ring(a1, 0.95), ring(a0, 0), ring(a1, 0.95), ring(a0, 0.95)];
    for (const p of quad) {
      const n = V(p.x, 0, p.z).normalize();
      pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z); col.push(0.05, 0.042, 0.036);
    }
  }
  // Leittrieb
  for (let k = 0; k < 5; k++) {
    const a0 = k / 5 * 2 * Math.PI, a1 = (k + 1) / 5 * 2 * Math.PI;
    tri(V(0, 1, 0), V(Math.cos(a0) * 0.018, 0.9, Math.sin(a0) * 0.018), V(Math.cos(a1) * 0.018, 0.9, Math.sin(a1) * 0.018), 1, 0.5, 0.5, 0.5);
  }
  // Astquirle
  const W = 26;
  for (let w = 0; w < W; w++) {
    const t = w / (W - 1), y = 0.13 + 0.8 * t + (rand() - 0.5) * 0.012; // t: 0 unten … 1 oben
    const nb = 5 + Math.floor(rand() * 3), az0 = rand() * 2 * Math.PI;
    for (let b = 0; b < nb; b++) {
      for (let layer = 0; layer < 2; layer++) { // zweite Lage etwas tiefer und kürzer: Masse auch von der Seite
        const az = az0 + (b + (rand() - 0.5) * 0.5 + layer * 0.5) / nb * 2 * Math.PI;
        const L = (crown(y) * (0.8 + 0.35 * rand()) + 0.012) * (layer ? 0.8 : 1);
        const pitch = THREE.MathUtils.lerp(-0.25, 0.45, t) + (rand() - 0.5) * 0.2 - layer * 0.15;
        const droop = THREE.MathUtils.lerp(0.55, 0.1, t);
        const dir = V(Math.cos(az), 0, Math.sin(az)), side = V(-Math.sin(az), 0, Math.cos(az));
        const spine = (u) => dir.clone().multiplyScalar(L * u * Math.cos(pitch)).add(V(0, y - layer * 0.012 + L * u * Math.sin(pitch) - droop * L * u * u, 0));
        const tint = rand();
        const K = 13;
        for (let k = 1; k <= K; k++) {
          const u = k / (K + 0.5), p0 = spine(u), tan = spine(u + 0.04).sub(p0).normalize();
          for (const s of [-1, 1]) {
            const tl = L * 0.36 * (1 - 0.65 * u) * (0.65 + 0.7 * rand());
            const td = tan.clone().multiplyScalar(0.65).addScaledVector(side, s * 0.8).add(V(0, -0.3 - 0.3 * rand(), 0)).normalize();
            const p1 = p0.clone().addScaledVector(td, tl), pm = p0.clone().addScaledVector(td, tl * 0.5);
            // Büschel: schmal, in der Mitte am breitesten
            tri(p0.clone().addScaledVector(tan, -0.03 * L), pm.clone().addScaledVector(tan, 0.05 * L), p1, 0.2, 0.6, 1, tint);
            tri(p0.clone().addScaledVector(tan, -0.03 * L), pm.clone().addScaledVector(tan, -0.045 * L), p1, 0.2, 0.6, 1, tint);
            // Seitentrieb nach vorn
            if (rand() < 0.6) {
              const q = pm.clone().addScaledVector(tan, tl * 0.35).add(V(0, -0.15 * tl, 0));
              tri(pm, pm.clone().addScaledVector(td, tl * 0.15), q, 0.5, 0.6, 1, tint);
            }
          }
        }
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return geo;
}

/** Rendert die Fichte aus allen Blickwinkeln in zwei Tafeln: Farbe (Wurzel, für mehr Genauigkeit im Dunkeln) mit
 *  Deckung; Normale (Baumsystem) und Tiefe entlang der Blickrichtung. */
function bakeImpostor(geo) {
  const { yaw, elev, cols, frame, half, halfWidth } = IMPOSTOR, size = cols * frame;
  // waagrecht nur so breit wie die Krone gerahmt: doppelte Auflösung, wo die Zweige sind
  const scene = new THREE.Scene(), cam = new THREE.OrthographicCamera(-halfWidth, halfWidth, half, -half, 0.01, 10);
  const mesh = new THREE.Mesh(geo);
  scene.add(mesh);
  const uFwd = { value: new THREE.Vector3() };
  const vertexShader = `varying vec3 vN, vC, vP;
    void main() { vN = normal; vC = color; vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  const passes = [
    `varying vec3 vN, vC, vP; void main() { gl_FragColor = vec4(sqrt(vC), 1.0); }`,
    `uniform vec3 uFwd; varying vec3 vN, vC, vP;
      void main() { gl_FragColor = vec4(normalize(vN) * 0.5 + 0.5, dot(vP - vec3(0.0, 0.5, 0.0), uFwd) / ${(2 * half).toFixed(3)} + 0.5); }`,
  ].map((fragmentShader) => new THREE.ShaderMaterial({ vertexShader, fragmentShader, vertexColors: true, side: THREE.DoubleSide, uniforms: { uFwd } }));
  const targets = passes.map(() => {
    const t = new THREE.WebGLRenderTarget(size, size, { minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
    t.texture.generateMipmaps = false; // erst beim letzten Bild (sonst nach jeder Ansicht neu)
    return t;
  });
  const center = new THREE.Vector3(0, 0.5, 0);
  const bake = () => {
  const clearColor = renderer.getClearColor(new THREE.Color()), clearAlpha = renderer.getClearAlpha(), autoClear = renderer.autoClear;
  renderer.autoClear = false;
  renderer.setClearColor(0x000000, 0);
  passes.forEach((material, pi) => {
    const target = targets[pi];
    mesh.material = material;
    target.viewport.set(0, 0, size, size); target.scissor.set(0, 0, size, size); target.scissorTest = false;
    renderer.setRenderTarget(target);
    renderer.clear();
    target.scissorTest = true;
    for (let j = 0; j < elev; j++) {
      const e = THREE.MathUtils.degToRad(THREE.MathUtils.lerp(IMPOSTOR.elevMin, IMPOSTOR.elevMax, j / (elev - 1)));
      for (let i = 0; i < yaw; i++) {
        const a = i / yaw * 2 * Math.PI, k = j * yaw + i;
        uFwd.value.set(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
        cam.position.copy(center).addScaledVector(uFwd.value, 3);
        cam.lookAt(center);
        const x = (k % cols) * frame, y = Math.floor(k / cols) * frame;
        target.viewport.set(x, y, frame, frame); target.scissor.set(x, y, frame, frame);
        if (k === yaw * elev - 1) target.texture.generateMipmaps = true;
        renderer.setRenderTarget(target);
        renderer.render(scene, cam);
      }
    }
    target.scissorTest = false;
    target.viewport.set(0, 0, size, size);
  });
  renderer.setRenderTarget(null);
  renderer.autoClear = autoClear;
  renderer.setClearColor(clearColor, clearAlpha);
  };
  bake();
  // Nach einem verlorenen Grafikkontext sind die Tafeln leer – alle Bäume verschwänden. Neu backen (vor der
  // Schattenkarte, die danach neu gezeichnet wird: die Listener laufen in der Reihenfolge der Anmeldung)
  renderer.domElement.addEventListener('webglcontextrestored', () => {
    targets.forEach((t) => { t.texture.generateMipmaps = false; });
    bake();
  });
  return { albedo: targets[0].texture, normal: targets[1].texture };
}

// Fläche eines Baums (PlaneGeometry 1×1, Instanz: Fuss, Drehung um die Hochachse, Grösse): zum Betrachter gedreht
// (Kamera oder Mond); wählt die vier nächsten Ansichten und reicht sie an den Fragment-Shader weiter.
const IMPOSTOR_VERTEX = `
  varying vec4 vObj;    // Punkt auf der Fläche im Baumsystem (relativ zur Mitte), w: Höhe des Baums
  varying vec4 vWorld;  // Punkt in der Welt, w: Zufall je Baum
  varying vec4 vYawW;   // cos, sin der Drehung; Gewichte zwischen den Ansichten
  varying vec4 vA, vE;  // cos, sin der beiden Richtungen und der beiden Höhen
  varying vec4 vCell;   // Nummern der vier Ansichten
  vec4 impostorPlace(vec3 toViewer, bool isDirection) {
    vec3 foot = instanceMatrix[3].xyz;
    float sx = length(instanceMatrix[0].xyz), sy = length(instanceMatrix[1].xyz);
    float c = instanceMatrix[0].x / sx, s = -instanceMatrix[0].z / sx;
    vec3 scale = vec3(sx, sy, sx), center = foot + vec3(0.0, 0.5 * sy, 0.0);
    vec3 d = isDirection ? toViewer : normalize(toViewer - center);
    vec3 dl = vec3(c * d.x - s * d.z, d.y, s * d.x + c * d.z);         // ins Baumsystem drehen …
    dl = normalize(dl / scale);                                      // … und entzerren
    vec3 right = normalize(vec3(dl.z, 0.0, -dl.x)), up = cross(dl, right);
    // (seitlich nur so breit wie die Krone: die leeren Ränder kosteten trotzdem Texturzugriffe)
    vec3 p = right * position.x * ${(2 * IMPOSTOR.halfWidth).toFixed(3)} + up * position.y * ${(2 * IMPOSTOR.half).toFixed(3)};
    vec3 q = p * scale;
    vec3 wp = center + vec3(c * q.x + s * q.z, q.y, -s * q.x + c * q.z);
    // Ansichten: Richtung rundum und Höhe; die vier nächsten mit Gewichten
    float fi = mod(atan(dl.x, dl.z) / 6.28319 * ${IMPOSTOR.yaw.toFixed(1)} + ${IMPOSTOR.yaw.toFixed(1)}, ${IMPOSTOR.yaw.toFixed(1)});
    float el = degrees(asin(clamp(dl.y, -1.0, 1.0)));
    float fj = clamp((el - ${IMPOSTOR.elevMin.toFixed(1)}) / ${((IMPOSTOR.elevMax - IMPOSTOR.elevMin) / (IMPOSTOR.elev - 1)).toFixed(3)}, 0.0, ${(IMPOSTOR.elev - 1).toFixed(1)});
    float i0 = floor(fi), i1 = mod(i0 + 1.0, ${IMPOSTOR.yaw.toFixed(1)}), j0 = min(floor(fj), ${(IMPOSTOR.elev - 2).toFixed(1)}), j1 = j0 + 1.0;
    vYawW = vec4(c, s, fi - i0, fj - j0);
    float a0 = i0 / ${IMPOSTOR.yaw.toFixed(1)} * 6.28319, a1 = i1 / ${IMPOSTOR.yaw.toFixed(1)} * 6.28319;
    float e0 = radians(${IMPOSTOR.elevMin.toFixed(1)} + j0 * ${((IMPOSTOR.elevMax - IMPOSTOR.elevMin) / (IMPOSTOR.elev - 1)).toFixed(3)});
    float e1 = radians(${IMPOSTOR.elevMin.toFixed(1)} + j1 * ${((IMPOSTOR.elevMax - IMPOSTOR.elevMin) / (IMPOSTOR.elev - 1)).toFixed(3)});
    vA = vec4(cos(a0), sin(a0), cos(a1), sin(a1));
    vE = vec4(cos(e0), sin(e0), cos(e1), sin(e1));
    vCell = vec4(j0 * ${IMPOSTOR.yaw.toFixed(1)} + i0, j0 * ${IMPOSTOR.yaw.toFixed(1)} + i1, j1 * ${IMPOSTOR.yaw.toFixed(1)} + i0, j1 * ${IMPOSTOR.yaw.toFixed(1)} + i1);
    vObj = vec4(p, sy);
    vWorld = vec4(wp, fract(sin(dot(foot.xz, vec2(12.9898, 78.233))) * 43758.5453));
    return vec4(wp, 1.0);
  }`;

// Ansichten abtasten und überblenden: Deckung, Farbe (zurück aus der Wurzel), Normale (Baumsystem), Tiefe
const IMPOSTOR_FRAGMENT = `
  uniform sampler2D uImpAlbedo, uImpNormal;
  varying vec4 vObj, vWorld, vYawW, vA, vE, vCell;
  vec2 impostorUV(float cell, vec2 a, vec2 e) {
    // Nummer der Ansicht runden: Interpoliert kam statt 15 manchmal 14,99999 an – eine kleine Bewegung der Kamera
    // genügte, und der Baum zeigte eine falsche Ansicht (ganze Bäume flackerten)
    cell = floor(cell + 0.5);
    vec3 right = vec3(a.x, 0.0, -a.y), up = vec3(-a.y * e.y, e.x, -a.x * e.y);
    vec2 uv = vec2(dot(vObj.xyz, right) / ${(2 * IMPOSTOR.halfWidth).toFixed(3)}, dot(vObj.xyz, up) / ${(2 * IMPOSTOR.half).toFixed(3)}) + 0.5;
    uv = clamp(uv, 0.002, 0.998);
    return (vec2(mod(cell, ${IMPOSTOR.cols.toFixed(1)}), floor(cell / ${IMPOSTOR.cols.toFixed(1)})) + uv) / ${IMPOSTOR.cols.toFixed(1)};
  }
  // Schwelle der Deckung: in der Ferne tiefer (dort ist sie in den kleinen Mipmaps gemittelt, die Bäume dünnten aus)
  float impostorCut(float dist) { return mix(0.5, 0.32, smoothstep(25.0, 65.0, dist)); }
  // Deckung (Rückgabe) und, wenn full, Farbe, Normale und Tiefe
  float impostorSample(bool full, out vec3 albedo, out vec3 normal, out float depth) {
    // Alle Abrufe vor jeder Verzweigung: Innerhalb verzweigten Programmflusses ist die Wahl der Mipmap-Stufe nicht
    // definiert – Normale und Tiefe sprangen dann von Pixel zu Pixel, Licht, Schatten und Nebel der Bäume flackerten
    vec2 uv0 = impostorUV(vCell.x, vA.xy, vE.xy), uv1 = impostorUV(vCell.y, vA.zw, vE.xy);
    vec2 uv2 = impostorUV(vCell.z, vA.xy, vE.zw), uv3 = impostorUV(vCell.w, vA.zw, vE.zw);
    vec4 w = vec4((1.0 - vYawW.z) * (1.0 - vYawW.w), vYawW.z * (1.0 - vYawW.w), (1.0 - vYawW.z) * vYawW.w, vYawW.z * vYawW.w);
    vec4 c = texture2D(uImpAlbedo, uv0) * w.x + texture2D(uImpAlbedo, uv1) * w.y + texture2D(uImpAlbedo, uv2) * w.z + texture2D(uImpAlbedo, uv3) * w.w;
    albedo = vec3(0.0); normal = vec3(0.0, 1.0, 0.0); depth = 0.0;
    if (!full) return c.a;
    // Deckung fürs Bild eine Stufe weicher (Mipmap-Bias): pixelfeine Lücken zwischen den Zweigen schalteten sonst bei
    // jeder kleinen Bewegung der Kamera zwischen Zweig und hellem Nebel dahinter
    vec4 b = texture2D(uImpAlbedo, uv0, 0.3) * w.x + texture2D(uImpAlbedo, uv1, 0.3) * w.y + texture2D(uImpAlbedo, uv2, 0.3) * w.z + texture2D(uImpAlbedo, uv3, 0.3) * w.w;
    vec4 nd = texture2D(uImpNormal, uv0, 0.3) * w.x + texture2D(uImpNormal, uv1, 0.3) * w.y + texture2D(uImpNormal, uv2, 0.3) * w.z + texture2D(uImpNormal, uv3, 0.3) * w.w;
    if (b.a < 0.01) return b.a;
    // Farbe scharf, wo die scharfe Deckung reicht, am Rand eines Lochs aus der weichen Stufe. Normale und Tiefe aus der
    // weichen Stufe (wie Farbe und Deckung vormultipliziert): ruhiger, für Licht, Schatten und Nebel genügt das
    vec3 rgb = c.a > 0.05 ? c.rgb / c.a : b.rgb / b.a;
    albedo = rgb * rgb;
    nd /= b.a;
    vec3 n = nd.xyz * 2.0 - 1.0;
    normal = normalize(vec3(vYawW.x * n.x + vYawW.y * n.z, n.y, -vYawW.y * n.x + vYawW.x * n.z));
    depth = (nd.w - 0.5) * ${(2 * IMPOSTOR.half).toFixed(3)} * vObj.w; // zum Betrachter hin positiv, in Welteinheiten
    return b.a;
  }`;

const FOREST = {
  top: -10,             // Höhe der Kuppe unter dem Brett
  fall: 0.32,           // so stark sinkt das Gelände nach aussen: der Blick geht über die nahen Wipfel in die Tiefe
  relief: 20,           // Höhe der Kämme gegenüber den Tälern
  fogY: -15.5,          // Oberfläche des Nebelmeers: füllt die Täler schon nahe am Brett, die Kämme ragen heraus
  size: [2.6, 4.6],     // Baumhöhe (junge Bäume kleiner, siehe Standorte)
  tipMax: -1.5,         // höchste Baumspitze (unter der Brettebene)
  inner: 4.5, outer: 82, // Bereich der Bäume (unter der Platte sieht man sie ohnehin nicht)
  spacing: (r) => 1.3 + 0.02 * r, // Abstand der Bäume, nach aussen etwas lichter (dort deckt der Dunst)
  fireflies: 45,
  shadowSize: 2048,     // Schattenkarte des Mondes (Pixel je Seite)
};

const forestUniforms = {
  uFade: { value: 0 },
  uTime: { value: 0 },
  uNoise: { value: null },  // kachelbares Rauschen (createWaveTexture, Kanal A), beim Bauen
  uShadow: { value: null }, // Schattenkarte des Mondes (beim Bauen)
  uShadowMat: { value: new THREE.Matrix4() },
};

// Für Gelände, Bäume und Nebel: Nebelmeer und Dunst. Wo etwas knapp über dem Nebelmeer steht, geht es in dessen Farbe
// an derselben Stelle über (mit seinem Schatten) – sonst zeichnete sich der Rand ab. Ganz im Dunst, bevor die
// Himmelskugel (Radius 80) die Objekte überdeckt.
const FOREST_SCENE_GLSL = `
  uniform float uTime;
  uniform sampler2D uNoise;
  ${shadowGLSL(FOREST.shadowSize)}
  const float FOG_Y = ${FOREST.fogY.toFixed(2)};
  const vec3 MOON_COL = vec3(0.34, 0.37, 0.44); // Mondlicht, für das Auge in der Nacht bläulich
  const vec3 NIGHT_AMB = vec3(0.006, 0.009, 0.016); // Licht des Himmels
  // Oberfläche des Nebelmeers an xz: lange Schlieren, die langsam ziehen, und Wogen, vom Mond schräg beschienen;
  // im Schatten der Bäume und Kämme dunkler (shadow), aber nie schwarz – der Nebel leuchtet auch von innen
  vec3 fogSea(vec2 xz, vec3 viewDir, float shadow) {
    const vec2 F = vec2(0.94, 0.34); // Richtung, in der der Nebel zieht
    vec2 q = vec2(dot(xz, F), dot(xz, vec2(-F.y, F.x)));
    float streak = texture2D(uNoise, vec2(q.x * 0.010 - uTime * 0.0025, q.y * 0.045)).a;
    vec2 w = xz * 0.03 + vec2(uTime * 0.002, -uTime * 0.0013);
    float billow = texture2D(uNoise, w).a;
    float slope = billow - texture2D(uNoise, w - normalize(FOREST_MOON.xz) * 0.03).a; // zum Mond geneigt: heller
    float lit = 0.8 + 0.45 * (streak - 0.5) + 0.3 * (billow - 0.5) + 2.5 * slope;
    // Grundhelligkeit: der Mond beleuchtet die Oberfläche von oben (heller als der Dunst in der Luft); dazu, zum Mond
    // hin, die Vorwärtsstreuung wie im Dunst
    vec3 base = vec3(0.15, 0.163, 0.19) + (forestMist(viewDir) - forestMist(-vec3(FOREST_MOON.x, 0.0, FOREST_MOON.z))) * 1.1;
    return base * clamp(lit, 0.45, 1.3) * mix(0.62, 1.0, shadow);
  }
  // Anteil des Dunsts: nach der Entfernung vom Brett (die Kamera steht im Hochformat weiter weg – sonst läge dort alles
  // im Dunst), vor der Himmelskugel um die Kamera (Radius 80) ganz
  float forestHaze(vec3 pos, float dist) {
    return max(1.0 - exp(-max(length(pos.xz) - 14.0, 0.0) * 0.022), smoothstep(50.0, 78.0, dist));
  }
  // Dunst und Nebelmeer über einen Farbwert legen (pos: Weltpunkt, V: zur Kamera, dist: Abstand)
  vec3 mistify(vec3 col, vec3 pos, vec3 V, float dist) {
    ${VOLFOG_ON ? '' : `float low = smoothstep(FOG_Y + 2.6, FOG_Y - 0.2, pos.y);
    col = mix(col, fogSea(pos.xz, -V, objectShadowSoft(vec3(pos.x, max(pos.y, FOG_Y + 0.15), pos.z), 0.002, 4.0)), low); // (ohne Verzweigung: Mipmaps)`}
    return mix(col, forestMist(-V), forestHaze(pos, dist));
  }`;

const forest = (() => {
  const group = new THREE.Group();
  group.visible = false;
  const noPick = (o) => { o.layers.set(LAYER_NO_REFLECT); o.raycast = () => {}; o.frustumCulled = false; return o; };
  const ss = THREE.MathUtils.smoothstep;

  // Gelände: Kuppe unter dem Brett, nach aussen abfallend, mit Kämmen und Tälern (smoothNoise).
  const terrainHeight = (x, z) => {
    const r = Math.hypot(x, z);
    const relief = ss(r, 9, 24);
    const base = FOREST.top - FOREST.fall * Math.max(r - 9, 0) + relief * (smoothNoise(x * 0.03 + 3.1, z * 0.03 + 7.7) - 0.5) * FOREST.relief * 1.6;
    // kleinere Formen: Kuppen und Mulden, dazu Felsrippen (Grate des Rauschens) – auf der Kuppe unter dem Brett flacher
    const knolls = (smoothNoise(x * 0.11 + 13, z * 0.11 - 5, 3) - 0.5) * 2.2;
    const ribs = Math.pow(1 - Math.abs(2 * smoothNoise(x * 0.07 - 21, z * 0.07 + 9, 3) - 1), 3) * 1.6;
    return base + (knolls + ribs) * (0.35 + 0.65 * ss(r, 6, 16));
  };
  /** Steilheit des Geländes (0 flach … 1 senkrecht): dort tritt Fels hervor, dort stehen keine Bäume */
  const terrainSlope = (x, z) => {
    const dx = terrainHeight(x + 0.4, z) - terrainHeight(x - 0.4, z), dz = terrainHeight(x, z + 0.4) - terrainHeight(x, z - 0.4);
    return 1 - 0.8 / Math.hypot(dx, 0.8, dz);
  };

  function build() {
    forestUniforms.uNoise.value = createWaveTexture(256);
    const rand = mulberry32(77);

    const terrainUniforms = { ...forestUniforms, uGroundAO: { value: null } };
    const terrain = (() => {
      const geo = new THREE.PlaneGeometry(184, 184, 230, 230).rotateX(-Math.PI / 2);
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) p.setY(i, terrainHeight(p.getX(i), p.getZ(i)));
      geo.computeVertexNormals();
      const mesh = noPick(new THREE.Mesh(geo, new THREE.ShaderMaterial({
        uniforms: terrainUniforms, fog: false,
        vertexShader: `varying vec3 vPos, vN;
          void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vPos = wp.xyz; vN = normal; gl_Position = projectionMatrix * viewMatrix * wp; }`,
        fragmentShader: `uniform float uFade;
          uniform sampler2D uGroundAO;
          varying vec3 vPos, vN;
          ${FOREST_GLSL}
          ${FOREST_SCENE_GLSL}
          void main() {
            vec3 toCam = cameraPosition - vPos;
            float dist = length(toCam);
            vec3 Ng = normalize(vN);
            float slope = 1.0 - Ng.y;
            // feine Unebenheit (Wurzeln, Steine, Bodenwellen) aus der Wellentextur: im Streiflicht des Mondes sichtbar
            vec3 bump = texture2D(uNoise, vPos.xz * 0.45).rgb - 0.5, bump2 = texture2D(uNoise, vPos.xz * 1.7 + 0.3).rgb - 0.5;
            vec3 N = normalize(Ng + vec3(bump.x + 0.5 * bump2.x, 0.0, bump.y + 0.5 * bump2.y) * 0.9);
            // Waldboden: Nadelstreu (graubraun) mit Moosflecken; an steilen Stellen und auf Graten heller Fels mit Rissen
            float n = texture2D(uNoise, vPos.xz * 0.35).a, moss = texture2D(uNoise, vPos.xz * 0.06 + 0.4).a;
            vec3 alb = mix(vec3(0.06, 0.055, 0.048), vec3(0.09, 0.08, 0.065), n);
            alb = mix(alb, vec3(0.05, 0.075, 0.045) * (0.8 + 0.4 * n), smoothstep(0.45, 0.65, moss));
            float rock = smoothstep(0.3, 0.5, slope + 0.25 * (moss - 0.5));
            float crack = smoothstep(0.03, 0.0, abs(texture2D(uNoise, vPos.xz * vec2(0.6, 1.4) + 0.7).a - 0.5));
            alb = mix(alb, vec3(0.2, 0.2, 0.19) * (0.75 + 0.5 * n) * (1.0 - 0.6 * crack), rock);
            // Kontaktschatten: unter und zwischen den Bäumen dunkler (Dichte der Kronen, beim Bauen gerechnet)
            float ao = 1.0 - 0.75 * texture2D(uGroundAO, vPos.xz / 184.0 + 0.5).r;
            float moon = max(dot(N, FOREST_MOON), 0.0) * objectShadow(vPos + Ng * 0.25, 0.002);
            vec3 col = alb * (MOON_COL * moon * 1.3 * mix(1.0, ao, 0.5) + NIGHT_AMB * 3.0 * (0.4 + 0.6 * N.y) * ao);
            gl_FragColor = vec4(mistify(col, vPos, toCam / dist, dist) * uFade, 1.0);
          }`,
      })));
      mesh.renderOrder = 1; // nach Brett und Platte: was darunter liegt, verwirft der Tiefentest früh
      return mesh;
    })();
    group.add(terrain);

    // Ohne Tiefentexturen (kein volumetrischer Nebel) das flache Nebelmeer mit Schwaden
    if (!VOLFOG_ON) {
      // Nebelmeer: hell, wo der Mond es bescheint; Bäume und Kämme werfen Schatten darauf
      const fogMaterial = (lift, wisps) => new THREE.ShaderMaterial({
        uniforms: forestUniforms, fog: false, transparent: wisps, depthWrite: !wisps,
        vertexShader: `varying vec3 vPos;
          void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
        fragmentShader: `uniform float uFade;
          varying vec3 vPos;
          ${FOREST_GLSL}
          ${FOREST_SCENE_GLSL}
          void main() {
            vec3 toCam = cameraPosition - vPos;
            float dist = length(toCam);
            vec3 V = toCam / dist;
            float shadow = objectShadowSoft(vPos, 0.002, 4.0); // im Nebel weich: er streut das Licht
            vec3 col = fogSea(vPos.xz, -V, shadow) * ${(1 + lift).toFixed(2)};
            float far = forestHaze(vPos, dist);
            col = mix(col, forestMist(-V), far);
            ${wisps ? `// Schwaden knapp über dem Nebelmeer: ziehen über die tieferen Wipfel, die halb darin verschwinden
            vec2 q = vec2(dot(vPos.xz, vec2(0.94, 0.34)), dot(vPos.xz, vec2(-0.34, 0.94)));
            float a = texture2D(uNoise, vec2(q.x * 0.016 - uTime * 0.004, q.y * 0.045 + 0.3)).a;
            a = smoothstep(0.5, 0.78, a) * 0.6 * (1.0 - far);
            gl_FragColor = vec4(col, a * uFade); // (Farbe nicht auch noch mit uFade: sonst doppelt ausgeblendet)` : `gl_FragColor = vec4(col * uFade, 1.0);`}
          }`,
      });
      const fogSea = noPick(new THREE.Mesh(new THREE.CircleGeometry(100, 64), fogMaterial(0, false)));
      fogSea.rotation.x = -Math.PI / 2;
      fogSea.position.y = FOREST.fogY;
      fogSea.renderOrder = 2; // zuletzt: über den Kämmen bleibt wenig zu zeichnen
      group.add(fogSea);
      const wisps = noPick(new THREE.Mesh(new THREE.CircleGeometry(100, 64), fogMaterial(0.1, true)));
      wisps.rotation.x = -Math.PI / 2;
      wisps.position.y = FOREST.fogY + 1.6;
      wisps.renderOrder = 4;
      group.add(wisps);
    }

    // Standorte zufällig mit Mindestabstand zum Nachbarn (Poisson-Disk; in Ringen standen die Bäume in Reihen), nach
    // aussen lichter. Der Wald steht mal dichter, mal lichter in Gruppen, mit kleinen Lichtungen; die Kronen berühren
    // sich meist. Bäume ganz im Nebelmeer werden gar nicht erst gesetzt.
    const stand = (x, z) => smoothNoise(x * 0.08 + 40, z * 0.08 - 13, 2);
    const gap = (x, z) => smoothNoise(x * 0.12 - 21, z * 0.12 + 55, 2);
    const clumps = (x, z) => smoothNoise(x * 0.18 + 7, z * 0.18 - 31, 2);
    const spots = [], CELL = 2, cells = new Map();
    const cellKey = (i, j) => i * 4096 + j;
    for (let tries = 0; tries < 60000; tries++) {
      const r = Math.sqrt(FOREST.inner ** 2 + rand() * (FOREST.outer ** 2 - FOREST.inner ** 2)), a = rand() * 2 * Math.PI;
      const x = Math.cos(a) * r, z = Math.sin(a) * r, min = FOREST.spacing(r) * (0.6 + 0.4 * rand());
      if (rand() > ss(clumps(x, z), 0.15, 0.55)) continue; // Gruppen und lichte Stellen
      const ground = terrainHeight(x, z);
      if (ground + FOREST.size[1] < FOREST.fogY - (VOLFOG_ON ? 2 : 0.3)) continue; // ganz im Nebel (der volumetrische sinkt zwischen den Bänken tiefer)
      const ci = Math.floor(x / CELL), cj = Math.floor(z / CELL), reach = Math.ceil(min / CELL);
      let free = true;
      for (let i = ci - reach; i <= ci + reach && free; i++) {
        for (let j = cj - reach; j <= cj + reach && free; j++) {
          for (const [px, pz] of cells.get(cellKey(i, j)) || []) if ((px - x) ** 2 + (pz - z) ** 2 < min * min) { free = false; break; }
        }
      }
      if (!free || (gap(x, z) < 0.3 && rand() < 0.85)) continue; // zu nah oder Lichtung
      if (terrainSlope(x, z) > 0.42) continue; // Fels: keine Bäume
      spots.push([x, z, ground, r]);
      const k = cellKey(ci, cj);
      if (!cells.has(k)) cells.set(k, []);
      cells.get(k).push([x, z]);
    }

    // Bäume als Impostors (siehe IMPOSTOR): eine Fichte, aus allen Blickwinkeln vorgerendert. Abwechslung durch
    // Drehung, Grösse, schlank bis stämmig und Farbe je Baum. Die Tiefe aus der Tafel ergibt den Punkt auf dem Baum: für
    // Schatten und Dunst und als Tiefe im Bild – sonst schnitten sich die Flächen benachbarter Bäume in geraden Linien.
    const impostor = bakeImpostor(createSpruceGeometry(7));
    const treeUniforms = { ...forestUniforms, uImpAlbedo: { value: impostor.albedo }, uImpNormal: { value: impostor.normal } };
    const FRAG_DEPTH = renderer.capabilities.isWebGL2 || renderer.extensions.has('EXT_frag_depth');
    const treeMaterial = new THREE.ShaderMaterial({
      uniforms: treeUniforms, fog: false,
      extensions: { fragDepth: FRAG_DEPTH, derivatives: true },
      // Ränder weich (etwa ein Pixel, wie Kantenglättung): harte Ränder sprangen bei jeder kleinen Kamerabewegung –
      // die Bäume flackerten, im hellen Nebel besonders. Dafür wird gemischt und von hinten nach vorn gezeichnet (sortTrees).
      transparent: true,
      defines: FRAG_DEPTH ? { FRAG_DEPTH: '' } : {},
      vertexShader: `uniform float uTime;
        ${IMPOSTOR_VERTEX}
        void main() {
          vec4 wp = impostorPlace(cameraPosition, false);
          // Wind: Wipfel wiegen sich kaum merklich
          wp.xz += vec2(sin(uTime * 0.6 + vWorld.w * 40.0), cos(uTime * 0.47 + vWorld.w * 23.0)) * 0.025 * max(vObj.y + 0.5, 0.0) * vObj.w;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `uniform float uFade;
        uniform mat4 projectionMatrix; // (im Fragment-Shader nicht vorgegeben)
        ${FOREST_GLSL}
        ${FOREST_SCENE_GLSL}
        ${IMPOSTOR_FRAGMENT}
        void main() {
          vec3 albedo, N; float depth;
          float cover = impostorSample(true, albedo, N, depth);
          // weich durchscheinend statt hart gestanzt: Lücken zwischen den Zweigen wanderten bei jeder kleinen Bewegung um
          // Bruchteile eines Pixels und schalteten zwischen dunklem Zweig und hellem Nebel dahinter – sie flackerten
          float cut = impostorCut(length(cameraPosition - vWorld.xyz));
          float edge = smoothstep(cut - 0.12, cut + 0.1, cover + 0.5 * fwidth(cover));
          if (edge < 0.02 || cover < 0.3) discard;
          vec3 toCam0 = cameraPosition - vWorld.xyz;
          vec3 pos = vWorld.xyz + normalize(toCam0) * depth; // Punkt auf dem Baum
          vec3 toCam = cameraPosition - pos;
          float dist = length(toCam);
          vec3 V = toCam / dist;
          // Farbe je Baum: graugrün bis blaugrau
          albedo *= mix(vec3(0.92, 1.0, 0.95), vec3(1.0, 0.98, 1.12), vWorld.w) * (0.85 + 0.3 * fract(vWorld.w * 7.31));
          // Mond: weich wie Laub (halbe Lambert-Beleuchtung), im Schatten der Nachbarn und der eigenen Äste
          float shadow = objectShadow(pos + N * 0.08, 0.0015);
          float moon = clamp(dot(N, FOREST_MOON) * 0.6 + 0.4, 0.0, 1.0); moon *= moon * shadow;
          vec3 col = albedo * (MOON_COL * 2.1 * moon + NIGHT_AMB * (0.5 + 0.5 * N.y) * 4.0);
          // Gegenlicht: Steht der Mond hinter dem Baum, leuchten die Ränder der Krone
          float back = pow(max(dot(-V, FOREST_MOON), 0.0), 3.0) * pow(1.0 - abs(dot(N, V)), 2.0);
          col += MOON_COL * 0.15 * back * shadow;
          gl_FragColor = vec4(mistify(col, pos, V, dist) * uFade, edge);
          #ifdef FRAG_DEPTH
          vec4 clip = projectionMatrix * viewMatrix * vec4(pos, 1.0);
          gl_FragDepthEXT = clip.z / clip.w * 0.5 + 0.5;
          #endif
        }`,
    });

    // Grösse folgt dem Bestand, dazu Zufall, ein Teil jung und klein. Die Spitze bleibt unter der Brettebene.
    const trees = noPick(new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), treeMaterial, spots.length));
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3();
    spots.forEach(([x, z, ground], i) => {
      const young = rand() < 0.15 ? 0.4 + 0.25 * rand() : 1;
      let size = THREE.MathUtils.lerp(FOREST.size[0], FOREST.size[1], 0.5 * stand(x, z) + 0.5 * rand()) * young;
      size = Math.min(size, FOREST.tipMax - ground + 0.2); // +0.2: Fuss steckt etwas im Boden
      const girth = 0.8 + rand() * 0.4; // schlank bis stämmig
      e.set(0, rand() * 6.3, 0);
      m.compose(new THREE.Vector3(x, ground - 0.2, z), q.setFromEuler(e), sc.set(size * girth, size, size * girth));
      trees.setMatrixAt(i, m);
    });
    // Gemischt (weiche Ränder) liegen sie bei den durchsichtigen Objekten: vor den Effekten des Spiels (Höfe, Ringe,
    // Funken mit renderOrder 0) zeichnen, sonst malten Bäume über sie; nach Sternen und Korona
    trees.renderOrder = -50;
    // Von hinten nach vorn sortieren (für die weichen Ränder), wenn sich die Kamera merklich bewegt hat
    const order = spots.map((_, i) => i), key = new Float32Array(spots.length), matrices = Float32Array.from(trees.instanceMatrix.array), lastCam = new THREE.Vector3(1e9, 0, 0);
    const sortTrees = () => {
      if (camera.position.distanceToSquared(lastCam) < 1) return;
      lastCam.copy(camera.position);
      const { x, z } = camera.position;
      for (let i = 0; i < key.length; i++) key[i] = (matrices[i * 16 + 12] - x) ** 2 + (matrices[i * 16 + 14] - z) ** 2;
      order.sort((a, b) => key[b] - key[a]);
      const arr = trees.instanceMatrix.array;
      order.forEach((src, dst) => arr.set(matrices.subarray(src * 16, src * 16 + 16), dst * 16));
      trees.instanceMatrix.needsUpdate = true;
    };
    group.add(trees);

    // Kontaktschatten am Boden: Dichte der Kronen um jeden Baum (weiche Scheibe, etwas grösser als die Krone)
    {
      const N = 256, cell = 184 / N, ao = new Float32Array(N * N);
      for (const [x, z] of spots) {
        const ci = (x + 92) / cell, cj = (z + 92) / cell, R = 1.5 / cell;
        for (let j = Math.max(0, Math.floor(cj - R)); j <= Math.min(N - 1, Math.ceil(cj + R)); j++) {
          for (let i = Math.max(0, Math.floor(ci - R)); i <= Math.min(N - 1, Math.ceil(ci + R)); i++) {
            const d2 = ((i - ci) ** 2 + (j - cj) ** 2) / (R * R);
            if (d2 < 1) ao[j * N + i] += (1 - d2) * (1 - d2) * 0.7;
          }
        }
      }
      const data = new Uint8Array(N * N * 4);
      for (let k = 0; k < N * N; k++) { data[k * 4] = Math.min(ao[k], 1) * 255; data[k * 4 + 3] = 255; }
      const tex = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
      tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
      terrainUniforms.uGroundAO.value = tex;
    }

    // Felsbrocken: an steilen Hängen und auf Graten, einzelne in Lichtungen; Granit, oben bemoost, halb im Boden
    const rockSpots = [], rr = mulberry32(606);
    for (let tries = 0; tries < 9000 && rockSpots.length < 110; tries++) {
      const r = 6 + rr() * 60, a = rr() * 2 * Math.PI, x = Math.cos(a) * r, z = Math.sin(a) * r;
      const ground = terrainHeight(x, z), slope = terrainSlope(x, z);
      if (ground < FOREST.fogY - 1 || ground > FOREST.tipMax - 1.5) continue;
      if (rr() > 0.08 + 1.4 * Math.max(slope - 0.2, 0) + 0.3 * (gap(x, z) < 0.3)) continue;
      const size = 0.35 + 1.1 * rr() ** 2;
      if (rockSpots.some((p) => (p.x - x) ** 2 + (p.z - z) ** 2 < (p.size + size) ** 2)) continue;
      rockSpots.push({ x, z, y: ground, size });
    }
    const rockMaterial = new THREE.ShaderMaterial({
      uniforms: forestUniforms, fog: false,
      vertexShader: `varying vec3 vPos, vN, vLocal;
        void main() {
          vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0);
          vPos = wp.xyz; vLocal = position;
          vN = normalize(mat3(modelMatrix * instanceMatrix) * normal);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `uniform float uFade;
        varying vec3 vPos, vN, vLocal;
        ${FOREST_GLSL}
        ${FOREST_SCENE_GLSL}
        void main() {
          vec3 toCam = cameraPosition - vPos;
          float dist = length(toCam);
          vec3 b = texture2D(uNoise, vPos.xz * 0.9 + vPos.y * 0.3).rgb - 0.5;
          vec3 N = normalize(normalize(vN) + vec3(b.x, b.z * 0.5, b.y) * 0.8);
          float n = texture2D(uNoise, vLocal.xz * 0.8 + vLocal.y * 0.5).a;
          vec3 alb = vec3(0.22, 0.22, 0.21) * (0.7 + 0.5 * n);                                  // Granit
          alb = mix(alb, vec3(0.05, 0.08, 0.045), smoothstep(0.55, 0.85, N.y + 0.3 * (n - 0.5))); // Moos oben
          alb *= 0.55 + 0.45 * smoothstep(-0.4, 0.4, vLocal.y);                                  // unten verdeckt
          float moon = max(dot(N, FOREST_MOON), 0.0) * objectShadow(vPos + normalize(vN) * 0.12, 0.0015);
          vec3 col = alb * (MOON_COL * 1.4 * moon + NIGHT_AMB * 3.0 * (0.5 + 0.5 * N.y));
          gl_FragColor = vec4(mistify(col, vPos, toCam / dist, dist) * uFade, 1.0);
        }`,
    });
    const rocks = [0, 1].map((v) => {
      const list = rockSpots.filter((_, k) => k % 2 === v);
      const mesh = noPick(new THREE.InstancedMesh(createRockGeometry(11 + v), rockMaterial, list.length));
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
      list.forEach((p, k) => {
        e.set((rr() - 0.5) * 0.4, rr() * 6.3, (rr() - 0.5) * 0.4);
        m.compose(new THREE.Vector3(p.x, p.y - 0.25 * p.size, p.z), q.setFromEuler(e), new THREE.Vector3(p.size, p.size * (0.6 + 0.4 * rr()), p.size * (0.8 + 0.4 * rr())));
        mesh.setMatrixAt(k, m);
      });
      mesh.renderOrder = 1;
      group.add(mesh);
      return mesh;
    });

    // Schattenkarte des Mondes: Bäume (Flächen zum Mond gedreht) und Gelände (die Kämme beschatten Täler und Nebel)
    const casters = new THREE.Scene();
    const treeCaster = new THREE.InstancedMesh(trees.geometry, new THREE.ShaderMaterial({
      uniforms: treeUniforms,
      vertexShader: `${FOREST_GLSL}
        ${IMPOSTOR_VERTEX}
        void main() { gl_Position = projectionMatrix * viewMatrix * impostorPlace(FOREST_MOON, true); }`,
      fragmentShader: `${IMPOSTOR_FRAGMENT}
        #include <packing>
        void main() {
          vec3 a, n; float d;
          if (impostorSample(false, a, n, d) < 0.5) discard;
          gl_FragColor = packDepthToRGBA(gl_FragCoord.z);
        }`,
    }), trees.count);
    treeCaster.instanceMatrix = trees.instanceMatrix;
    treeCaster.frustumCulled = false;
    casters.add(treeCaster);
    for (const mesh of rocks) {
      const proxy = new THREE.InstancedMesh(mesh.geometry, new THREE.ShaderMaterial({
        fragmentShader: SHADOW_DEPTH_FRAGMENT,
        vertexShader: 'void main() { gl_Position = projectionMatrix * viewMatrix * modelMatrix * instanceMatrix * vec4(position, 1.0); }',
      }), mesh.count);
      proxy.instanceMatrix = mesh.instanceMatrix;
      proxy.frustumCulled = false;
      casters.add(proxy);
    }
    casters.add(new THREE.Mesh(terrain.geometry, new THREE.ShaderMaterial({
      fragmentShader: SHADOW_DEPTH_FRAGMENT,
      vertexShader: 'void main() { gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0); }',
    })));
    bakeShadowMap(casters, new THREE.Box3(new THREE.Vector3(-92, FOREST.fogY - 1, -92), new THREE.Vector3(92, 0, 92)),
      FOREST_MOON, FOREST.shadowSize, forestUniforms);

    // Glühwürmchen zwischen den Wipfeln, unter der Brettebene, ausserhalb der Platte: klein und gelbgrün, mit weichem
    // Schein, leuchten unregelmässig auf (etwa eine halbe Sekunde, dann eine Weile dunkel)
    const n = FOREST.fireflies, pos = new Float32Array(n * 3), seed = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const r = 6.5 + rand() * 16, a = rand() * 2 * Math.PI, x = Math.cos(a) * r, z = Math.sin(a) * r;
      pos.set([x, Math.min(terrainHeight(x, z) + 1.5 + rand() * 2.5, -1.2), z], i * 3);
      seed[i] = rand();
    }
    const flyGeo = new THREE.BufferGeometry();
    flyGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    flyGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    const flies = noPick(new THREE.Points(flyGeo, new THREE.ShaderMaterial({
      uniforms: { ...forestUniforms, uPixelRatio: { value: renderer.getPixelRatio() } },
      transparent: true, depthWrite: false, fog: false,
      blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
      blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
      vertexShader: `attribute float aSeed;
        uniform float uTime, uFade, uPixelRatio;
        varying float vGlow;
        void main() {
          float t = uTime * (0.2 + 0.15 * aSeed) + aSeed * 60.0;
          vec3 p = position + vec3(sin(t) * 1.2 + sin(t * 0.37) * 0.7, sin(t * 0.7 + 1.0) * 0.4, cos(t * 0.83) * 1.2);
          p.y = min(p.y, -1.0); // nie über die Brettebene
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          float ph = fract(uTime * (0.25 + 0.2 * aSeed) + aSeed * 7.0);
          float blink = smoothstep(0.0, 0.08, ph) * smoothstep(0.3, 0.12, ph); // kurz an, lange aus
          vGlow = blink * uFade;
          gl_PointSize = 9.0 * uPixelRatio * 40.0 / -mv.z;
        }`,
      fragmentShader: `varying float vGlow;
        void main() {
          float r = length(gl_PointCoord - 0.5) * 2.0;
          float core = smoothstep(0.3, 0.0, r), halo = exp(-r * r * 6.0) * 0.35;
          gl_FragColor = vec4((vec3(0.85, 1.0, 0.35) * core * 2.2 + vec3(0.35, 0.6, 0.15) * halo) * vGlow, 0.0);
        }`,
    })));
    flies.renderOrder = 6;
    group.add(flies);
    return { flies, sortTrees };
  }

  let parts = null;
  return {
    group,
    /** Erst bauen, wenn der Wald gewählt wird (kostet einen Moment Rechenzeit). */
    prepare() {
      if (parts) return;
      parts = build();
      // Shader gleich übersetzen, nicht erst im ersten Bild nach dem Einblenden
      const visible = group.visible;
      group.visible = true;
      renderer.compile(scene, camera);
      group.visible = visible;
      if (volFog) volFog.precompile();
    },
    show(visible) {
      if (visible) this.prepare();
      group.visible = visible;
    },
    update(t) {
      forestUniforms.uTime.value = t;
      parts.flies.material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
      parts.sortTrees();
    },
  };
})();
scene.add(forest.group);

/* =====================================================================
   VOLUMETRISCHER NEBEL (Wald) — ersetzt das flache Nebelmeer (fogSea) und die Schwaden (wisps)
   ---------------------------------------------------------------------
   Nur wenn Tiefentexturen gehen (VOLFOG_ON); sonst bleiben Nebelmeer und Schwaden (fogSea, wisps im WALD-Abschnitt).
   Abhängigkeiten: THREE r147 inkl. EffectComposer.js (THREE.Pass, THREE.FullScreenQuad). Keine globalen Variablen
   ausser THREE – alles Weitere kommt über createVolumetricFog(opts).

   Ablauf je Bild (nur wenn der Wald sichtbar ist, sonst nichts ausser einem Uniform):
     1. RenderPass zeichnet die Szene wie bisher in composer.readBuffer – der hat jetzt eine DepthTexture
        (DepthStencilFormat / UnsignedInt248Type: dieselben 24 Bit Tiefe + 8 Bit Stencil wie bisher).
     2. VolumetricFogPass (needsSwap = false, zeichnet nicht in die Composer-Puffer):
        a) "range" (1/2 bzw. 1/4 Auflösung): nächste und fernste Szenentiefe je Texel (VOLFOG_ZRANGE_FRAGMENT).
        b) "march" zweimal, bis zur nächsten und bis zur fernsten Tiefe: je Texel der Sichtstrahl durch das
           Nebelband [fogY − 8, fogY + 4]; 10–16 Schritte mit Versatz (interleaved gradient noise), Abbruch bei
           Transmission < 0,02. Ausgabe vormultipliziert: rgb = gestreutes Licht, a = 1 − Transmission.
        c) "denoise" je Ergebnis: 5er-Kreuz, tiefengewichtet – glättet das Rauschen des Versatzes, ohne über Kanten
           zu verwischen.
     3. FinalShader (Bild auf den Schirm): je Pixel aus den 4 nächsten Nebeltexeln, zwischen nah und fern nach der
        eigenen Tiefe gemischt, gewichtet nach dem Abstand zum Tiefenbereich des Texels; mischt rgb·(1 − a) + Nebel.
        Kein Feedback-Loop: der letzte Pass zeichnet auf den Schirm, die Tiefentextur hängt an keinem gebundenen
        Puffer. Kein zusätzlicher Vollbild-Puffer, kein zusätzlicher Vollbild-Pass.
   Hinweis Bloom: der Nebel kommt nach dem Bloom ins Bild; Nebelwerte < 1 blühen ohnehin nicht. Leuchtsäume von
   Strahlen reichen praktisch nie bis über das Nebelband (die Kuppe unter dem Brett liegt darüber).
   ===================================================================== */

/** Qualitätsstufen. div: Teiler der Auflösung, steps: Schritte je Strahl, lightSample: 1 Lichtprobe zum Mond je
 *  Schritt (2 Abrufe mehr), denoise: Entrauschen. */
const VOLFOG_TIERS = {
  high: { div: 2, steps: 16, lightSample: 1, denoise: 1 }, // Desktop
  low: { div: 4, steps: 10, lightSample: 0, denoise: 1 },  // Handy
};

const VOLFOG = {
  top: 4, bottom: 8,   // Nebelband relativ zu FOREST.fogY (oben / unten)
  relief: 5,           // Höhenunterschied der Oberfläche zwischen Bänken und Gassen
  lane: 0.25,          // Dichte in den Gassen gegenüber den Bänken (dort scheint der Wald durch)
  sigma: 0.9,          // Extinktion im dichten Nebel (1/Einheit): ~1,1 Einheiten bis 1/e – Bäume versinken weich
  haze: 0.05,          // dünner Dunst über der Oberfläche (macht Lichtbahnen und Schattengassen sichtbar)
  direct: 1.0,         // direktes Mondlicht (mit Phase, Schatten, Selbstschatten), × MOON_COL
  multi: 0.3,          // Mehrfachstreuung: der Nebel leuchtet auch im Schatten von innen, × MOON_COL
  amb: 3.0,            // Himmelslicht, × NIGHT_AMB
  g: 0.6,              // Henyey-Greenstein: Vorwärtsstreuung zum Mond hin
  gMix: 0.3,           // Anteil HG gegenüber isotrop
};

/** DepthTexture für das Composer-Ziel (vor `new THREE.EffectComposer(renderer, rt)` setzen; der Klon teilt sie, siehe createComposer). */
function volfogDepthTexture() {
  const tex = new THREE.DepthTexture(1, 1);
  tex.format = THREE.DepthStencilFormat; // wie bisher stencilBuffer: true → 24 Bit Tiefe
  tex.type = THREE.UnsignedInt248Type;
  return tex;
}

/**
 * 3D-Rauschen in einer 2D-Textur (WebGL1 kennt keine 3D-Texturen): R = kachelbares Rauschen, G = dasselbe um
 * (37, 17) verschoben. Eine bilineare Abfrage liefert so zwei benachbarte z-Schichten, im Shader nach z gemischt
 * (Trick nach Íñigo Quilez). 128² RGBA8 = 64 kB.
 */
function createVolfogNoise(size = 128) {
  let seed = 4711;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const white = Float32Array.from({ length: size * size }, rand);
  const at = (x, y) => white[((y % size + size) % size) * size + ((x % size + size) % size)];
  // leicht weichzeichnen (3×3, kachelbar): weniger rautenförmige Treppen der bilinearen Filterung
  const soft = new Float32Array(size * size);
  let lo = Infinity, hi = -Infinity;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const v = (4 * at(x, y) + 2 * (at(x - 1, y) + at(x + 1, y) + at(x, y - 1) + at(x, y + 1)) +
        at(x - 1, y - 1) + at(x + 1, y - 1) + at(x - 1, y + 1) + at(x + 1, y + 1)) / 16;
      soft[y * size + x] = v; lo = Math.min(lo, v); hi = Math.max(hi, v);
    }
  }
  const norm = (v) => (v - lo) / (hi - lo); // auf 0 … 1 strecken
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      data[i] = norm(soft[y * size + x]) * 255;
      data[i + 1] = norm(soft[((y + 17) % size) * size + (x + 37) % size]) * 255;
      data[i + 2] = 0; data[i + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.minFilter = tex.magFilter = THREE.LinearFilter; // keine Mipmaps: die Abfragen springen je Schicht
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

const VOLFOG_VERTEX = `varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

/** Raymarch-Shader. sceneGLSL = FOREST_GLSL + FOREST_SCENE_GLSL (FOG_Y, MOON_COL, NIGHT_AMB, forestMist, forestHaze,
 *  uShadow/uShadowMat, unpackRGBAToDepth, uTime). */
const volfogMarchFragment = (sceneGLSL, tier) => `
  #define VF_STEPS ${tier.steps}
  #define VF_LIGHT_SAMPLE ${tier.lightSample}
  ${sceneGLSL}
  uniform sampler2D tDepth, tVolNoise; // tDepth: nächste und fernste Tiefe je Texel (VOLFOG_ZRANGE_FRAGMENT)
  uniform float uFar; // 1: Nebel bis zur fernsten Tiefe, 0: bis zur nächsten
  ${VOLFOG_DEPTH_GLSL}
  uniform mat4 uInvProj, uCamWorld;
  uniform vec3 uCamPos;
  uniform float uTop, uBottom, uRelief, uLane, uSigma, uHaze, uDirect, uMulti, uAmb, uG, uGMix;
  varying vec2 vUv;

  const vec2 FLOW = vec2(0.94, 0.34);     // Zugrichtung wie bisher im Nebelmeer

  float noise3(vec3 p) {
    float iz = floor(p.z), f = p.z - iz;
    vec2 rg = texture2D(tVolNoise, (p.xy + vec2(37.0, 17.0) * iz + 0.5) / 128.0).rg;
    return mix(rg.r, rg.g, f * f * (3.0 - 2.0 * f));
  }
  // Dichte an p (x) und Tiefe unter der Oberfläche (y, negativ darüber). Oberfläche: lange Schlieren in Zugrichtung
  // (gestreckt ~4:1) plus kleinere Wogen; beide ziehen langsam und wandeln sich (Zeit auch in der 3. Achse).
  vec2 fogDensity(vec3 p) {
    vec2 q = vec2(dot(p.xz, FLOW), dot(p.xz, vec2(-FLOW.y, FLOW.x)));
    float streak = noise3(vec3(q.x * 0.045 - uTime * 0.035, q.y * 0.19, p.y * 0.12 + uTime * 0.008));
    float billow = noise3(vec3(q.x * 0.21 - uTime * 0.08, q.y * 0.21 + 31.0, p.y * 0.3 - uTime * 0.02));
    streak = smoothstep(0.15, 0.85, streak); // mehr Kontrast: deutliche Bänke und Gassen
    float surface = FOG_Y + uRelief * (streak - 0.5) + 2.0 * (billow - 0.5);
    float below = surface - p.y;
    // Sigmoid-Oberkante (weich über ~1,6 Einheiten), darunter dicht; in den Gassen zwischen den Bänken dünner
    float d = uSigma * smoothstep(-0.8, 0.8, below) * (uLane + (1.0 - uLane) * streak);
    d += uHaze * exp(-max(p.y - FOG_Y, 0.0) * 0.3); // dünner Dunst über dem Meer: Lichtbahnen
    return vec2(d, below);
  }
  // Mondschatten mit einer einzigen Abfrage (Versatz der Schritte und Entrauschen machen ihn weich)
  float moonLit1(vec3 p) {
    vec3 c = (uShadowMat * vec4(p, 1.0)).xyz * 0.5 + 0.5;
    if (c.x < 0.0 || c.x > 1.0 || c.y < 0.0 || c.y > 1.0) return 1.0;
    return step(c.z - 0.003, unpackRGBAToDepth(texture2D(uShadow, c.xy)));
  }
  float henyeyGreenstein(float c, float g) { // normiert auf isotrop = 1
    float g2 = g * g;
    return (1.0 - g2) / pow(1.0 + g2 - 2.0 * g * c, 1.5);
  }

  void main() {
    // Szenentiefe: die nächste oder die fernste im Texel (zwischen beiden mischt das Hochskalieren im FinalShader)
    vec4 zr = texture2D(tDepth, vUv);
    float z = volfogUnpack16(uFar > 0.5 ? zr.ba : zr.rg);
    vec4 v = uInvProj * vec4(vUv * 2.0 - 1.0, z * 2.0 - 1.0, 1.0);
    v.xyz /= v.w;
    vec3 rd = normalize(mat3(uCamWorld) * v.xyz);
    float tScene = min(length(v.xyz), 80.0); // Himmelskugel (Radius 80) schreibt keine Tiefe
    if (rd.y > -1e-3) { gl_FragColor = vec4(0.0); return; }
    float tTop = (FOG_Y + uTop - uCamPos.y) / rd.y, tBot = (FOG_Y - uBottom - uCamPos.y) / rd.y;
    float t0 = max(tTop, 0.0), t1 = min(tBot, tScene);
    if (t1 <= t0) { gl_FragColor = vec4(0.0); return; } // Strahl endet über dem Band (Brett, Kuppe, Wipfel)

    float dt = (t1 - t0) / float(VF_STEPS);
    float jitter = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
    float t = t0 + dt * jitter;
    float phase = mix(1.0, henyeyGreenstein(dot(rd, FOREST_MOON), uG), uGMix);
    vec3 mist = forestMist(rd);
    vec3 ambient = MOON_COL * uMulti + NIGHT_AMB * uAmb;
    float T = 1.0;
    vec3 L = vec3(0.0), S = ambient;
    for (int i = 0; i < VF_STEPS; i++) {
      vec3 p = uCamPos + rd * t;
      vec2 d = fogDensity(p);
      // Selbstschatten. Mit Lichtprobe: Dichte ein Stück zum Mond hin (Wogen auf der Mondseite hell, im Lee
      // dunkel). Ohne: Tiefe unter der Oberfläche / sin(Mondhöhe) (keine Abfrage)
      #if VF_LIGHT_SAMPLE
        float self = exp(-(0.5 * d.x + fogDensity(p + FOREST_MOON * 1.4).x) * 1.26);
      #else
        float self = exp(-max(d.y, 0.0) * uSigma * 0.7 / FOREST_MOON.y);
      #endif
      // unten im Nebel dunkler (auch die Mehrfachstreuung nimmt ab)
      float deep = exp(-max(d.y, 0.0) * 0.25);
      S = MOON_COL * (uDirect * phase * moonLit1(p) * self) + ambient * (0.4 + 0.6 * deep);
      S = mix(S, mist, forestHaze(p, t)); // in der Ferne derselbe Dunst wie Gelände und Himmel
      float a = exp(-d.x * dt);
      L += T * S * (1.0 - a);
      T *= a;
      if (T < 0.02) break;
      t += dt;
    }
    if (tBot < tScene) { L += T * S; T = 0.0; } // unter dem Band: undurchsichtig
    gl_FragColor = vec4(L, 1.0 - T);
  }`;

// Tiefe → Abstand entlang der Blickachse (positiv); für Gewichte reicht das
const VOLFOG_DEPTH_GLSL = `
  uniform vec2 uFogNearFar;
  float volfogViewZ(float z) { return uFogNearFar.x * uFogNearFar.y / (uFogNearFar.y - z * (uFogNearFar.y - uFogNearFar.x)); }
  // Tiefe (0 … 1) in zwei Bytes und zurück: die nächste und die fernste je Nebeltexel in einem RGBA8-Ziel
  vec2 volfogPack16(float z) { float v = floor(clamp(z, 0.0, 1.0) * 65535.0 + 0.5), hi = floor(v / 256.0); return vec2(hi, v - hi * 256.0) / 255.0; }
  float volfogUnpack16(vec2 c) { c = floor(c * 255.0 + 0.5); return (c.x * 256.0 + c.y) / 65535.0; }`;

/** Nächste und fernste Tiefe je Nebeltexel aus 5 Proben über seine Fläche (rg: nächste, ba: fernste). In einer
 *  Fichtenkrone liegen Nadeln und, in den Lücken, der Boden weit dahinter im Nebel nebeneinander: Mit einer einzigen
 *  Probe an der Texelmitte bekam der Baum mal dessen dichten Nebel ab, mal nicht – er flackerte bei jeder Bewegung.
 *  Darum rechnet der Marsch den Nebel bis zu beiden Tiefen, und jedes Pixel mischt nach seiner eigenen. */
const VOLFOG_ZRANGE_FRAGMENT = `
  uniform sampler2D tDepth;
  uniform vec2 uTexel; // Grösse eines Nebeltexels in uv
  varying vec2 vUv;
  ${VOLFOG_DEPTH_GLSL}
  void main() {
    float a = texture2D(tDepth, vUv).x;
    float b = texture2D(tDepth, vUv + uTexel * vec2(-0.3, -0.3)).x, c = texture2D(tDepth, vUv + uTexel * vec2(0.3, -0.3)).x;
    float d = texture2D(tDepth, vUv + uTexel * vec2(-0.3, 0.3)).x, e = texture2D(tDepth, vUv + uTexel * vec2(0.3, 0.3)).x;
    float lo = min(min(a, b), min(min(c, d), e)), hi = max(max(a, b), max(max(c, d), e));
    gl_FragColor = vec4(volfogPack16(lo), volfogPack16(hi));
  }`;

/** Entrauschen in niedriger Auflösung: Kreuz aus 5 Texeln, Gewicht nach Tiefenähnlichkeit (uFar: an der fernsten
 *  statt an der nächsten Tiefe). */
const VOLFOG_DENOISE_FRAGMENT = `
  uniform sampler2D tFog, tRange;
  uniform vec2 uTexel;
  uniform float uFar;
  varying vec2 vUv;
  ${VOLFOG_DEPTH_GLSL}
  float rangeZ(vec2 uv) { vec4 r = texture2D(tRange, uv); return volfogViewZ(volfogUnpack16(uFar > 0.5 ? r.ba : r.rg)); }
  void main() {
    float zc = rangeZ(vUv);
    vec4 sum = texture2D(tFog, vUv) * 2.0;
    float wsum = 2.0;
    for (int k = 0; k < 4; k++) {
      vec2 o = k == 0 ? vec2(uTexel.x, 0.0) : k == 1 ? vec2(-uTexel.x, 0.0) : k == 2 ? vec2(0.0, uTexel.y) : vec2(0.0, -uTexel.y);
      float dz = (rangeZ(vUv + o) - zc) / zc;
      float w = 1.0 / (1.0 + dz * dz * 400.0); // 5 % Tiefenunterschied → halbes Gewicht
      sum += texture2D(tFog, vUv + o) * w;
      wsum += w;
    }
    gl_FragColor = sum / wsum;
  }`;

/**
 * Für den FinalShader: Uniforms und Funktion volfog(uv) → vormultiplizierter Nebel (rgb, a = Deckung). Je Nebeltexel
 * gibt es den Nebel bis zur nächsten und bis zur fernsten Tiefe; das Pixel mischt nach seiner eigenen Tiefe zwischen
 * beiden (stetig – nichts springt, wenn sich die Kamera ein wenig bewegt). Die 4 Texel um uv werden bilinear gewichtet,
 * dazu nach dem Abstand der Pixeltiefe von ihrem Tiefenbereich (Silhouetten von Kämmen und Wipfeln bleiben scharf).
 */
const VOLFOG_FINAL_GLSL = () => `
  uniform sampler2D tFog, tFogFar, tFogDepth, tFogRange;
  uniform vec2 uFogSize;
  uniform float uFogOn;   // 0: kein Nebel (anderer Hintergrund), sonst Einblendung (uFade des Waldes)
  ${VOLFOG_DEPTH_GLSL}
  vec4 volfogTexel(vec2 c, float zc, out float w) {
    vec4 r = texture2D(tFogRange, c);
    float lo = volfogViewZ(volfogUnpack16(r.rg)), hi = volfogViewZ(volfogUnpack16(r.ba));
    float k = clamp((zc - lo) / max(hi - lo, 1e-3), 0.0, 1.0);
    float off = (max(lo - zc, 0.0) + max(zc - hi, 0.0)) / zc; // ausserhalb des Bereichs: passt schlechter
    w = 1.0 / (1e-3 + off * off);
    return mix(texture2D(tFog, c), texture2D(tFogFar, c), k);
  }
  vec4 volfog(vec2 uv) {
    if (uFogOn <= 0.0) return vec4(0.0);
    if (texture2D(tFogFar, uv).a < 0.002) return vec4(0.0); // ohne Nebel ringsum (Brett, Kuppe): 1 Abruf
    float zc = volfogViewZ(texture2D(tFogDepth, uv).x);
    vec2 st = uv * uFogSize - 0.5, i = floor(st), f = st - i;
    vec4 acc = vec4(0.0);
    float wsum = 0.0;
    for (int k = 0; k < 4; k++) {
      vec2 o = vec2(k == 1 || k == 3 ? 1.0 : 0.0, k >= 2 ? 1.0 : 0.0);
      float wd;
      vec4 fog = volfogTexel((i + o + 0.5) / uFogSize, zc, wd);
      float w = (mix(1.0 - f.x, f.x, o.x) * mix(1.0 - f.y, f.y, o.y) + 1e-3) * wd;
      acc += fog * w;
      wsum += w;
    }
    return acc / wsum * uFogOn;
  }`;

/** Uniforms des Nebels im FinalShader (VOLFOG_FINAL_GLSL). */
function volfogFinalUniforms() {
  return {
    tFog: { value: null }, tFogFar: { value: null }, tFogDepth: { value: null }, tFogRange: { value: null },
    uFogSize: { value: new THREE.Vector2(1, 1) }, uFogNearFar: { value: new THREE.Vector2(1, 120) }, uFogOn: { value: 0 },
  };
}

/**
 * Erzeugt den Pass. opts:
 *   renderer, camera, uniforms (forestUniforms), sceneGLSL (FOREST_GLSL + FOREST_SCENE_GLSL), tier (VOLFOG_TIERS.*),
 *   isActive() → bool (Wald sichtbar), halfFloat (bool: Nebelziele in HalfFloat), finalUniforms (uniforms des
 *   finalPass, siehe volfogFinalUniforms)
 */
function createVolumetricFog({ renderer, camera, uniforms, sceneGLSL, tier, isActive, halfFloat, finalUniforms }) {
  const target = () => new THREE.WebGLRenderTarget(1, 1, {
    type: halfFloat ? THREE.HalfFloatType : THREE.UnsignedByteType,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false,
    depthBuffer: false, stencilBuffer: false,
  });
  // Nebel bis zur nächsten (near) und zur fernsten Tiefe (far) je Texel; roh und entrauscht
  const near = [target(), tier.denoise ? target() : null], far = [target(), tier.denoise ? target() : null];
  const range = new THREE.WebGLRenderTarget(1, 1, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false, depthBuffer: false, stencilBuffer: false,
  });
  const nearFar = { value: new THREE.Vector2(1, 120) };
  const rangeMaterial = new THREE.ShaderMaterial({
    uniforms: { tDepth: { value: null }, uTexel: { value: new THREE.Vector2() }, uFogNearFar: nearFar },
    vertexShader: VOLFOG_VERTEX, fragmentShader: VOLFOG_ZRANGE_FRAGMENT, depthTest: false, depthWrite: false,
  });
  const P = VOLFOG;
  const march = new THREE.ShaderMaterial({
    uniforms: {
      ...uniforms, // gemeinsame Objekte: uTime, uShadow, uShadowMat, uNoise, uFade
      tDepth: { value: range.texture },
      uFar: { value: 0 },
      tVolNoise: { value: createVolfogNoise(128) },
      uInvProj: { value: new THREE.Matrix4() },
      uCamWorld: { value: new THREE.Matrix4() },
      uCamPos: { value: new THREE.Vector3() },
      uFogNearFar: nearFar,
      uTop: { value: P.top }, uBottom: { value: P.bottom }, uRelief: { value: P.relief }, uLane: { value: P.lane },
      uSigma: { value: P.sigma }, uHaze: { value: P.haze }, uDirect: { value: P.direct }, uMulti: { value: P.multi },
      uAmb: { value: P.amb }, uG: { value: P.g }, uGMix: { value: P.gMix },
    },
    vertexShader: VOLFOG_VERTEX,
    fragmentShader: volfogMarchFragment(sceneGLSL, tier),
    depthTest: false, depthWrite: false,
  });
  const denoise = tier.denoise && new THREE.ShaderMaterial({
    uniforms: { tFog: { value: null }, tRange: { value: range.texture }, uTexel: { value: new THREE.Vector2() }, uFar: { value: 0 }, uFogNearFar: nearFar },
    vertexShader: VOLFOG_VERTEX, fragmentShader: VOLFOG_DENOISE_FRAGMENT, depthTest: false, depthWrite: false,
  });
  const quad = new THREE.FullScreenQuad(march);
  finalUniforms.tFog.value = (near[1] || near[0]).texture;
  finalUniforms.tFogFar.value = (far[1] || far[0]).texture;
  finalUniforms.tFogRange.value = range.texture;
  const draw = (target, material) => { renderer.setRenderTarget(target); quad.material = material; quad.render(renderer); };

  class VolumetricFogPass extends THREE.Pass {
    constructor() { super(); this.needsSwap = false; }
    render(renderer, writeBuffer, readBuffer) {
      const on = isActive() && readBuffer.depthTexture ? uniforms.uFade.value : 0;
      finalUniforms.uFogOn.value = on;
      if (on <= 0) return;
      const w = readBuffer.width, h = readBuffer.height;
      const fw = Math.max(1, Math.ceil(w / tier.div)), fh = Math.max(1, Math.ceil(h / tier.div));
      if (range.width !== fw || range.height !== fh) {
        for (const t of [...near, ...far, range]) if (t) t.setSize(fw, fh);
      }
      const u = march.uniforms;
      u.uInvProj.value.copy(camera.projectionMatrixInverse);
      u.uCamWorld.value.copy(camera.matrixWorld);
      u.uCamPos.value.setFromMatrixPosition(camera.matrixWorld);
      nearFar.value.set(camera.near, camera.far);
      finalUniforms.uFogNearFar.value.set(camera.near, camera.far);
      finalUniforms.tFogDepth.value = readBuffer.depthTexture;
      finalUniforms.uFogSize.value.set(fw, fh);

      const autoClear = renderer.autoClear;
      renderer.autoClear = false;
      rangeMaterial.uniforms.tDepth.value = readBuffer.depthTexture;
      rangeMaterial.uniforms.uTexel.value.set(1 / fw, 1 / fh);
      draw(range, rangeMaterial);
      for (const [i, pair] of [near, far].entries()) {
        u.uFar.value = i;
        draw(pair[0], march);
        if (denoise) {
          denoise.uniforms.tFog.value = pair[0].texture;
          denoise.uniforms.uFar.value = i;
          denoise.uniforms.uTexel.value.set(1 / fw, 1 / fh);
          draw(pair[1], denoise);
        }
      }
      renderer.autoClear = autoClear;
    }
    dispose() {
      for (const t of [...near, ...far, range]) if (t) t.dispose();
      march.dispose(); rangeMaterial.dispose(); if (denoise) denoise.dispose();
    }
  }

  const compileCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  return {
    pass: new VolumetricFogPass(), march, params: P,
    /** Shader vorab übersetzen (forest.prepare), nicht erst im ersten Bild des Einblendens. */
    precompile() {
      for (const m of [rangeMaterial, march, denoise]) if (m) { quad.material = m; renderer.compile(quad._mesh, compileCam); }
    },
  };
}

const VOLFOG_TIER = IS_MOBILE ? VOLFOG_TIERS.low : VOLFOG_TIERS.high;

/* =====================================================================
   STRAND — vierter Hintergrund: Meer und Küste bei Sonnenuntergang (umschaltbar, siehe skyTheme)
   Das Brett schwebt über einer flachen Lagune vor einem Sandstrand. In der Ausgangsansicht liegt die Küste hinter dem
   Brett, links ragt eine felsige Landzunge ins Meer; nach vorn fällt der Grund über eine Kante ins Tiefe ab (türkis →
   tiefblau). Die Sonne steht tief über dem Meer rechts: Sie streift den Strand von der Seite (lange Schatten der Dünen
   und Felsen), und dreht man die Kamera zu ihr hin, glitzert das Wasser.
   Die Kamera blickt immer von oben – den Himmel sieht man nur gespiegelt (Wasser, polierte Platte). Darum ist das Meer
   kein Netz mit Wellen, sondern wird pro Pixel gerechnet: Dünung analytisch, feine Wellen aus einer kachelbaren
   Normal-Map, deren Mipmaps zugleich das Glitzern in der Ferne glätten. Unter Wasser zeichnet das Gelände selbst das
   Wasser darüber (es kennt die Tiefe), weiter draussen die Himmelskugel (Strahl bis zur Wasserfläche) – beide mit
   derselben Funktion, damit kein Rand sichtbar wird. Alles berechnet, ohne Bilddateien; erst bei der ersten Wahl gebaut.
   ===================================================================== */

const BEACH = {
  waterY: -3,
  sun: new THREE.Vector3(0.92, 0.21, 0.33).normalize(), // gut 12° über dem Horizont
  reach: 104, // Gelände so weit um die Mitte: Die Kamera kreist bis ~25 hinaus, die Himmelskugel deckt ab 79 ab
  swell: [0.16, -0.987], // Laufrichtung der Dünung (aufs Ufer zu)
  shadowSize: 2048, // Schattenkarte der Bäume, Palmen und Felsen (Pixel je Seite)
  veg: [7, 11],  // Bewuchs setzt hinter dem Strand ein: Abstand zur Wasserlinie, ab dem er beginnt und ganz ist
};

/**
 * Kachelbare Wellen für das Meer: RGB = Normale feiner Wellen (Summe von Sinuswellen mit ganzzahligen Wellenzahlen,
 * vorwiegend in einer Richtung), A = kachelbares Rauschen für Schaum, Sandkörnung und Wolken.
 */
function createWaveTexture(size) {
  const rand = mulberry32(91);
  const waves = [];
  while (waves.length < 56) {
    const mag = 2 + 26 * rand() ** 2, ang = (rand() - 0.5) * 2.4;
    const kx = Math.round(Math.sin(ang) * mag), ky = Math.round(Math.cos(ang) * mag);
    if (kx || ky) waves.push([kx, ky, Math.hypot(kx, ky) ** -1.8, rand() * 2 * Math.PI]);
  }
  const n = size * size, sx = new Float32Array(n), sy = new Float32Array(n);
  let sum = 0;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let ax = 0, ay = 0;
      for (const [kx, ky, amp, ph] of waves) {
        const c = amp * Math.cos(2 * Math.PI * (kx * x + ky * y) / size + ph);
        ax += c * kx; ay += c * ky;
      }
      sx[y * size + x] = ax; sy[y * size + x] = ay;
      sum += ax * ax + ay * ay;
    }
  }
  const norm = 0.3 / Math.sqrt(sum / n); // mittlere Steigung
  // Rauschen auf kachelbaren Gittern (Perioden 4 … 32)
  const lattices = [4, 8, 16, 32].map((p) => ({ p, g: Float32Array.from({ length: p * p }, rand) }));
  const lat = ({ p, g }, u, v) => {
    const x = u * p, y = v * p, xi = Math.floor(x), yi = Math.floor(y);
    const fx = x - xi, fy = y - yi, sxx = fx * fx * (3 - 2 * fx), syy = fy * fy * (3 - 2 * fy);
    const at = (i, j) => g[((j % p) + p) % p * p + ((i % p) + p) % p];
    return (at(xi, yi) * (1 - sxx) + at(xi + 1, yi) * sxx) * (1 - syy) + (at(xi, yi + 1) * (1 - sxx) + at(xi + 1, yi + 1) * sxx) * syy;
  };
  const data = new Uint8ClampedArray(n * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = y * size + x;
      const gx = sx[i] * norm, gy = sy[i] * norm, len = Math.hypot(gx, gy, 1);
      data[i * 4] = (-gx / len * 0.5 + 0.5) * 255;
      data[i * 4 + 1] = (-gy / len * 0.5 + 0.5) * 255;
      data[i * 4 + 2] = (1 / len * 0.5 + 0.5) * 255;
      let f = 0;
      lattices.forEach((l, k) => { f += lat(l, x / size, y / size) * 0.5 ** (k + 1); });
      data[i * 4 + 3] = THREE.MathUtils.clamp((f / 0.9375 - 0.5) * 1.6 + 0.5, 0, 1) * 255;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return tex;
}

/**
 * Schaum, kachelbar: R = Schwelle, wie lange ein Punkt Schaum bleibt – je weiter von den Mitten runder Löcher in drei
 * Grössen, desto länger. Wie viel Schaum zu sehen ist, entscheidet
 * im Shader die Dichte: frisch ist alles weiss, dann reisst er zu Zellen, dann zu Fäden auf und verschwindet
 * (foamDissolve). So sehen Schaumfelder in der Brandung von oben aus.
 */
function createFoamTexture(size) {
  const rand = mulberry32(17);
  const cells = (n) => {
    const pts = Float32Array.from({ length: n * n * 2 }, rand);
    return (u, v) => { // Abstand zum nächsten Zellpunkt (Worley), kachelbar
      const x = u * n, y = v * n, xi = Math.floor(x), yi = Math.floor(y);
      let f1 = 9;
      for (let dj = -1; dj <= 1; dj++) {
        for (let di = -1; di <= 1; di++) {
          const cx = xi + di, cy = yi + dj, k = (((cy % n) + n) % n * n + ((cx % n) + n) % n) * 2;
          const d = (x - cx - pts[k]) ** 2 + (y - cy - pts[k + 1]) ** 2;
          if (d < f1) f1 = d;
        }
      }
      return Math.sqrt(f1);
    };
  };
  const big = cells(9), small = cells(22), tiny = cells(55);
  const lattice = (p) => { const g = Float32Array.from({ length: p * p }, rand); return (u, v) => {
    const x = u * p, y = v * p, xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const at = (i, j) => g[((j % p) + p) % p * p + ((i % p) + p) % p], sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return (at(xi, yi) * (1 - sx) + at(xi + 1, yi) * sx) * (1 - sy) + (at(xi, yi + 1) * (1 - sx) + at(xi + 1, yi + 1) * sx) * sy;
  }; };
  const thick = lattice(6), patch = lattice(14);
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      // Löcher: Je weiter ein Punkt von den (verwirbelten) Lochmitten in drei Grössen entfernt ist, desto länger bleibt
      // er Schaum – die Löcher gehen rund auf und wachsen, bis nur Fäden zwischen ihnen übrig sind
      const wu = u + 0.035 * (thick(u, v) - 0.5), wv = v + 0.035 * (thick(v + 0.37, u + 0.71) - 0.5);
      const holes = Math.min(big(wu, wv) / 0.62, 0.85 * small(wu, wv) / 0.62 + 0.25, 0.7 * tiny(u, v) / 0.62 + 0.45);
      const i = (y * size + x) * 4;
      data[i] = Math.max(0, Math.min(1, holes * (0.8 + 0.2 * patch(u, v)))) * 255;
      data[i + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}

/**
 * Palme (Höhe 1, Fuss im Ursprung, lehnt in +x): gebogener Stamm, oben dünner, und ein Schopf Wedel – jeder ein
 * gebogener Stiel mit gefiederten Blättchen, die beidseits nach unten hängen (von oben die typische Sternform). Die

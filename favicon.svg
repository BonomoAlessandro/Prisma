<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Geometrie (Schrägprojektion): Vorderdreieck A(232,104) B(118,354) C(346,354),
    Tiefe d = (56,−38) → A'(288,66) B'(174,316) C'(402,316). Das Prisma liegt mit der
    Grundfläche B C C' B' auf dem Boden; die Höhe der Spitzen über dem Boden ist 250.
    Spiegelung: jeder Punkt an seinem eigenen Bodenpunkt (vorne y = 354, hinten y = 316,
    halbe Tiefe y = 335) → A↦(232,604), A'↦(288,566); B, C, B', C' liegen auf dem Boden.
    Licht: Eintritt P(196,225) mitten in der verdeckten linken Fläche, Austritt E(325,227)
    mitten in der rechten Fläche (beide in halber Tiefe). Die Zerlegung beginnt im Glas;
    der Fächer bleibt über dem Boden (unterster Rand bei halber Tiefe knapp über y = 335).
  -->
  <defs>
    <radialGradient id="bg" cx="44%" cy="30%" r="85%">
      <stop offset="0" stop-color="#221d4a"/>
      <stop offset="0.5" stop-color="#0d0b22"/>
      <stop offset="1" stop-color="#030308"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1838" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#151331" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#050410"/>
    </linearGradient>

    <!-- Glasflächen -->
    <linearGradient id="front" x1="0.3" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e9ebff" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#9aa3ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4b4fc4" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="side" gradientUnits="userSpaceOnUse" x1="250" y1="80" x2="400" y2="340">
      <stop offset="0" stop-color="#7a80ee" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#34359a" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#15144a" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="rimFront" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="354">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4c8ff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Spektrum (aussen) und Licht im Glas -->
    <linearGradient id="beamIn" gradientUnits="userSpaceOnUse" x1="-10" y1="0" x2="196" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="fanFade" gradientUnits="userSpaceOnUse" x1="325" y1="0" x2="512" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <mask id="fanMask"><rect x="-512" width="1536" height="1024" fill="url(#fanFade)"/></mask>
    <linearGradient id="specIn" gradientUnits="userSpaceOnUse" x1="0" y1="218" x2="0" y2="236">
      <stop offset="0" stop-color="#ff3b4e"/>
      <stop offset="0.18" stop-color="#ff8a2a"/>
      <stop offset="0.34" stop-color="#ffe14a"/>
      <stop offset="0.52" stop-color="#4dff8a"/>
      <stop offset="0.70" stop-color="#3fd8ff"/>
      <stop offset="0.86" stop-color="#4d6bff"/>
      <stop offset="1" stop-color="#a24dff"/>
    </linearGradient>
    <linearGradient id="whiteIn" gradientUnits="userSpaceOnUse" x1="196" y1="0" x2="325" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Spiegelung: ab der Bodenlinie nach unten ausblenden -->
    <linearGradient id="reflFade" gradientUnits="userSpaceOnUse" x1="0" y1="316" x2="0" y2="480">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflMask"><rect width="512" height="512" fill="url(#reflFade)"/></mask>

    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur10" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>

    <!-- Spektrum: sieben Keile; am Austritt so breit wie der Keil im Glas, unterster Rand bleibt über dem Boden -->
    <g id="fan">
      <path d="M325 218.0 L530 238 L530 252 L325 220.6 Z" fill="#ff3b4e"/>
      <path d="M325 220.6 L530 252 L530 266 L325 223.1 Z" fill="#ff8a2a"/>
      <path d="M325 223.1 L530 266 L530 280 L325 225.7 Z" fill="#ffe14a"/>
      <path d="M325 225.7 L530 280 L530 294 L325 228.3 Z" fill="#4dff8a"/>
      <path d="M325 228.3 L530 294 L530 308 L325 230.9 Z" fill="#3fd8ff"/>
      <path d="M325 230.9 L530 308 L530 322 L325 233.4 Z" fill="#4d6bff"/>
      <path d="M325 233.4 L530 322 L530 334 L325 236.0 Z" fill="#a24dff"/>
    </g>
    <!-- Keil im Glas: am Eintritt genau so breit wie der einfallende Strahl (6 px), weiss → farbig -->
    <g id="wedge">
      <path d="M196 222 L325 218 L325 236 L196 228 Z" fill="url(#specIn)" filter="url(#haze)" opacity="0.6"/>
      <path d="M196 222 L325 218 L325 236 L196 228 Z" fill="url(#specIn)" filter="url(#glow)"/>
      <path d="M196 222 L325 218 L325 236 L196 228 Z" fill="url(#whiteIn)"/>
    </g>
    <!-- Einfallender Strahl: endet gerade (butt) an P, wo der Keil mit gleicher Breite ansetzt -->
    <g id="beam">
      <path d="M-10 285 L196 225" stroke="#fff" stroke-opacity="0.35" stroke-width="22" stroke-linecap="butt" filter="url(#haze)"/>
      <path d="M-10 285 L196 225" stroke="url(#beamIn)" stroke-width="6" stroke-linecap="butt" filter="url(#glow)"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect y="300" width="512" height="212" fill="url(#floor)"/>

    <!-- ========== Spiegelung im glänzenden Boden ========== -->
    <g mask="url(#reflMask)">
      <!-- Licht in halber Tiefe: gespiegelt an y = 335 -->
      <g transform="translate(0 670) scale(1 -1)">
        <use href="#beam"/>
        <use href="#wedge" opacity="0.8"/>
        <g mask="url(#fanMask)"><use href="#fan" filter="url(#glow)"/></g>
      </g>
      <!-- Flächen mit korrekt gespiegelten Ecken -->
      <path d="M232 604 L288 566 L402 316 L346 354 Z" fill="#3a3da8" fill-opacity="0.45"/>
      <path d="M232 604 L346 354 L118 354 Z" fill="#9aa3ff" fill-opacity="0.22"/>
      <path d="M288 566 L402 316 L346 354 M232 604 L288 566" fill="none" stroke="#b9bdff" stroke-opacity="0.5" stroke-width="3" stroke-linejoin="round"/>
      <path d="M232 604 L346 354 L118 354 Z" fill="none" stroke="#dfe2ff" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- Kontaktschatten unter der Grundfläche B C C' B' -->
    <path d="M112 358 L352 358 L410 313 L168 313 Z" fill="#000" opacity="0.55" filter="url(#blur10)"/>

    <!-- ========== Prisma ========== -->
    <use href="#beam"/>
    <!-- Licht im Inneren: hinter den Glasflächen, von ihnen getönt -->
    <circle cx="196" cy="225" r="12" fill="url(#spot)" opacity="0.75"/>
    <use href="#wedge" opacity="0.9"/>

    <path d="M232 104 L288 66 L402 316 L346 354 Z" fill="url(#side)"/>
    <path d="M232 104 L346 354 L118 354 Z" fill="url(#front)"/>

    <!-- Rückseite schimmert durch das Glas; hintere Aussenkanten -->
    <path d="M288 66 L174 316 L402 316 M118 354 L174 316" fill="none" stroke="#aeb3ff" stroke-opacity="0.16" stroke-width="2" stroke-linejoin="round"/>
    <path d="M346 354 L402 316 L288 66" fill="none" stroke="#b9bdff" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Spektrum tritt mitten aus der rechten Seitenfläche -->
    <g mask="url(#fanMask)">
      <use href="#fan" filter="url(#haze)" opacity="0.55"/>
      <use href="#fan" filter="url(#glow)"/>
    </g>
    <circle cx="325" cy="227" r="14" fill="url(#spot)" opacity="0.9"/>

    <!-- vordere Kanten: Grat am hellsten, Vorderdreieck abgestuft -->
    <path d="M232 104 L288 66" stroke="#ffffff" stroke-opacity="0.95" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M232 104 L346 354 L118 354 Z" fill="none" stroke="url(#rimFront)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M229 118 L196 190" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round" filter="url(#blur3)"/>
  </g>
</svg>
